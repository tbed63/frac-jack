<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frac Jack</title>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 25%, rgba(36, 214, 76, 0.5), transparent 28%),
        radial-gradient(circle at 80% 25%, rgba(255, 124, 0, 0.5), transparent 28%),
        linear-gradient(135deg, #08200f, #161616 48%, #351700);
      color: #111;
    }

    .game {
      width: 100vw;
      height: 100vh;
      padding: 10px 14px;
      display: grid;
      grid-template-rows: 92px 78px 1fr 128px;
      gap: 8px;
    }

    /* TOP AREA */

    .top {
      display: grid;
      grid-template-columns: 1fr 260px 1fr;
      gap: 14px;
      align-items: center;
      min-height: 0;
    }

    .player {
      height: 86px;
      background: rgba(255,255,255,0.95);
      border: 4px solid #111;
      border-radius: 18px;
      padding: 10px 16px;
      box-shadow: 0 5px 0 #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .player::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.16;
      pointer-events: none;
    }

    .player.green {
      border-color: #23c84a;
    }

    .player.green::before {
      background: linear-gradient(90deg, #23c84a, transparent);
    }

    .player.orange {
      border-color: #ff7900;
    }

    .player.orange::before {
      background: linear-gradient(270deg, #ff7900, transparent);
    }

    .player.active {
      outline: 5px solid #ffe600;
      outline-offset: 2px;
    }

    .player-name {
      font-size: 22px;
      font-weight: 1000;
      line-height: 1;
      position: relative;
      z-index: 1;
    }

    .score-label {
      font-size: 13px;
      font-weight: 900;
      opacity: 0.7;
      margin-top: 4px;
      position: relative;
      z-index: 1;
    }

    .score {
      font-size: 48px;
      font-weight: 1000;
      line-height: 1;
      position: relative;
      z-index: 1;
    }

    .logo {
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo img {
      max-width: 260px;
      max-height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 7px 8px rgba(0,0,0,0.5));
    }

    /* HERO / MESSAGE AREA */

    .hero-row {
      display: grid;
      grid-template-columns: 1fr 440px 1fr;
      gap: 12px;
      align-items: center;
      min-height: 0;
    }

    .message {
      background: #111;
      color: white;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 20px;
      font-weight: 1000;
      text-align: center;
      border: 3px solid white;
      box-shadow: 0 5px 14px rgba(0,0,0,0.35);
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kids-wrap {
      height: 94px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .kids-wrap img {
      max-height: 145px;
      max-width: 500px;
      object-fit: contain;
      transform: translateY(6px) scale(1.2);
      filter: drop-shadow(0 9px 12px rgba(0,0,0,0.55));
    }

    .mini-rule {
      height: 58px;
      background: rgba(255,255,255,0.88);
      border: 3px solid rgba(255,255,255,0.95);
      border-radius: 16px;
      padding: 8px 12px;
      font-size: 15px;
      font-weight: 900;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 5px 14px rgba(0,0,0,0.22);
    }

    /* BOARD */

    .board {
      min-height: 0;
      background: rgba(255,255,255,0.92);
      border: 4px solid white;
      border-radius: 24px;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.38);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      align-items: stretch;
    }

    .whole {
      min-height: 0;
      background: #fff6dd;
      border: 4px solid #111;
      border-radius: 18px;
      padding: 10px;
      display: grid;
      grid-template-rows: 24px 1fr 22px;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 5px 0 #111;
      transition: 0.12s;
    }

    .whole:hover {
      transform: translateY(-2px);
    }

    .whole-title {
      font-size: 17px;
      font-weight: 1000;
      text-align: center;
      line-height: 1;
    }

    .square {
      width: 100%;
      max-height: 100%;
      aspect-ratio: 1 / 1;
      background: white;
      border: 4px solid #111;
      border-radius: 14px;
      padding: 5px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 4px;
      align-self: center;
      justify-self: center;
    }

    .cell {
      background: #eee4c9;
      border: 2px solid rgba(0,0,0,0.25);
      border-radius: 7px;
    }

    .cell.green {
      background: linear-gradient(145deg, #75ff8b, #23c84a);
    }

    .cell.orange {
      background: linear-gradient(145deg, #ffc46e, #ff7900);
    }

    .whole-status {
      text-align: center;
      font-weight: 900;
      font-size: 13px;
      min-height: 18px;
      line-height: 1;
    }

    /* HANDS */

    .bottom-zone {
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 150px 1fr;
      gap: 12px;
      align-items: stretch;
    }

    .hand {
      min-height: 0;
      background: rgba(255,255,255,0.95);
      border: 4px solid white;
      border-radius: 22px;
      padding: 10px;
      box-shadow: 0 7px 20px rgba(0,0,0,0.35);
      display: grid;
      grid-template-rows: 24px 1fr;
      gap: 8px;
    }

    .hand.green {
      border-color: #23c84a;
    }

    .hand.orange {
      border-color: #ff7900;
    }

    .hand-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: 1000;
      line-height: 1;
    }

    .hand-title span:last-child {
      font-size: 13px;
      opacity: 0.75;
    }

    .pieces {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .piece {
      min-height: 0;
      background: white;
      border: 3px solid #111;
      border-radius: 15px;
      padding: 6px;
      cursor: pointer;
      box-shadow: 0 4px 0 #111;
      display: grid;
      grid-template-rows: 36px 1fr;
      gap: 5px;
      transition: 0.12s;
    }

    .piece:hover {
      transform: translateY(-3px);
    }

    .piece.selected {
      outline: 5px solid #ffe600;
      outline-offset: 2px;
      transform: translateY(-3px);
    }

    .piece.disabled {
      opacity: 0.35;
      pointer-events: none;
      filter: grayscale(70%);
    }

    .green-piece {
      background: linear-gradient(180deg, #eaffee, #ffffff);
    }

    .orange-piece {
      background: linear-gradient(180deg, #fff1df, #ffffff);
    }

    .fraction {
      font-weight: 1000;
      font-size: 20px;
      text-align: center;
      line-height: 0.75;
    }

    .fraction span {
      display: block;
    }

    .bar {
      height: 3px;
      width: 28px;
      background: #111;
      margin: 3px auto;
      border-radius: 99px;
    }

    .mini {
      border: 3px solid #111;
      border-radius: 9px;
      padding: 3px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 2px;
      background: white;
      min-height: 0;
    }

    .mini-cell {
      background: #eee4c9;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.25);
    }

    .green-piece .mini-cell.filled {
      background: #23c84a;
    }

    .orange-piece .mini-cell.filled {
      background: #ff7900;
    }

    /* CONTROLS */

    .controls {
      min-height: 0;
      background: rgba(255,255,255,0.82);
      border: 3px solid white;
      border-radius: 20px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 7px 20px rgba(0,0,0,0.28);
    }

    button {
      background: #111;
      color: white;
      border: none;
      border-radius: 999px;
      padding: 9px 10px;
      font-size: 14px;
      font-weight: 1000;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.35);
    }

    button:hover {
      transform: translateY(-2px);
    }

    .hidden-labels .fraction {
      visibility: hidden;
    }

    /* SMALLER DESKTOP / CHROMEBOOK */

    @media (max-height: 720px) {
      .game {
        grid-template-rows: 82px 62px 1fr 112px;
        gap: 6px;
        padding: 8px 12px;
      }

      .player {
        height: 76px;
        padding: 8px 14px;
      }

      .player-name {
        font-size: 19px;
      }

      .score {
        font-size: 42px;
      }

      .logo img {
        max-height: 82px;
      }

      .message, .mini-rule {
        height: 48px;
        font-size: 17px;
      }

      .mini-rule {
        font-size: 13px;
      }

      .kids-wrap {
        height: 70px;
      }

      .kids-wrap img {
        max-height: 125px;
        transform: translateY(8px) scale(1.15);
      }

      .whole {
        grid-template-rows: 20px 1fr 18px;
        padding: 8px;
      }

      .whole-title {
        font-size: 15px;
      }

      .whole-status {
        font-size: 12px;
      }

      .hand {
        padding: 8px;
        grid-template-rows: 20px 1fr;
      }

      .hand-title {
        font-size: 16px;
      }

      .piece {
        padding: 5px;
        grid-template-rows: 30px 1fr;
      }

      .fraction {
        font-size: 17px;
      }
    }

    @media (max-width: 1050px) {
      html, body {
        overflow: auto;
      }

      .game {
        height: auto;
        min-height: 100vh;
        grid-template-rows: auto auto auto auto;
      }

      .top,
      .hero-row,
      .bottom-zone {
        grid-template-columns: 1fr;
      }

      .kids-wrap {
        height: 140px;
      }

      .kids-wrap img {
        max-height: 180px;
      }

      .board {
        grid-template-columns: repeat(2, 1fr);
      }

      .pieces {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>
  <div class="game" id="game">
    <div class="top">
      <div class="player green active" id="greenPlayer">
        <div>
          <div class="player-name">GREEN TEAM</div>
          <div class="score-label">Score</div>
        </div>
        <div class="score" id="greenScore">0</div>
      </div>

      <div class="logo">
        <img src="frac-jack-logo.png" alt="Frac Jack Logo">
      </div>

      <div class="player orange" id="orangePlayer">
        <div>
          <div class="player-name">ORANGE TEAM</div>
          <div class="score-label">Score</div>
        </div>
        <div class="score" id="orangeScore">0</div>
      </div>
    </div>

    <div class="hero-row">
      <div class="message" id="message">Green Team: choose a piece.</div>

      <div class="kids-wrap">
        <img src="frac-jack-kids.png" alt="Frac Jack Kids">
      </div>

      <div class="mini-rule">
        See the missing space. Jack the whole before your opponent does.
      </div>
    </div>

    <div class="board" id="board"></div>

    <div class="bottom-zone">
      <div class="hand green">
        <div class="hand-title">
          <span>Green Pieces</span>
          <span id="greenLeft">0 left</span>
        </div>
        <div class="pieces" id="greenPieces"></div>
      </div>

      <div class="controls">
        <button onclick="startGame()">New Game</button>
        <button onclick="toggleLabels()" id="labelButton">Hide Labels</button>
      </div>

      <div class="hand orange">
        <div class="hand-title">
          <span>Orange Pieces</span>
          <span id="orangeLeft">0 left</span>
        </div>
        <div class="pieces" id="orangePieces"></div>
      </div>
    </div>
  </div>

  <script>
    var currentPlayer = "green";
    var selectedPieceId = null;
    var labelsShowing = true;

    var greenScore = 0;
    var orangeScore = 0;

    var greenDeck = [];
    var orangeDeck = [];
    var greenHand = [];
    var orangeHand = [];

    var wholes = [];
    var idCounter = 0;

    var pieceOptions = [
      { label: "1/8", top: 1, bottom: 8, units: 1 },
      { label: "1/4", top: 1, bottom: 4, units: 2 },
      { label: "3/8", top: 3, bottom: 8, units: 3 },
      { label: "1/2", top: 1, bottom: 2, units: 4 },
      { label: "5/8", top: 5, bottom: 8, units: 5 },
      { label: "3/4", top: 3, bottom: 4, units: 6 }
    ];

    var weightedPieces = [
      "1/8", "1/8", "1/8", "1/8",
      "1/4", "1/4", "1/4", "1/4",
      "3/8", "3/8", "3/8",
      "1/2", "1/2", "1/2",
      "5/8", "5/8",
      "3/4", "3/4"
    ];

    function makeId() {
      idCounter++;
      return "piece" + idCounter;
    }

    function findPieceTemplate(label) {
      for (var i = 0; i < pieceOptions.length; i++) {
        if (pieceOptions[i].label === label) {
          return pieceOptions[i];
        }
      }
      return pieceOptions[0];
    }

    function makePiece(label) {
      var template = findPieceTemplate(label);
      return {
        id: makeId(),
        label: template.label,
        top: template.top,
        bottom: template.bottom,
        units: template.units
      };
    }

    function makeDeck() {
      var deck = [];

      for (var i = 0; i < 24; i++) {
        var randomLabel = weightedPieces[Math.floor(Math.random() * weightedPieces.length)];
        deck.push(makePiece(randomLabel));
      }

      return shuffle(deck);
    }

    function shuffle(array) {
      var copy = array.slice();

      for (var i = copy.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }

      return copy;
    }

    function startGame() {
      currentPlayer = "green";
      selectedPieceId = null;
      labelsShowing = true;

      greenScore = 0;
      orangeScore = 0;

      greenDeck = makeDeck();
      orangeDeck = makeDeck();

      greenHand = [];
      orangeHand = [];

      for (var i = 0; i < 6; i++) {
        greenHand.push(greenDeck.shift());
        orangeHand.push(orangeDeck.shift());
      }

      wholes = [];

      for (var w = 0; w < 5; w++) {
        wholes.push({
          cells: [null, null, null, null, null, null, null, null],
          filled: 0
        });
      }

      document.body.classList.remove("hidden-labels");
      render();
      setMessage("Green Team: choose a piece.");
    }

    function render() {
      document.getElementById("greenScore").textContent = greenScore;
      document.getElementById("orangeScore").textContent = orangeScore;

      document.getElementById("greenLeft").textContent = greenDeck.length + " left";
      document.getElementById("orangeLeft").textContent = orangeDeck.length + " left";

      document.getElementById("greenPlayer").classList.toggle("active", currentPlayer === "green");
      document.getElementById("orangePlayer").classList.toggle("active", currentPlayer === "orange");

      renderBoard();
      renderHands();

      document.getElementById("labelButton").textContent = labelsShowing ? "Hide Labels" : "Show Labels";
    }

    function renderBoard() {
      var board = document.getElementById("board");
      board.innerHTML = "";

      for (var i = 0; i < wholes.length; i++) {
        var whole = wholes[i];

        var card = document.createElement("div");
        card.className = "whole";
        card.setAttribute("data-index", i);
        card.onclick = function() {
          var index = Number(this.getAttribute("data-index"));
          playPiece(index);
        };

        var title = document.createElement("div");
        title.className = "whole-title";
        title.textContent = "WHOLE " + (i + 1);

        var square = document.createElement("div");
        square.className = "square";

        for (var c = 0; c < 8; c++) {
          var cell = document.createElement("div");
          cell.className = "cell";

          if (whole.cells[c] === "green") {
            cell.classList.add("green");
          }

          if (whole.cells[c] === "orange") {
            cell.classList.add("orange");
          }

          square.appendChild(cell);
        }

        var status = document.createElement("div");
        status.className = "whole-status";
        status.textContent = whole.filled === 0 ? "Empty" : "Partly Filled";

        card.appendChild(title);
        card.appendChild(square);
        card.appendChild(status);

        board.appendChild(card);
      }
    }

    function renderHands() {
      renderOneHand("green", greenHand, document.getElementById("greenPieces"));
      renderOneHand("orange", orangeHand, document.getElementById("orangePieces"));
    }

    function renderOneHand(player, hand, container) {
      container.innerHTML = "";

      for (var i = 0; i < hand.length; i++) {
        var piece = hand[i];

        var div = document.createElement("div");
        div.className = "piece " + player + "-piece";

        if (currentPlayer !== player) {
          div.classList.add("disabled");
        }

        if (selectedPieceId === piece.id) {
          div.classList.add("selected");
        }

        div.setAttribute("data-player", player);
        div.setAttribute("data-id", piece.id);

        div.onclick = function() {
          choosePiece(this.getAttribute("data-player"), this.getAttribute("data-id"));
        };

        var fraction = document.createElement("div");
        fraction.className = "fraction";
        fraction.innerHTML =
          "<span>" + piece.top + "</span>" +
          "<div class='bar'></div>" +
          "<span>" + piece.bottom + "</span>";

        var mini = document.createElement("div");
        mini.className = "mini";

        for (var c = 0; c < 8; c++) {
          var cell = document.createElement("div");
          cell.className = "mini-cell";

          if (c < piece.units) {
            cell.classList.add("filled");
          }

          mini.appendChild(cell);
        }

        div.appendChild(fraction);
        div.appendChild(mini);

        container.appendChild(div);
      }
    }

    function choosePiece(player, id) {
      if (player !== currentPlayer) {
        return;
      }

      selectedPieceId = id;

      if (currentPlayer === "green") {
        setMessage("Green Team: now choose a square.");
      } else {
        setMessage("Orange Team: now choose a square.");
      }

      render();
    }

    function getHand(player) {
      return player === "green" ? greenHand : orangeHand;
    }

    function setHand(player, hand) {
      if (player === "green") {
        greenHand = hand;
      } else {
        orangeHand = hand;
      }
    }

    function getDeck(player) {
      return player === "green" ? greenDeck : orangeDeck;
    }

    function findSelectedPiece() {
      var hand = getHand(currentPlayer);

      for (var i = 0; i < hand.length; i++) {
        if (hand[i].id === selectedPieceId) {
          return hand[i];
        }
      }

      return null;
    }

    function removeSelectedPiece() {
      var hand = getHand(currentPlayer);
      var newHand = [];

      for (var i = 0; i < hand.length; i++) {
        if (hand[i].id !== selectedPieceId) {
          newHand.push(hand[i]);
        }
      }

      setHand(currentPlayer, newHand);
    }

    function drawNewPiece() {
      var deck = getDeck(currentPlayer);
      var hand = getHand(currentPlayer);

      if (deck.length > 0) {
        hand.push(deck.shift());
      }

      setHand(currentPlayer, hand);
    }

    function playPiece(wholeIndex) {
      var piece = findSelectedPiece();

      if (!piece) {
        setMessage("Choose a piece first.");
        return;
      }

      var whole = wholes[wholeIndex];

      if (whole.filled + piece.units > 8) {
        removeSelectedPiece();
        drawNewPiece();

        if (currentPlayer === "green") {
          setMessage("Green Team went over. Piece lost!");
        } else {
          setMessage("Orange Team went over. Piece lost!");
        }

        selectedPieceId = null;
        switchPlayer();
        render();
        return;
      }

      var needed = piece.units;

      for (var i = 0; i < whole.cells.length; i++) {
        if (whole.cells[i] === null && needed > 0) {
          whole.cells[i] = currentPlayer;
          needed--;
        }
      }

      whole.filled += piece.units;

      removeSelectedPiece();
      drawNewPiece();

      if (whole.filled === 8) {
        if (currentPlayer === "green") {
          greenScore++;
          setMessage("Green Team JACKED the whole!");
        } else {
          orangeScore++;
          setMessage("Orange Team JACKED the whole!");
        }

        wholes[wholeIndex] = {
          cells: [null, null, null, null, null, null, null, null],
          filled: 0
        };
      } else {
        if (currentPlayer === "green") {
          setMessage("Green Team placed a piece.");
        } else {
          setMessage("Orange Team placed a piece.");
        }
      }

      selectedPieceId = null;
      switchPlayer();
      render();
      checkGameOver();
    }

    function switchPlayer() {
      currentPlayer = currentPlayer === "green" ? "orange" : "green";
    }

    function setMessage(text) {
      document.getElementById("message").textContent = text;
    }

    function toggleLabels() {
      labelsShowing = !labelsShowing;

      if (labelsShowing) {
        document.body.classList.remove("hidden-labels");
      } else {
        document.body.classList.add("hidden-labels");
      }

      render();
    }

    function checkGameOver() {
      if (greenDeck.length === 0 && orangeDeck.length === 0) {
        var message = "Game over! ";

        if (greenScore > orangeScore) {
          message += "Green Team wins!";
        } else if (orangeScore > greenScore) {
          message += "Orange Team wins!";
        } else {
          message += "It's a tie!";
        }

        setMessage(message + " Final Score: Green " + greenScore + " - Orange " + orangeScore);
      }
    }

    try {
      startGame();
    } catch (error) {
      document.body.innerHTML =
        "<div style='background:white;color:black;font-family:Arial;padding:40px;min-height:100vh;'>" +
        "<h1>Frac Jack Error</h1>" +
        "<p>The page loaded, but the game code hit an error.</p>" +
