<script>
function playPiece(wholeIndex) {
  var piece = findSelectedPiece();

  if (!piece) {
    setMessage("Choose a piece first.");
    return;
  }

  var whole = wholes[wholeIndex];

  if (whole.filled + piece.units > TOTAL_UNITS) {
    removeSelectedPiece();
    drawNewPiece();

    if (currentPlayer === "green") {
      setMessage("Green Team went over. Piece lost!");
    } else {
      setMessage("Orange Team went over. Piece lost!");
    }

    selectedPieceId = null;
    switchPlayer();
    render();
    return;
  }

  var needed = piece.units;

  for (var i = 0; i < whole.cells.length; i++) {
    if (whole.cells[i] === null && needed > 0) {
      whole.cells[i] = currentPlayer;
      needed--;
    }
  }

  whole.filled += piece.units;

  removeSelectedPiece();
  drawNewPiece();

  if (whole.filled === TOTAL_UNITS) {
    var scoringPlayer = currentPlayer;

    if (scoringPlayer === "green") {
      setMessage("Green Team JACKED the whole!");
    } else {
      setMessage("Orange Team JACKED the whole!");
    }

    selectedPieceId = null;
    render();

    setTimeout(function() {
      if (scoringPlayer === "green") {
        greenScore++;
      } else {
        orangeScore++;
      }

      wholes[wholeIndex] = {
        cells: emptyCells(),
        filled: 0
      };

      switchPlayer();
      render();
      checkGameOver();
    }, 1000);

    return;
  }

  if (currentPlayer === "green") {
    setMessage("Green Team placed a piece.");
  } else {
    setMessage("Orange Team placed a piece.");
  }

  selectedPieceId = null;
  switchPlayer();
  render();
  checkGameOver();
}
</script>
