<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frac Jack</title>

  <style>
    :root {
      --green: #23b13f;
      --green-dark: #0b6724;
      --orange: #ff7a00;
      --orange-dark: #b64b00;
      --cream: #fff7df;
      --ink: #171717;
      --panel: rgba(255, 255, 255, 0.94);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 18% 20%, rgba(35,177,63,0.45), transparent 34%),
        radial-gradient(circle at 82% 20%, rgba(255,122,0,0.45), transparent 34%),
        linear-gradient(135deg, #102414, #1b1b1b 45%, #2a1605);
      color: var(--ink);
      min-height: 100vh;
      overflow: hidden;
    }

    .game-shell {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: 145px 1fr 160px;
      padding: 14px 22px 18px;
      gap: 12px;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 1fr 350px 1fr;
      align-items: center;
      gap: 18px;
    }

    .player-card {
      height: 115px;
      border-radius: 22px;
      background: var(--panel);
      border: 4px solid white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      position: relative;
      overflow: hidden;
    }

    .player-card.green {
      border-color: #8cff9d;
    }

    .player-card.orange {
      border-color: #ffc36f;
    }

    .player-card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.18;
      pointer-events: none;
    }

    .player-card.green::before {
      background: linear-gradient(120deg, var(--green), transparent);
    }

    .player-card.orange::before {
      background: linear-gradient(240deg, var(--orange), transparent);
    }

    .player-info {
      position: relative;
      z-index: 1;
    }

    .player-name {
      font-size: 26px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.5px;
    }

    .score {
      font-size: 48px;
      font-weight: 900;
      line-height: 1;
      margin-top: 6px;
    }

    .turn-badge {
      position: relative;
      z-index: 1;
      font-size: 17px;
      font-weight: 900;
      padding: 10px 14px;
      border-radius: 999px;
      background: #111;
      color: white;
      opacity: 0;
      transform: scale(0.85);
      transition: 0.2s;
    }

    .player-card.active .turn-badge {
      opacity: 1;
      transform: scale(1);
    }

    .logo-wrap {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrap img {
      max-height: 140px;
      max-width: 350px;
      object-fit: contain;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,0.55));
    }

    .center-area {
      min-height: 0;
      display: grid;
      grid-template-columns: 250px 1fr 250px;
      gap: 18px;
      align-items: stretch;
    }

    .mascot-panel {
      border-radius: 28px;
      background: rgba(255,255,255,0.12);
      border: 3px solid rgba(255,255,255,0.28);
      box-shadow: inset 0 0 40px rgba(255,255,255,0.08), 0 10px 28px rgba(0,0,0,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .mascot-panel img {
      width: 120%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,0.5));
    }

    .board-panel {
      border-radius: 30px;
      padding: 16px;
      background: rgba(255,255,255,0.92);
      border: 5px solid white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      min-width: 0;
    }

    .message-bar {
      min-height: 46px;
      border-radius: 18px;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 18px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.2px;
    }

    .message-bar.green-msg {
      background: linear-gradient(90deg, var(--green-dark), #111);
    }

    .message-bar.orange-msg {
      background: linear-gradient(90deg, var(--orange-dark), #111);
    }

    .whole-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      align-items: center;
    }

    .whole-card {
      height: 100%;
      min-height: 245px;
      border-radius: 22px;
      background: #fff9e8;
      border: 4px solid #222;
      box-shadow: 0 6px 0 #222, 0 12px 20px rgba(0,0,0,0.22);
      padding: 12px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      cursor: pointer;
      transition: 0.15s;
      position: relative;
      overflow: hidden;
    }

    .whole-card:hover {
      transform: translateY(-2px);
    }

    .whole-title {
      text-align: center;
      font-weight: 900;
      font-size: 18px;
      color: #222;
    }

    .square-model {
      width: 100%;
      aspect-ratio: 1 / 1;
      align-self: center;
      background: white;
      border: 5px solid #111;
      border-radius: 14px;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 4px;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.08);
    }

    .cell {
      border-radius: 7px;
      background: #f3ecd9;
      border: 2px solid rgba(0,0,0,0.2);
    }

    .cell.green-fill {
      background: linear-gradient(145deg, #73ff86, var(--green));
      border-color: var(--green-dark);
    }

    .cell.orange-fill {
      background: linear-gradient(145deg, #ffbd63, var(--orange));
      border-color: var(--orange-dark);
    }

    .whole-footer {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 900;
      color: #333;
    }

    .captured-flash {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 1000;
      color: white;
      text-shadow: 0 4px 0 rgba(0,0,0,0.55);
      z-index: 5;
      text-align: center;
      padding: 12px;
    }

    .whole-card.captured-green .captured-flash {
      display: flex;
      background: rgba(35,177,63,0.92);
    }

    .whole-card.captured-orange .captured-flash {
      display: flex;
      background: rgba(255,122,0,0.92);
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      background: #111;
      color: white;
      box-shadow: 0 5px 0 rgba(0,0,0,0.35);
      transition: 0.12s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.35);
    }

    .small-note {
      color: #333;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      padding-left: 8px;
    }

    .bottom-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      min-height: 0;
    }

    .hand-panel {
      border-radius: 26px;
      background: rgba(255,255,255,0.92);
      border: 4px solid white;
      box-shadow: 0 8px 22px rgba(0,0,0,0.33);
      padding: 14px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .hand-panel.green {
      border-color: #8cff9d;
    }

    .hand-panel.orange {
      border-color: #ffc36f;
    }

    .hand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 21px;
      font-weight: 1000;
    }

    .hand-status {
      font-size: 15px;
      font-weight: 900;
      color: #444;
    }

    .pieces {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      min-height: 0;
    }

    .piece {
      border-radius: 18px;
      border: 4px solid #111;
      background: white;
      box-shadow: 0 5px 0 #111, 0 8px 12px rgba(0,0,0,0.22);
      cursor: pointer;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: 8px;
      gap: 6px;
      min-height: 112px;
      transition: 0.14s;
      position: relative;
    }

    .piece:hover {
      transform: translateY(-4px);
    }

    .piece.selected {
      outline: 7px solid #ffea00;
      outline-offset: 2px;
      transform: translateY(-5px);
    }

    .piece.disabled {
      opacity: 0.35;
      pointer-events: none;
      filter: grayscale(70%);
    }

    .piece.green {
      background: linear-gradient(180deg, #eaffec, #ffffff);
    }

    .piece.orange {
      background: linear-gradient(180deg, #fff0df, #ffffff);
    }

    .fraction-label {
      font-size: 24px;
      line-height: 0.85;
      font-weight: 1000;
      text-align: center;
      color: #111;
      min-height: 32px;
    }

    .fraction-label .top {
      display: block;
    }

    .fraction-label .bar {
      display: block;
      width: 34px;
      height: 4px;
      background: #111;
      margin: 2px auto;
      border-radius: 999px;
    }

    .fraction-label .bottom {
      display: block;
    }

    .mini-model {
      width: 100%;
      aspect-ratio: 2 / 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 3px;
      border: 3px solid #111;
      border-radius: 10px;
      padding: 4px;
      background: white;
    }

    .mini-cell {
      border-radius: 4px;
      background: #f3ecd9;
      border: 1px solid rgba(0,0,0,0.2);
    }

    .piece.green .mini-cell.filled {
      background: var(--green);
      border-color: var(--green-dark);
    }

    .piece.orange .mini-cell.filled {
      background: var(--orange);
      border-color: var(--orange-dark);
    }

    .labels-off .fraction-label {
      visibility: hidden;
    }

    .end-screen {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .end-card {
      width: min(760px, 90vw);
      border-radius: 34px;
      background: white;
      border: 6px solid #111;
      box-shadow: 0 18px 50px rgba(0,0,0,0.6);
      text-align: center;
      padding: 34px;
    }

    .end-card h1 {
      margin: 0 0 14px;
      font-size: 54px;
      line-height: 1;
    }

    .end-card p {
      font-size: 24px;
      font-weight: 900;
      margin: 8px 0 24px;
    }

    .error-box {
      font-family: Arial, Helvetica, sans-serif;
      padding: 40px;
      color: #111;
      background: white;
      min-height: 100vh;
    }

    .error-box pre {
      background: #eee;
      padding: 20px;
      border-radius: 12px;
      white-space: pre-wrap;
      font-size: 16px;
    }

    @media (max-width: 1150px) {
      .game-shell {
        grid-template-rows: 130px 1fr 155px;
      }

      .center-area {
        grid-template-columns: 1fr;
      }

      .mascot-panel {
        display: none;
      }

      .top-bar {
        grid-template-columns: 1fr 260px 1fr;
      }

      .logo-wrap img {
        max-width: 260px;
        max-height: 125px;
      }

      .player-name {
        font-size: 22px;
      }

      .score {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>
  <div class="game-shell" id="gameShell">

    <header class="top-bar">
      <section class="player-card green active" id="greenCard">
        <div class="player-info">
          <div class="player-name">GREEN TEAM</div>
          <div class="score" id="greenScore">0</div>
        </div>
        <div class="turn-badge">YOUR TURN</div>
      </section>

      <div class="logo-wrap">
        <img src="frac-jack-logo.png" alt="Frac Jack Logo" />
      </div>

      <section class="player-card orange" id="orangeCard">
        <div class="player-info">
          <div class="player-name">ORANGE TEAM</div>
          <div class="score" id="orangeScore">0</div>
        </div>
        <div class="turn-badge">YOUR TURN</div>
      </section>
    </header>

    <main class="center-area">
      <aside class="mascot-panel">
        <img src="frac-jack-kids.png" alt="Frac Jack Kids" />
      </aside>

      <section class="board-panel">
        <div class="message-bar green-msg" id="messageBar">
          Green Team: choose a piece, then choose a square.
        </div>

        <div class="whole-grid" id="wholeGrid"></div>

        <div class="controls">
          <button id="newGameButton">New Game</button>
          <button id="labelButton">Hide Fraction Labels</button>
          <span class="small-note">No missing amount is shown. Players have to see it.</span>
        </div>
      </section>

      <aside class="mascot-panel">
        <img src="frac-jack-kids.png" alt="Frac Jack Kids" />
      </aside>
    </main>

    <footer class="bottom-area">
      <section class="hand-panel green" id="greenHandPanel">
        <div class="hand-header">
          <span>Green Pieces</span>
          <span class="hand-status" id="greenDeckStatus"></span>
        </div>
        <div class="pieces" id="greenPieces"></div>
      </section>

      <section class="hand-panel orange" id="orangeHandPanel">
        <div class="hand-header">
          <span>Orange Pieces</span>
          <span class="hand-status" id="orangeDeckStatus"></span>
        </div>
        <div class="pieces" id="orangePieces"></div>
      </section>
    </footer>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="end-card">
      <h1 id="winnerText">Game Over</h1>
      <p id="finalScoreText"></p>
      <button id="playAgainButton">Play Again</button>
    </div>
  </div>

  <script>
    const PIECE_TYPES = [
      { name: "1/8", numerator: 1, denominator: 8, units: 1 },
      { name: "1/4", numerator: 1, denominator: 4, units: 2 },
      { name: "3/8", numerator: 3, denominator: 8, units: 3 },
      { name: "1/2", numerator: 1, denominator: 2, units: 4 },
      { name: "5/8", numerator: 5, denominator: 8, units: 5 },
      { name: "3/4", numerator: 3, denominator: 4, units: 6 }
    ];

    const WHOLE_COUNT = 5;
    const HAND_SIZE = 6;
    const STARTING_DECK_SIZE = 24;

    let state = {};
    let pieceCounter = 0;

    function makeId() {
      pieceCounter += 1;
      return "piece-" + pieceCounter + "-" + Math.random().toString(36).slice(2);
    }

    function createDeck() {
      const deck = [];

      const weightedPieces = [
        "1/8", "1/8", "1/8", "1/8",
        "1/4", "1/4", "1/4", "1/4",
        "3/8", "3/8", "3/8",
        "1/2", "1/2", "1/2",
        "5/8", "5/8",
        "3/4", "3/4"
      ];

      for (let i = 0; i < STARTING_DECK_SIZE; i++) {
        const randomName = weightedPieces[Math.floor(Math.random() * weightedPieces.length)];
        const template = PIECE_TYPES.find(function(p) {
          return p.name === randomName;
        });

        deck.push({
          name: template.name,
          numerator: template.numerator,
          denominator: template.denominator,
          units: template.units,
          id: makeId()
        });
      }

      return shuffle(deck);
    }

    function shuffle(array) {
      const copy = array.slice();

      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }

      return copy;
    }

    function newGame() {
      pieceCounter = 0;

      const greenDeck = createDeck();
      const orangeDeck = createDeck();

      state = {
        currentPlayer: "green",
        selectedPieceId: null,
        labelsVisible: true,
        players: {
          green: {
            score: 0,
            deck: greenDeck,
            hand: greenDeck.splice(0, HAND_SIZE)
          },
          orange: {
            score: 0,
            deck: orangeDeck,
            hand: orangeDeck.splice(0, HAND_SIZE)
          }
        },
        wholes: []
      };

      for (let i = 0; i < WHOLE_COUNT; i++) {
        state.wholes.push({
          id: i,
          filled: 0,
          cells: [null, null, null, null, null, null, null, null],
          capturedFlash: null
        });
      }

      document.getElementById("endScreen").style.display = "none";
      render();
      setMessage("Green Team: choose a piece, then choose a square.", "green");
    }

    function render() {
      renderScores();
      renderTurn();
      renderWholes();
      renderHands();
      renderLabelState();
      checkForGameEnd();
    }

    function renderScores() {
      document.getElementById("greenScore").textContent = state.players.green.score;
      document.getElementById("orangeScore").textContent = state.players.orange.score;
      document.getElementById("greenDeckStatus").textContent = state.players.green.deck.length + " left";
      document.getElementById("orangeDeckStatus").textContent = state.players.orange.deck.length + " left";
    }

    function renderTurn() {
      document.getElementById("greenCard").classList.toggle("active", state.currentPlayer === "green");
      document.getElementById("orangeCard").classList.toggle("active", state.currentPlayer === "orange");
    }

    function renderWholes() {
      const grid = document.getElementById("wholeGrid");
      grid.innerHTML = "";

      state.wholes.forEach(function(whole, index) {
        const card = document.createElement("div");
        card.className = "whole-card";

        if (whole.capturedFlash === "green") {
          card.classList.add("captured-green");
        }

        if (whole.capturedFlash === "orange") {
          card.classList.add("captured-orange");
        }

        card.addEventListener("click", function() {
          placeSelectedPiece(index);
        });

        const title = document.createElement("div");
        title.className = "whole-title";
        title.textContent = "WHOLE " + (index + 1);

        const square = document.createElement("div");
        square.className = "square-model";

        whole.cells.forEach(function(owner) {
          const cell = document.createElement("div");
          cell.className = "cell";

          if (owner === "green") {
            cell.classList.add("green-fill");
          }

          if (owner === "orange") {
            cell.classList.add("orange-fill");
          }

          square.appendChild(cell);
        });

        const footer = document.createElement("div");
        footer.className = "whole-footer";
        footer.textContent = whole.filled === 0 ? "Empty" : "Partly filled";

        const flash = document.createElement("div");
        flash.className = "captured-flash";

        if (whole.capturedFlash === "green") {
          flash.textContent = "GREEN JACKED IT!";
        } else if (whole.capturedFlash === "orange") {
          flash.textContent = "ORANGE JACKED IT!";
        }

        card.appendChild(title);
        card.appendChild(square);
        card.appendChild(footer);
        card.appendChild(flash);

        grid.appendChild(card);
      });
    }

    function renderHands() {
      renderHand("green", document.getElementById("greenPieces"));
      renderHand("orange", document.getElementById("orangePieces"));
    }

    function renderHand(player, container) {
      container.innerHTML = "";

      state.players[player].hand.forEach(function(piece) {
        const pieceEl = document.createElement("div");
        pieceEl.className = "piece " + player;

        if (state.currentPlayer !== player) {
          pieceEl.classList.add("disabled");
        }

        if (state.selectedPieceId === piece.id) {
          pieceEl.classList.add("selected");
        }

        pieceEl.addEventListener("click", function() {
          selectPiece(player, piece.id);
        });

        const label = document.createElement("div");
        label.className = "fraction-label";

        label.innerHTML =
          '<span class="top">' + piece.numerator + '</span>' +
          '<span class="bar"></span>' +
          '<span class="bottom">' + piece.denominator + '</span>';

        const mini = document.createElement("div");
        mini.className = "mini-model";

        for (let i = 0; i < 8; i++) {
          const c = document.createElement("div");
          c.className = "mini-cell";

          if (i < piece.units) {
            c.classList.add("filled");
          }

          mini.appendChild(c);
        }

        pieceEl.appendChild(label);
        pieceEl.appendChild(mini);
        container.appendChild(pieceEl);
      });
    }

    function renderLabelState() {
      document.body.classList.toggle("labels-off", !state.labelsVisible);

      document.getElementById("labelButton").textContent =
        state.labelsVisible ? "Hide Fraction Labels" : "Show Fraction Labels";
    }

    function selectPiece(player, pieceId) {
      if (player !== state.currentPlayer) {
        return;
      }

      state.selectedPieceId = pieceId;

      const playerName = player === "green" ? "Green Team" : "Orange Team";
      setMessage(playerName + ": now choose a square.", player);

      render();
    }

    function getSelectedPiece() {
      const player = state.players[state.currentPlayer];

      for (let i = 0; i < player.hand.length; i++) {
        if (player.hand[i].id === state.selectedPieceId) {
          return player.hand[i];
        }
      }

      return null;
    }

    function placeSelectedPiece(wholeIndex) {
      const piece = getSelectedPiece();

      if (!piece) {
        setMessage("Choose one of your pieces first.", state.currentPlayer);
        return;
      }

      const whole = state.wholes[wholeIndex];
      const currentPlayer = state.currentPlayer;
      const playerName = currentPlayer === "green" ? "Green Team" : "Orange Team";

      if (whole.filled + piece.units > 8) {
        removePieceFromHand(currentPlayer, piece.id);
        drawPiece(currentPlayer);
        state.selectedPieceId = null;

        setMessage(playerName + " went over. That piece is gone.", currentPlayer);
        switchTurn();
        render();
        return;
      }

      let unitsToPlace = piece.units;

      for (let i = 0; i < whole.cells.length && unitsToPlace > 0; i++) {
        if (whole.cells[i] === null) {
          whole.cells[i] = currentPlayer;
          unitsToPlace--;
        }
      }

      whole.filled += piece.units;

      removePieceFromHand(currentPlayer, piece.id);
      drawPiece(currentPlayer);
      state.selectedPieceId = null;

      if (whole.filled === 8) {
        state.players[currentPlayer].score++;
        whole.capturedFlash = currentPlayer;

        setMessage(playerName + " saw the missing piece and JACKED the whole!", currentPlayer);
        render();

        setTimeout(function() {
          resetWhole(wholeIndex);
          switchTurn();
          render();
        }, 900);

        return;
      }

      setMessage(playerName + " placed a piece.", currentPlayer);
      switchTurn();
      render();
    }

    function removePieceFromHand(player, pieceId) {
      const newHand = [];

      state.players[player].hand.forEach(function(piece) {
        if (piece.id !== pieceId) {
          newHand.push(piece);
        }
      });

      state.players[player].hand = newHand;
    }

    function drawPiece(player) {
      const p = state.players[player];

      if (p.deck.length > 0 && p.hand.length < HAND_SIZE) {
        p.hand.push(p.deck.shift());
      }
    }

    function resetWhole(index) {
      state.wholes[index] = {
        id: index,
        filled: 0,
        cells: [null, null, null, null, null, null, null, null],
        capturedFlash: null
      };
    }

    function switchTurn() {
      state.currentPlayer = state.currentPlayer === "green" ? "orange" : "green";

      const playerName = state.currentPlayer === "green" ? "Green Team" : "Orange Team";

      setMessage(playerName + ": choose a piece, then choose a square.", state.currentPlayer);
    }

    function setMessage(text, player) {
      const bar = document.getElementById("messageBar");
      bar.textContent = text;

      bar.classList.remove("green-msg");
      bar.classList.remove("orange-msg");

      if (player === "green") {
        bar.classList.add("green-msg");
      } else {
        bar.classList.add("orange-msg");
      }
    }

    function toggleLabels() {
      state.labelsVisible = !state.labelsVisible;
      render();
    }

    function checkForGameEnd() {
      const greenDone = state.players.green.deck.length === 0 && state.players.green.hand.length === 0;
      const orangeDone = state.players.orange.deck.length === 0 && state.players.orange.hand.length === 0;

      if (!greenDone || !orangeDone) {
        return;
      }

      const greenScore = state.players.green.score;
      const orangeScore = state.players.orange.score;

      let winner = "Tie Game!";

      if (greenScore > orangeScore) {
        winner = "Green Team Wins!";
      }

      if (orangeScore > greenScore) {
        winner = "Orange Team Wins!";
      }

      document.getElementById("winnerText").textContent = winner;
      document.getElementById("finalScoreText").textContent =
        "Final Score: Green " + greenScore + " — Orange " + orangeScore;

      document.getElementById("endScreen").style.display = "flex";
    }

    function setupButtons() {
      document.getElementById("newGameButton").addEventListener("click", newGame);
      document.getElementById("labelButton").addEventListener("click", toggleLabels);
      document.getElementById("playAgainButton").addEventListener("click", newGame);
    }

    try {
      setupButtons();
      newGame();
    } catch (error) {
      document.body.innerHTML =
        '<div class="error-box">' +
          '<h1>Frac Jack Error</h1>' +
          '<p>The game had trouble loading. This message means the page loaded, but the JavaScript hit an error.</p>' +
          '<pre>' + error + '</pre>' +
        '</div>';

      console.error(error);
    }
  </script>
</body>
</html>
