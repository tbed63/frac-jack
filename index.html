<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="shortcut icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta name="mobile-web-app-capable" content="yes" />

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    html, body, #root {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: auto;

    }
    * { box-sizing: border-box; }
    button { font-family: Arial, Helvetica, sans-serif; }

    /* ── Responsive breakpoints ── */

    /* Desktop: side panels visible, full 3-column layout */
    /* Tablet (≤900px): side panels collapse to bottom strip */
    /* Phone (≤600px): fully stacked, larger touch targets */

    @keyframes trashShake {
      0%{transform:rotate(0deg) translateX(0);}
      25%{transform:rotate(-7deg) translateX(-1px);}
      50%{transform:rotate(6deg) translateX(1px);}
      75%{transform:rotate(-4deg) translateX(-1px);}
      100%{transform:rotate(0deg) translateX(0);}
    }
    @keyframes hintPulse {
      from{ transform:scale(1); }
      to{ transform:scale(1.08); }
    }
    @keyframes territoryHint {
      from{ transform:scale(1); }
      to{ transform:scale(1.025); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ─── Sound hook ─────────────────────────────────────────────────────────── */
function useGameSounds() {
  const [muted, setMuted] = useState(false);
  const audioCtxRef = useRef(null);

  function beep(freq = 440, duration = 0.08, type = "square") {
    if (muted) return;
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      if (!audioCtxRef.current) audioCtxRef.current = new AudioContext();
      const ctx = audioCtxRef.current;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.05, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch (e) {}
  }

  function playFile(src) {
    if (muted) return;
    try {
      const audio = new Audio(src);
      audio.volume = 0.82;
      audio.currentTime = 0;
      const p = audio.play();
      if (p && typeof p.catch === "function") p.catch(() => {});
    } catch (e) {}
  }

  return {
    muted, toggleMute: () => setMuted(m => !m),
    playMove: () => beep(520, 0.08, "triangle"),
    playCapture: () => { beep(660, 0.09, "triangle"); setTimeout(() => beep(880, 0.11, "triangle"), 90); },
    playTrash: () => beep(180, 0.12, "sawtooth"),
    playBuzz: () => beep(95, 0.18, "square"),
    playBrand: () => playFile(SOUND_BRAND),
    playTerritoryVictory: () => playFile(SOUND_TERRITORY_VICTORY),
    playBadTrash: () => playFile(SOUND_BAD_TRASH),
  };
}

/* ─── Viewport hook ─────────────────────────────────────────────────────── */
function useViewportSize() {
  const [size, setSize] = useState({ width: window.innerWidth || 1200, height: window.innerHeight || 800 });
  useEffect(() => {
    function update() { setSize({ width: window.innerWidth || 1200, height: window.innerHeight || 800 }); }
    update();
    window.addEventListener("resize", update);
    window.addEventListener("orientationchange", update);
    return () => { window.removeEventListener("resize", update); window.removeEventListener("orientationchange", update); };
  }, []);
  return size;
}

/* ─── Intro Screen ──────────────────────────────────────────────────────── */
function IntroScreen({ timerLimit, onTimerChange, level, onLevelChange, onStart, isMobile }) {
  return (
    <div style={{
      position:"fixed", inset:0, zIndex:200,
      display:"flex", alignItems:"center", justifyContent:"center",
      padding: isMobile ? 12 : 24,
      fontFamily:"Arial, Helvetica, sans-serif", color:"white",
      background:"radial-gradient(circle at 50% 20%, rgba(255,255,255,.14), transparent 22%), radial-gradient(circle at 20% 55%, rgba(255,135,0,.32), transparent 28%), radial-gradient(circle at 80% 55%, rgba(64,201,31,.28), transparent 28%), linear-gradient(180deg,#020b1f,#06245d 52%,#020916)"
    }}>
      <div style={{
        width:"min(700px,96vw)",
        border:"7px solid white", borderRadius:22,
        padding: isMobile ? "14px 14px 18px" : "26px 30px 30px",
        textAlign:"center", background:"rgba(0,0,0,.48)",
        boxShadow:"0 24px 70px rgba(0,0,0,.65)"
      }}>
        <img src={IMG_LOGO} alt="Frac Jack" style={{
          maxWidth:"min(460px,88%)",
          maxHeight: isMobile ? 110 : 210,
          objectFit:"contain",
          filter:"drop-shadow(0 12px 18px rgba(0,0,0,.75))"
        }} />
        <div style={{ fontSize: isMobile ? 11 : 15, fontWeight:900, margin: isMobile ? "4px 0 10px" : "8px 0 22px", textShadow:"0 3px 0 rgba(0,0,0,.5)" }}>
          Pick fractions. Claim territories. Jack the board.
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap: isMobile ? 8 : 16, margin: isMobile ? "0 auto 12px" : "0 auto 24px", maxWidth:520 }}>
          <div style={{ border:"3px solid rgba(255,255,255,.75)", borderRadius:18, padding: isMobile ? "8px 10px" : 16, background:"rgba(255,255,255,.10)" }}>
            <div style={{ fontSize: isMobile ? 12 : 14, fontWeight:1000, textTransform:"uppercase", letterSpacing:1, marginBottom: isMobile ? 8 : 10 }}>Level</div>
            <div style={{ display:"flex", gap:6, justifyContent:"center" }}>
              {[1,2,3].map(lv => (
                <button key={lv} onClick={() => onLevelChange(lv)} style={{
                  width: isMobile ? 48 : 54, height: isMobile ? 40 : 42,
                  borderRadius:14, border:"3px solid white",
                  fontSize: isMobile ? 20 : 18, fontWeight:1000, cursor:"pointer",
                  color: level === lv ? "#111" : "white",
                  background: level === lv ? "linear-gradient(180deg,#ffe76a,#ffb21b)" : "rgba(0,0,0,.28)"
                }}>{lv}</button>
              ))}
            </div>
          </div>

          <div style={{ border:"3px solid rgba(255,255,255,.75)", borderRadius:18, padding: isMobile ? "8px 10px" : 16, background:"rgba(255,255,255,.10)" }}>
            <div style={{ fontSize: isMobile ? 12 : 14, fontWeight:1000, textTransform:"uppercase", letterSpacing:1, marginBottom: isMobile ? 8 : 10 }}>Turn Timer</div>
            <select value={timerLimit} onChange={e => onTimerChange(Number(e.target.value))} style={{
              width:"100%", height: isMobile ? 40 : 42, borderRadius:12, border:"3px solid white",
              fontSize: isMobile ? 13 : 17, fontWeight:900, textAlign:"center", color:"#111", background:"white"
            }}>
              <option value={10}>10 sec</option>
              <option value={20}>20 sec</option>
              <option value={30}>30 sec</option>
              <option value={45}>45 sec</option>
              <option value={60}>1 min</option>
              <option value={90}>1 min 30 sec</option>
              <option value={120}>2 min</option>
            </select>
          </div>
        </div>

        <button onClick={onStart} style={{
          border:"5px solid white", borderRadius:999,
          padding: isMobile ? "12px 32px" : "14px 46px",
          fontSize: isMobile ? 22 : 26, fontWeight:1000, color:"#111", cursor:"pointer",
          background:"linear-gradient(180deg,#fff36c,#ff9d18)",
          boxShadow:"0 8px 0 rgba(0,0,0,.45)", textTransform:"uppercase"
        }}>Start Game</button>
      </div>
    </div>
  );
}

/* ─── Assets ────────────────────────────────────────────────────────────── */
const IMG_LOGO       = "https://media.base44.com/images/public/69fa82e0877a38539df3196d/fb1a14b1b_frac-jack-logo.png";
const IMG_JACKAL     = "https://media.base44.com/images/public/69fa82e0877a38539df3196d/b4c6884ac_jackal-orange.png";
const IMG_JACKRABBIT = "https://media.base44.com/images/public/69fa82e0877a38539df3196d/52f7ec8e4_jackrabbit-green.png";
const IMG_TRASH      = "https://media.base44.com/images/public/69fa82e0877a38539df3196d/ca01e9af6_frac-trash.png";
const SOUND_BRAND             = "ZoodleBugBrandSound.wav";
const SOUND_TERRITORY_VICTORY = "FracJackTerritoryVictory.wav";
const SOUND_BAD_TRASH         = "FracJackBadTrash.wav";

/* ─── Math helpers ──────────────────────────────────────────────────────── */
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { let t = b; b = a % b; a = t; } return a || 1; }
function simplify(n, d) { const g = gcd(n, d); return { n: n / g, d: d / g }; }
function fractionKey(f) { return f.n + "/" + f.d; }
function shuffle(a) { const c = a.slice(); for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; }
function choose(a) { return a[Math.floor(Math.random() * a.length)]; }
function denomWord(d) {
  const w = { 2:"halves",3:"thirds",4:"fourths",5:"fifths",6:"sixths",7:"sevenths",8:"eighths",9:"ninths",10:"tenths",11:"elevenths",12:"twelfths",15:"fifteenths",20:"twentieths" };
  return w[d] || d + "ths";
}

const SLOTS  = ["t1","t2","t3","t4","t5"];
const MODELS = ["Bar Model","Set Model","Number Line","Area Model","Circle Model"];
const SHAPES = ["●","★","▲","■","◆","♥","⬟","⬢","⬤","◆","▲","★","●","■","♥","⬟","⬢","◆","★","●"];

function normalizeLevel(level) { const lv = Number(level); return lv === 1 || lv === 2 || lv === 3 ? lv : 1; }
function levelDenominators(level) {
  const lv = normalizeLevel(level);
  if (lv === 1) return [2, 3, 4, 5, 6];
  if (lv === 2) return [3, 4, 5, 6, 8, 10, 12];
  return [4, 5, 6, 8, 10, 12];
}

function buildFractionPool(level) {
  const lv = normalizeLevel(level);
  const dens = levelDenominators(lv);
  const pool = []; const seen = {};
  dens.forEach(d => {
    let maxN = d - 1;
    if (lv === 3) maxN = Math.floor(d * 1.5);
    for (let n = 1; n <= maxN; n++) {
      const s = simplify(n, d);
      if (lv === 1 && s.d > 6) continue;
      const key = s.n + "/" + s.d;
      if (!seen[key]) {
        if (lv === 3 && s.d === 1) continue;
        seen[key] = true;
        pool.push({ n: s.n, d: s.d });
      }
    }
  });
  return shuffle(pool);
}

function displayFraction(f) {
  if (f.d === 1) return String(f.n);
  if (f.n > f.d && Math.random() < 0.5) {
    const w = Math.floor(f.n / f.d); const r = f.n % f.d;
    if (r === 0) return String(w);
    return w + " " + r + "/" + f.d;
  }
  return f.n + "/" + f.d;
}

function fractionFits(frac, t) { return (frac.n * t.denominator) % frac.d === 0; }
function fractionUnits(frac, t) { return (frac.n * t.denominator) / frac.d; }
function isLegalMove(frac, t) {
  if (!t || t.owner) return false;
  if (!fractionFits(frac, t)) return false;
  const units = fractionUnits(frac, t);
  const remaining = t.denominator * t.wholes - t.filledUnits;
  return units <= remaining;
}

function createTerritories(level) {
  const lv = normalizeLevel(level);
  const dens = levelDenominators(lv);

  // Fixed model assignment:
  // T1=Set Model, T2=Number Line, T3=Area Model, T4=Circle Model, T5=Bar Model
  // This guarantees portrait mobile can always show T3(Area) and T4(Circle) side-by-side.
  const models = ["Set Model", "Number Line", "Area Model", "Circle Model", "Bar Model"];

  let territoryDenominators;
  if (lv === 1) {
    territoryDenominators = shuffle([2, 3, 4, 5, 6]);
  } else {
    territoryDenominators = [];
    const shuffled = shuffle(dens);
    for (let i = 0; i < 5; i++) territoryDenominators.push(shuffled[i % shuffled.length]);
    territoryDenominators = shuffle(territoryDenominators);
  }

  const list = [];
  for (let i = 0; i < 5; i++) {
    let den = territoryDenominators[i];
    let wholes;
    if (lv === 1) { wholes = 1; }
    else if (i === 0) { wholes = 1 + Math.floor(Math.random() * 2); }
    else if (i === 1) {
      wholes = lv === 2 ? 1 + Math.floor(Math.random() * 2) : 1 + Math.floor(Math.random() * 3);
      const maxNLDen = wholes === 1 ? 8 : wholes === 2 ? 6 : 4;
      const nlDens = dens.filter(d => d <= maxNLDen);
      den = nlDens.includes(den) ? den : choose(nlDens.length ? nlDens : [2, 3, 4]);
    } else {
      wholes = lv === 2 ? 1 + Math.floor(Math.random() * 2) : 2 + Math.floor(Math.random() * 3);
    }
    list.push({ id: i, slot: SLOTS[i], name: "T" + (i + 1), model: models[i], denominator: den, wholes, filledUnits: 0, owner: null, chunks: [], hijacked: false });
  }
  return list;
}

function makeChoice(f) {
  const chosen = { n: f.n, d: f.d };
  chosen.display = displayFraction(chosen);
  return chosen;
}

function handHasLegalMove(hand, territories) {
  return !!(territories && territories.length && hand && hand.some(f => f && territories.some(t => isLegalMove(f, t))));
}

function boardHasAnyLegalMove(level, territories) {
  if (!territories || !territories.length) return false;
  const pool = buildFractionPool(level);
  return pool.some(f => territories.some(t => isLegalMove(f, t)));
}

function pickFromPool({ level, usedKeys = {}, discardedKeys = {}, territories = null, mustBeLegal = false, respectDiscarded = true }) {
  const pool = shuffle(buildFractionPool(level));
  for (const f of pool) {
    const key = fractionKey(f);
    if (usedKeys[key]) continue;
    if (respectDiscarded && discardedKeys[key]) continue;
    if (mustBeLegal && !(territories && territories.some(t => isLegalMove(f, t)))) continue;
    usedKeys[key] = true;
    return makeChoice(f);
  }
  return null;
}

function createFractionFromPool(level, usedKeys = {}, discardedKeys = {}) {
  return pickFromPool({ level, usedKeys, discardedKeys, respectDiscarded:true })
      || pickFromPool({ level, usedKeys, discardedKeys, respectDiscarded:false })
      || null;
}

function createSmartLegalFraction(level, usedKeys = {}, discardedKeys = {}, territories = []) {
  return pickFromPool({ level, usedKeys, discardedKeys, territories, mustBeLegal:true, respectDiscarded:true })
      || pickFromPool({ level, usedKeys, discardedKeys, territories, mustBeLegal:true, respectDiscarded:false })
      || createFractionFromPool(level, usedKeys, discardedKeys);
}

function cleanFractionHand(level, hand, discardedKeys = {}, territories = []) {
  const usedKeys = {};
  const cleaned = [];
  for (const f of hand || []) {
    if (!f) continue;
    const key = fractionKey(f);
    if (usedKeys[key]) continue;
    usedKeys[key] = true;
    cleaned.push({ ...f, display: f.display || displayFraction(f) });
    if (cleaned.length >= 3) break;
  }
  if (boardHasAnyLegalMove(level, territories) && !handHasLegalMove(cleaned, territories)) {
    const replaceIndex = cleaned.length >= 3 ? 2 : cleaned.length;
    const usedExceptReplace = {};
    cleaned.forEach((f, i) => { if (i !== replaceIndex) usedExceptReplace[fractionKey(f)] = true; });
    const legalChoice = createSmartLegalFraction(level, usedExceptReplace, discardedKeys, territories);
    if (legalChoice) cleaned[replaceIndex] = legalChoice;
  }
  while (cleaned.length < 3) {
    const next = createFractionFromPool(level, usedKeys, discardedKeys);
    if (!next) break;
    cleaned.push(next);
  }
  const finalUsed = {};
  const finalHand = [];
  for (const f of cleaned) {
    if (!f) continue;
    const key = fractionKey(f);
    if (finalUsed[key]) continue;
    finalUsed[key] = true;
    finalHand.push({ ...f, display: f.display || displayFraction(f) });
  }
  while (finalHand.length < 3) {
    const next = pickFromPool({ level, usedKeys: finalUsed, discardedKeys, respectDiscarded:false });
    if (!next) break;
    finalHand.push(next);
  }
  return finalHand.slice(0, 3);
}

function rollFractions(level, discardedKeys, territories) {
  const usedKeys = {};
  const result = [];
  if (boardHasAnyLegalMove(level, territories)) {
    const legal = createSmartLegalFraction(level, usedKeys, discardedKeys, territories);
    if (legal) result.push(legal);
  }
  while (result.length < 3) {
    const next = createFractionFromPool(level, usedKeys, discardedKeys);
    if (!next) break;
    result.push(next);
  }
  return shuffle(cleanFractionHand(level, result, discardedKeys, territories));
}

function bestCols(d) {
  if (d === 20) return 5; if (d === 15) return 5; if (d === 12) return 4;
  if (d === 10) return 5; if (d === 8) return 4; if (d === 6) return 3;
  if (d === 5) return 5; if (d === 4) return 4; if (d === 3) return 3; return d;
}

function cellsFromChunks(t) {
  const total = t.denominator * t.wholes;
  const cells = new Array(total).fill("");
  let filledAmount = 0;
  t.chunks.forEach(c => {
    let unitsToFill = c.units;
    while (unitsToFill > 0 && filledAmount < total) {
      const cellIndex = Math.floor(filledAmount);
      if (cellIndex < total) cells[cellIndex] = c.color;
      filledAmount += 1;
      unitsToFill -= 1;
    }
  });
  return cells;
}

/* ─── Model renderers ───────────────────────────────────────────────────── */
// CELL_H: height of a single bar/area row cell — enough to see clearly
const CELL_H = 28;

function BarModel({ t }) {
  const cells = cellsFromChunks(t);
  return (
    <div style={{ width:"100%", display:"flex", flexDirection:"column", justifyContent:"center", gap:4, padding:"5px 6px" }}>
      {Array.from({ length: t.wholes }).map((_, w) => (
        <div key={w} style={{ display:"flex", alignItems:"center", gap:3 }}>
          <div style={{ width:14, flex:"0 0 14px", fontSize:10, fontWeight:1000, textAlign:"center", color:"#444" }}>{w + 1}</div>
          <div style={{ flex:1, height:CELL_H, border:"2.5px solid #555", borderRadius:3, display:"grid", gridTemplateColumns:`repeat(${t.denominator},1fr)`, background:"white", overflow:"hidden" }}>
            {Array.from({ length: t.denominator }).map((_, i) => {
              const color = cells[w * t.denominator + i];
              return <div key={i} style={{ borderRight: i < t.denominator - 1 ? "1px solid #aaa" : "none", background: color === "red" ? "#e83434" : color === "blue" ? "#1878ff" : "white" }} />;
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

function AreaModel({ t, isDesktop }) {
  // Area model = rectangular grid (Hershey bar / pan pizza).
  // RULE: always at least 2 rows so it can never look like a single bar row.
  const cells = cellsFromChunks(t);
  const d = t.denominator;

  let cols, rows;
  const gridMap = {
    2: [2,1],
    3: [3,1],
    4: [2,2],
    5: [5,1],
    6: [3,2],
    8: [4,2],
    9: [3,3],
    10: [5,2],
    12: [4,3],
    15: [5,3],
    20: [5,4],
  };
  if (gridMap[d]) {
    [cols, rows] = gridMap[d];
  } else {
    cols = Math.ceil(Math.sqrt(d));
    rows = Math.ceil(d / cols);
    if (rows < 2 && d >= 4) { cols = Math.ceil(cols / 2); rows = Math.ceil(d / cols); }
  }

  // On desktop the card middle row is minmax(0,1fr) — use flex layout so each whole
  // takes equal share of available height. On mobile use fixed CELL_H pixel rows.
  const wholeStyle = isDesktop
    ? { flex:"1 1 0", minHeight:0, width:"100%", display:"grid", gridTemplateColumns:`repeat(${cols},1fr)`, gridTemplateRows:`repeat(${rows},1fr)`, border:"2.5px solid #555", borderRadius:3, background:"white", overflow:"hidden" }
    : { width:"100%", display:"grid", gridTemplateColumns:`repeat(${cols},1fr)`, gridTemplateRows:`repeat(${rows},${CELL_H}px)`, border:"2.5px solid #555", borderRadius:3, background:"white", overflow:"hidden" };

  return (
    <div style={{ width:"100%", height: isDesktop ? "100%" : "auto", display:"flex", flexDirection:"column", justifyContent:"center", gap:4, padding:"5px 6px", boxSizing:"border-box" }}>
      {Array.from({ length: t.wholes }).map((_, w) => (
        <div key={w} style={wholeStyle}>
          {Array.from({ length: d }).map((_, i) => {
            const color = cells[w * d + i];
            return <div key={i} style={{
              borderRight: (i % cols) < cols - 1 ? "1px solid #aaa" : "none",
              borderBottom: Math.floor(i / cols) < rows - 1 ? "1px solid #aaa" : "none",
              background: color === "red" ? "#e83434" : color === "blue" ? "#1878ff" : "white"
            }} />;
          })}
        </div>
      ))}
    </div>
  );
}

function NumberLine({ t }) {
  const cells = cellsFromChunks(t);
  const total = t.denominator * t.wholes;
  return (
    <div style={{ width:"100%", height:"100%", display:"flex", alignItems:"center", justifyContent:"center", padding:"10px 12px 16px" }}>
      <div style={{ width:"100%", height:72, position:"relative", background:"linear-gradient(180deg,#fffdf3,#eef5ff)", border:"2px solid rgba(17,17,17,.22)", borderRadius:14, padding:"0 18px", overflow:"visible" }}>
        <div style={{ position:"absolute", left:18, right:18, top:25, display:"grid", gridTemplateColumns:`repeat(${total},1fr)`, height:24, borderBottom:"5px solid #111", zIndex:2 }}>
          {Array.from({ length: total }).map((_, i) => {
            const color = cells[i];
            return (
              <div key={i} style={{ borderLeft:"2px solid #111", ...(i === total - 1 ? { borderRight:"2px solid #111" } : {}), position:"relative", height:24, background: color === "red" ? "#e83434" : color === "blue" ? "#1878ff" : "transparent" }} />
            );
          })}
        </div>
        {Array.from({ length: t.wholes + 1 }).map((_, whole) => (
          <div key={whole} style={{ position:"absolute", top:50, transform:"translateX(-50%)", left:`calc(18px + (100% - 36px) * ${whole / t.wholes})`, color:"#111", fontSize:16, fontWeight:1000, zIndex:6, textShadow:"0 1px 0 white" }}>{whole}</div>
        ))}
      </div>
    </div>
  );
}

function SetModel({ t }) {
  const cells = cellsFromChunks(t);
  const cols = Math.ceil(Math.sqrt(t.denominator));
  const rows = Math.ceil(t.denominator / cols);
  return (
    <div style={{ width:"100%", height:"100%", display:"flex", flexWrap:"wrap", alignItems:"stretch", justifyContent:"center", gap:4, overflow:"hidden", padding:3 }}>
      {Array.from({ length: t.wholes }).map((_, w) => (
        <div key={w} style={{ flex:`1 1 ${t.wholes === 1 ? "100%" : "45%"}`, minWidth:0, maxWidth: t.wholes === 1 ? "100%" : "50%", overflow:"hidden", display:"grid", gridTemplateColumns:`repeat(${cols},1fr)`, gridTemplateRows:`repeat(${rows},1fr)`, gap:2, padding:4, border:"2px solid #aaa", borderRadius:8, background:"#fff8ef", boxSizing:"border-box" }}>
          {Array.from({ length: t.denominator }).map((_, i) => {
            const color = cells[w * t.denominator + i];
            const textColor = color === "red" ? "#e83434" : color === "blue" ? "#1878ff" : "white";
            return (
              <div key={i} style={{ display:"flex", alignItems:"center", justifyContent:"center" }}>
                <span style={{ fontSize:"clamp(14px,3vw,28px)", lineHeight:1, color: textColor, WebkitTextStroke:"1.5px #111", textShadow:"0 2px 0 rgba(0,0,0,.35)" }}>{SHAPES[i % SHAPES.length]}</span>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

function polarToCartesian(cx, cy, r, angleInDegrees) {
  const angleInRadians = (angleInDegrees - 90) * Math.PI / 180;
  return { x: cx + (r * Math.cos(angleInRadians)), y: cy + (r * Math.sin(angleInRadians)) };
}
function describePieSlice(cx, cy, r, startAngle, endAngle) {
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
  return ["M", cx, cy, "L", start.x, start.y, "A", r, r, 0, largeArcFlag, 0, end.x, end.y, "Z"].join(" ");
}

function CircleModel({ t }) {
  const cells = cellsFromChunks(t);
  const size = 62; const cx = size / 2; const cy = size / 2; const radius = 28;
  return (
    <div style={{ width:"100%", height:"100%", display:"flex", flexWrap:"wrap", alignItems:"center", justifyContent:"center", gap:6, overflow:"hidden" }}>
      {Array.from({ length: t.wholes }).map((_, w) => (
        <svg key={w} width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ flex:"0 0 auto", maxWidth:"48%", maxHeight:"100%", filter:"drop-shadow(0 2px 2px rgba(0,0,0,.18))" }}>
          <circle cx={cx} cy={cy} r={radius} fill="#fff" stroke="#555" strokeWidth="3" />
          {Array.from({ length: t.denominator }).map((_, i) => {
            const color = cells[w * t.denominator + i];
            const fill = color === "red" ? "#e83434" : color === "blue" ? "#1878ff" : "#fff";
            const startAngle = i * 360 / t.denominator;
            const endAngle = (i + 1) * 360 / t.denominator;
            return <path key={`slice-${i}`} d={describePieSlice(cx, cy, radius, startAngle, endAngle)} fill={fill} stroke="#111" strokeWidth="1.4" strokeLinejoin="round" />;
          })}
          <circle cx={cx} cy={cy} r={radius} fill="none" stroke="#555" strokeWidth="3" />
          <circle cx={cx} cy={cy} r="3.8" fill="#111" />
        </svg>
      ))}
    </div>
  );
}

function TerritoryModel({ t, isDesktop }) {
  if (t.model === "Bar Model") return <BarModel t={t} />;
  if (t.model === "Set Model") return <SetModel t={t} />;
  if (t.model === "Number Line") return <NumberLine t={t} />;
  if (t.model === "Area Model") return <AreaModel t={t} isDesktop={isDesktop} />;
  return <CircleModel t={t} />;
}
function shortModelName(m) {
  if (m === "Bar Model") return "Bar"; if (m === "Set Model") return "Set";
  if (m === "Number Line") return "Line"; if (m === "Area Model") return "Area"; return "Circle";
}

function FracJack() {
  const [level, setLevel] = useState(1);

  const [victoryReached, setVictoryReached] = useState(false);

  const [discardedKeys, setDiscardedKeys] = useState({});
  const [trickUsed, setTrickUsed] = useState({ orange:{hint:false,refrac:false,jackback:false}, green:{hint:false,refrac:false,jackback:false} });
  const [pendingTrick, setPendingTrick] = useState(null);
  const [moveChunkIndex, setMoveChunkIndex] = useState(0);
  const [timer, setTimer] = useState(30);
  const [timerLimit, setTimerLimit] = useState(30);
  const [timerDisplay, setTimerDisplay] = useState("00:30");
  const [hints, setHints] = useState({ fractionIdx: null, territoryId: null });
  const [trashBurp, setTrashBurp] = useState(false);
  const [trashTripsThisTurn, setTrashTripsThisTurn] = useState(0);
  const [pow, setPow] = useState({ show:false, big:"", small:"", color:"orange", imageSrc:null, imageAlt:"", onContinue:null });
  const [lessonOverlay, setLessonOverlay] = useState(null);
  const [trashPenaltyOverlay, setTrashPenaltyOverlay] = useState(false);
  const [trashPenaltyMsg, setTrashPenaltyMsg] = useState("");
  const [penaltyAmount, setPenaltyAmount] = useState(0);
  const [rulesOverlay, setRulesOverlay] = useState(false);
  const [victoryData, setVictoryData] = useState(null);
  const [lessonReady, setLessonReady] = useState(false);

  const { muted, toggleMute, playMove, playCapture, playTrash, playBuzz, playBrand, playTerritoryVictory, playBadTrash } = useGameSounds();

  const timerRef = useRef(null);
  const timerVal = useRef(30);
  const lockedRef = useRef(true);
  const victoryRef = useRef(false);
  const startedRef = useRef(false);
  const moveChunkRef = useRef(0);
  const currentLevelRef = useRef(normalizeLevel(level));
  const inputGuardUntilRef = useRef(0);

  const viewport = useViewportSize();

  /* ── Responsive breakpoints ── */
  const isDesktop  = viewport.width > 900;
  // Mobile landscape: short screen, wider than tall, not desktop
  const isLandscape = !isDesktop && viewport.width > viewport.height && viewport.height <= 500;
  // Mobile portrait: narrow screen in portrait orientation
  const isMobile   = !isDesktop && !isLandscape && viewport.width <= 600;
  const isTablet   = !isDesktop && !isLandscape && viewport.width > 600;
  /* colMap for desktop 12-col territory grid */
  const colMap = { t1:"1/span 5", t2:"6/span 7", t3:"1/span 4", t4:"5/span 4", t5:"9/span 4" };

  useEffect(() => { setupNewGame(level); }, []); // eslint-disable-line
  useEffect(() => {
    if (!gameStarted) {
      const m = Math.floor(timerLimit / 60); const s = timerLimit % 60;
      setTimerDisplay(String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0"));
    }
  }, [timerLimit, gameStarted]);

  useEffect(() => { lockedRef.current = gameLocked; }, [gameLocked]);
  useEffect(() => { victoryRef.current = victoryReached; }, [victoryReached]);
  useEffect(() => { startedRef.current = gameStarted; }, [gameStarted]);
  useEffect(() => { moveChunkRef.current = moveChunkIndex; }, [moveChunkIndex]);
  useEffect(() => { currentLevelRef.current = normalizeLevel(level); }, [level]);

  function activeLevel() { return currentLevelRef.current; }
  function blockBoardInput(ms = 500) { inputGuardUntilRef.current = Date.now() + ms; }
  function boardInputBlocked() { return Date.now() < inputGuardUntilRef.current; }
  function unlockAfterInputGuard(ms = 300) {
    blockBoardInput(ms + 150);
    setTimeout(() => {
      if (victoryRef.current || !startedRef.current) return;
      lockedRef.current = false;
      setGameLocked(false);
    }, ms);
  }

  function stopTimer() { clearInterval(timerRef.current); }
  function armTimer(onZero) {
    clearInterval(timerRef.current);
    timerRef.current = setInterval(() => {
      if (lockedRef.current || victoryRef.current || !startedRef.current) return;
      timerVal.current = Math.max(0, timerVal.current - 1);
      const _m = Math.floor(timerVal.current / 60); const _s = timerVal.current % 60;
      setTimerDisplay(String(_m).padStart(2,"0") + ":" + String(_s).padStart(2,"0"));
      setTimer(timerVal.current);
      if (timerVal.current <= 0) { clearInterval(timerRef.current); playBuzz(); onZero(); }
    }, 1000);
  }
  function startTimer(onZero) {
    timerVal.current = timerLimit;
    const m = Math.floor(timerLimit / 60); const s = timerLimit % 60;
    setTimerDisplay(String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0"));
    setTimer(timerLimit);
    armTimer(onZero);
  }
  function resetTimerToThirty(onZero) {
    clearInterval(timerRef.current);
    timerVal.current = timerLimit;
    const m = Math.floor(timerLimit / 60); const s = timerLimit % 60;
    setTimerDisplay(String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0"));
    setTimer(timerLimit);
    armTimer(onZero);
  }
  function resumeTimer(onZero) {
    const m = Math.floor(timerVal.current / 60); const s = timerVal.current % 60;
    setTimerDisplay(String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0"));
    armTimer(onZero);
  }
  function speedMultiplier() {
    const elapsed = timerLimit - timerVal.current;
    if (elapsed <= 3) return 3;
    const decay = timerLimit - 3;
    if (decay <= 0) return 1;
    return Math.max(1, 3 - (2 * (elapsed - 3) / decay));
  }
  function nextColor() {
    const c = moveChunkRef.current % 2 === 0 ? "red" : "blue";
    moveChunkRef.current++;
    setMoveChunkIndex(prev => prev + 1);
    return c;
  }
  function showPow(big, small, color, onContinue, options = {}) {
    stopTimer();
    setPow({ show:true, big, small, color, imageSrc: options.imageSrc || null, imageAlt: options.imageAlt || "", variant: options.variant || "standard", onContinue: onContinue || null });
  }
  function dismissPow(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    blockBoardInput(650);
    setPow(p => {
      const cb = p.onContinue;
      setTimeout(() => { if (cb) cb(); }, 0);
      return { ...p, show:false, imageSrc:null, imageAlt:"", onContinue:null };
    });
  }
  function burpTrash() { setTrashBurp(true); setTimeout(() => setTrashBurp(false), 900); }

  function setupNewGame(newLevel) {
    const lv = normalizeLevel(newLevel ?? activeLevel());
    currentLevelRef.current = lv;
    setLevel(lv);
    clearInterval(timerRef.current);
    timerVal.current = timerLimit;
    lockedRef.current = true; victoryRef.current = false; startedRef.current = false; moveChunkRef.current = 0;
    const terr = createTerritories(lv);
    const disc = {};
    const fracs = rollFractions(lv, disc, terr);
    setPlayers({ orange:{ name:"Jackal", points:0 }, green:{ name:"Jackrabbit", points:0 } });
    setCurrentPlayer("orange"); setTerritories(terr); setFractions(fracs); setSelectedFracIdx(0);
    setDiscardedKeys(disc); setTrickUsed({ orange:{hint:false,refrac:false,jackback:false}, green:{hint:false,refrac:false,jackback:false} });
    setPendingTrick(null); setMoveChunkIndex(0); setVictoryData(null); setHints({ fractionIdx:null, territoryId:null });
    setGameStarted(false); setGameLocked(true); setVictoryReached(false);
    setPow({ show:false, big:"", small:"", color:"orange", imageSrc:null, imageAlt:"", onContinue:null });
    setLessonOverlay(null); setTrashPenaltyOverlay(false); setTrashPenaltyMsg(""); setTrashTripsThisTurn(0);
    inputGuardUntilRef.current = 0;
  }

  function changeLevel(newLevel) {
    const numericLevel = normalizeLevel(newLevel);
    currentLevelRef.current = numericLevel;
    setLevel(numericLevel);
    if (!gameStarted) setupNewGame(numericLevel);
  }

  function handleStart() {
    if (gameStarted || victoryReached) return;
    playBrand();
    startedRef.current = true; lockedRef.current = false;
    setGameStarted(true); setGameLocked(false); setTrashTripsThisTurn(0);
    startTimer(() => {
      lockedRef.current = true; setGameLocked(true);
      showPow("TIME'S UP!", "Turn lost!", "red", () => {
        setCurrentPlayer(prev => {
          const next = prev === "orange" ? "green" : "orange";
          const newFracs = rollFractions(activeLevel(), discardedKeys, territories);
          setFractions(newFracs); setSelectedFracIdx(0);
          lockedRef.current = false; setGameLocked(false);
          return next;
        });
      });
    });
  }

  function checkGameOver(terrs, playersState) {
    const claimed = terrs.filter(t => t.owner).length;
    if (claimed >= 5) {
      victoryRef.current = true; clearInterval(timerRef.current); lockedRef.current = true;
      setVictoryReached(true); setGameLocked(true); playBrand();
      const tie = playersState.orange.points === playersState.green.points;
      const winner = playersState.green.points > playersState.orange.points ? "green" : "orange";
      setVictoryData({ winner: tie ? "tie" : winner, tie, points: playersState });
      showPow(tie ? "TIE!" : "CHAMP!", tie ? "Same Jack Points!" : playersState[tie ? "orange" : winner].points + " Jack Points", tie ? "blue" : winner, null);
      return true;
    }
    return false;
  }

  function doSwitchTurn(nextPlayer, newFracs, newDisc, territoriesOverride) {
    const nextTerritories = territoriesOverride || territories;
    const nextDiscarded = newDisc ?? discardedKeys;
    setHints({ fractionIdx:null, territoryId:null }); setCurrentPlayer(nextPlayer); setPendingTrick(null); setTrashTripsThisTurn(0);
    const baseHand = newFracs ?? rollFractions(activeLevel(), nextDiscarded, nextTerritories);
    const fracsToUse = cleanFractionHand(activeLevel(), baseHand, nextDiscarded, nextTerritories);
    setFractions(fracsToUse); setSelectedFracIdx(0); lockedRef.current = false; setGameLocked(false);
    startTimer(() => {
      lockedRef.current = true; setGameLocked(true);
      showPow("TIME'S UP!", "Turn lost!", "red", () => {
        const nxt = nextPlayer === "orange" ? "green" : "orange";
        const nf = rollFractions(activeLevel(), nextDiscarded, nextTerritories);
        setFractions(nf); setSelectedFracIdx(0); lockedRef.current = false; setGameLocked(false); setCurrentPlayer(nxt);
        startTimer(() => {});
      });
    });
  }

  function handleTerritoryClick(id) {
    if (gameLocked || !gameStarted || victoryReached || boardInputBlocked()) return;
    setHints({ fractionIdx:null, territoryId:null });
    const t = territories[id];
    if (!t || t.owner) return;
    if (pendingTrick === "jackback") { doJackback(t); return; }
    const frac = fractions[selectedFracIdx];
    if (!frac) return;
    if (!fractionFits(frac, t)) {
      lockedRef.current = true; setGameLocked(true); playBuzz();
      showPow("NO FIT!", denomWord(frac.d) + " can't fit " + denomWord(t.denominator) + ".\nLose Your Turn", "red", () => {
        doSwitchTurn(currentPlayer === "orange" ? "green" : "orange");
      });
      return;
    }
    const units = fractionUnits(frac, t);
    const max = t.denominator * t.wholes;
    const remaining = max - t.filledUnits;
    if (units > remaining) { doHijack(t, frac, remaining); return; }
    doPlace(t, frac, units);
  }

  function doPlace(t, frac, units) {
    lockedRef.current = true; setGameLocked(true);
    const mult = speedMultiplier();
    const placePts = Math.round(50 * mult);
    const color = t.chunks.length % 2 === 0 ? "red" : "blue";
    const max = t.denominator * t.wholes;
    const clampedUnits = Math.min(units, max - t.filledUnits);
    const roundedUnits = Math.round(clampedUnits * 1000) / 1000;
    const updatedT = { ...t, chunks: [...t.chunks, { units: roundedUnits, color }], filledUnits: t.filledUnits + clampedUnits };
    const newFracs = (() => {
      const usedKeys = {};
      fractions.forEach((f, i) => { if (i !== selectedFracIdx) usedKeys[fractionKey(f)] = true; });
      const newF = createFractionFromPool(activeLevel(), usedKeys, discardedKeys);
      const arr = fractions.slice(); arr[selectedFracIdx] = newF;
      return cleanFractionHand(activeLevel(), arr, discardedKeys, territories);
    })();
    const newTerrs = territories.map(tt => tt.id === t.id ? updatedT : tt);
    if (updatedT.filledUnits >= max) {
      let bonus = updatedT.wholes * 100;
      if (activeLevel() === 1) bonus = updatedT.wholes * 50;
      if (activeLevel() === 2) bonus = updatedT.wholes * 75;
      playTerritoryVictory();
      const speedLabel = mult >= 2.5 ? " ⚡FAST!" : mult >= 1.5 ? " ⚡" : "";
      showPow("+" + (placePts + bonus), currentPlayer === "orange" ? "Jackal JACKED IT!" + speedLabel : "Jackrabbit JACKED IT!" + speedLabel, currentPlayer, () => {
        const ownedT = { ...updatedT, owner: currentPlayer };
        const finalTerrs = newTerrs.map(tt => tt.id === t.id ? ownedT : tt);
        setTerritories(finalTerrs); setFractions(newFracs); setSelectedFracIdx(0);
        setPlayers(prev => {
          const np = { ...prev, [currentPlayer]: { ...prev[currentPlayer], points: prev[currentPlayer].points + placePts + bonus } };
          if (checkGameOver(finalTerrs, np)) return np;
          doSwitchTurn(currentPlayer === "orange" ? "green" : "orange", newFracs, undefined, finalTerrs);
          return np;
        });
      });
    } else {
      playMove();
      const speedLabelMove = mult >= 2.5 ? " ⚡FAST!" : mult >= 1.5 ? " ⚡" : "";
      setPlayers(prev => ({ ...prev, [currentPlayer]: { ...prev[currentPlayer], points: prev[currentPlayer].points + placePts } }));
      setTerritories(newTerrs); setFractions(newFracs); setSelectedFracIdx(0);
      showPow("+" + placePts + speedLabelMove, currentPlayer === "orange" ? "Jackal" : "Jackrabbit", currentPlayer, () => {
        doSwitchTurn(currentPlayer === "orange" ? "green" : "orange", newFracs, undefined, newTerrs);
      });
    }
  }

  function doHijack(t, frac, remaining) {
    lockedRef.current = true; setGameLocked(true);
    const opp = currentPlayer === "orange" ? "green" : "orange";
    let bonus = 300;
    if (activeLevel() === 1) bonus = 100;
    if (activeLevel() === 2) bonus = 200;
    const newFracs = (() => {
      const usedKeys = {};
      fractions.forEach((f, i) => { if (i !== selectedFracIdx) usedKeys[fractionKey(f)] = true; });
      const newF = createFractionFromPool(activeLevel(), usedKeys, discardedKeys);
      const arr = fractions.slice(); arr[selectedFracIdx] = newF;
      return cleanFractionHand(activeLevel(), arr, discardedKeys, territories);
    })();
    playBadTrash(); setTimeout(() => playBuzz(), 180);
    showPow("HIJACKED!", players[opp].name + " +" + bonus, "red", () => {
      setLessonOverlay({ t, remaining, callback: () => {
        const ownedT = { ...t, owner: opp, hijacked: true };
        const finalTerrs = territories.map(tt => tt.id === t.id ? ownedT : tt);
        setTerritories(finalTerrs); setFractions(newFracs); setSelectedFracIdx(0);
        setPlayers(prev => {
          const np = { ...prev, [opp]: { ...prev[opp], points: prev[opp].points + bonus } };
          if (checkGameOver(finalTerrs, np)) return np;
          doSwitchTurn(opp, newFracs, undefined, finalTerrs);
          return np;
        });
      }});
      setLessonReady(false);
      setTimeout(() => setLessonReady(true), 3000);
    });
  }

  function doJackback(t) {
    if (t.owner) return;
    setPendingTrick(null); lockedRef.current = true; setGameLocked(true);
    showPow("JACKBACK", "One whole cleared", currentPlayer, () => {
      const amount = t.denominator;
      let left = Math.min(amount, t.filledUnits);
      const newChunks = t.chunks.slice();
      let filled = t.filledUnits;
      while (left > 0 && newChunks.length > 0) {
        const last = newChunks[newChunks.length - 1];
        if (last.units <= left) { left -= last.units; filled -= last.units; newChunks.pop(); }
        else { newChunks[newChunks.length - 1] = { ...last, units: last.units - left }; filled -= left; left = 0; }
      }
      if (filled < 0) filled = 0;
      const newTerrs = territories.map(tt => tt.id === t.id ? { ...tt, chunks: newChunks, filledUnits: filled } : tt);
      setTerritories(newTerrs);
      doSwitchTurn(currentPlayer === "orange" ? "green" : "orange", undefined, undefined, newTerrs);
    });
  }

  function handleTrashLimitReached() {
    lockedRef.current = true; setGameLocked(true); stopTimer(); playBuzz();
    showPow("TRASH LIMIT!", "Max 3 trash trips per turn. Play a fraction now.", "red", () => {
      lockedRef.current = false; setGameLocked(false);
      resumeTimer(() => {
        lockedRef.current = true; setGameLocked(true);
        showPow("TIME'S UP!", "Turn lost!", "red", () => doSwitchTurn(currentPlayer === "orange" ? "green" : "orange"));
      });
    });
  }

  function handleTrashClick() {
    if (gameLocked || pendingTrick || !gameStarted || victoryReached || boardInputBlocked()) return;
    setHints({ fractionIdx:null, territoryId:null });
    const frac = fractions[selectedFracIdx];
    if (!frac) return;
    if (trashTripsThisTurn >= 3) { handleTrashLimitReached(); return; }
    setTrashTripsThisTurn(prev => prev + 1);
    const hasMove = territories.some(t => isLegalMove(frac, t));
    if (hasMove) badTrash(); else goodTrash();
  }

  function goodTrash() {
    const trashed = fractions[selectedFracIdx];
    if (!trashed) return;
    lockedRef.current = true; setGameLocked(true); stopTimer();
    const scoringPlayer = currentPlayer;
    const newDisc = { ...discardedKeys, [fractionKey(trashed)]: true };
    setDiscardedKeys(newDisc);
    playTrash(); burpTrash();
    const usedKeys = {};
    fractions.forEach((f, i) => { if (i !== selectedFracIdx) usedKeys[fractionKey(f)] = true; });
    const newFrac = createSmartLegalFraction(activeLevel(), usedKeys, newDisc, territories);
    const newFracs = cleanFractionHand(activeLevel(), (() => { const arr = fractions.slice(); arr[selectedFracIdx] = newFrac; return arr; })(), newDisc, territories);
    setFractions(newFracs); setSelectedFracIdx(0);
    const trashPts = 50;
    setPlayers(prev => ({ ...prev, [scoringPlayer]: { ...prev[scoringPlayer], points: prev[scoringPlayer].points + trashPts } }));
    const trashLines = ["That fraction was GARBAGE anyway!","Bye bye, bad fraction! 👋","Into the void it goes!","The trash can is DELIGHTED.","That fraction had no friends here.","Disposed of with extreme prejudice!","Even the trash can rolled its eyes.","One fraction's trash is no one's treasure."];
    const trashMsg = trashLines[Math.floor(Math.random() * trashLines.length)];
    showPow("FRAC TRASH! +" + trashPts, trashMsg, scoringPlayer, () => {
      resetTimerToThirty(() => {
        lockedRef.current = true; setGameLocked(true);
        showPow("TIME'S UP!", "Turn lost!", "red", () => { doSwitchTurn(scoringPlayer === "orange" ? "green" : "orange"); });
      });
      unlockAfterInputGuard(350);
    }, { imageSrc: IMG_TRASH, imageAlt: "Frac Trash", variant: "trashSuccess" });
  }

  function badTrash() {
    lockedRef.current = true; setGameLocked(true); stopTimer();
    playBadTrash(); setTimeout(() => playBuzz(), 180);
    burpTrash();
    const penalty = activeLevel() === 1 ? 50 : activeLevel() === 2 ? 50 : 100;
    setPlayers(prev => ({ ...prev, [currentPlayer]: { ...prev[currentPlayer], points: prev[currentPlayer].points - penalty } }));
    const badLines = ["That fraction was perfectly good! The trash can is FURIOUS.","You just tried to trash a totally legal fraction. Shameful.","The trash can spit it right back out.","Nice try. That fraction had moves and you knew it.","The trash can called your bluff.","That fraction files a formal complaint.","Even the trash can has standards. That fraction stays.","The trash can has seen things, but THIS? Bad trash move."];
    setTrashPenaltyMsg(badLines[Math.floor(Math.random() * badLines.length)]);
    setTrashPenaltyOverlay(true); setPenaltyAmount(penalty);
  }

  function applyTrick(player, trick) {
    if (gameLocked || victoryReached || !gameStarted) return;
    if (player !== currentPlayer) return;
    if (trickUsed[player][trick]) return;
    setTrickUsed(prev => ({ ...prev, [player]: { ...prev[player], [trick]: true } }));
    if (trick === "hint") {
      setHints({ fractionIdx:null, territoryId:null });
      let found = null;
      outer: for (let i = 0; i < fractions.length; i++) {
        for (let j = 0; j < territories.length; j++) {
          if (isLegalMove(fractions[i], territories[j])) { found = { fractionIdx: i, territoryId: territories[j].id }; break outer; }
        }
      }
      if (!found) { showPow("NO LEGAL MOVES", "Try a Jack Trick or wait.", "red", null); return; }
      setSelectedFracIdx(found.fractionIdx); setHints(found);
      showPow("HINT!", "Try this move.", currentPlayer, null);
      return;
    }
    if (trick === "refrac") {
      setHints({ fractionIdx:null, territoryId:null });
      setFractions(rollFractions(activeLevel(), discardedKeys, territories));
      setSelectedFracIdx(0); showPow("RE-FRAC!", "New choices", currentPlayer, null);
      return;
    }
    if (trick === "jackback") {
      setHints({ fractionIdx:null, territoryId:null });
      setPendingTrick("jackback");
      showPow("JACKBACK", "Pick territory", currentPlayer, null);
    }
  }

  function renderLesson() {
    if (!lessonOverlay) return null;
    const { t, remaining, callback } = lessonOverlay;
    const simp = simplify(remaining, t.denominator);
    return (
      <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.58)", zIndex:100, display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
        <div style={{ width:"min(760px,94vw)", background:"white", color:"#111", border:"7px solid #111", borderRadius:30, padding:24, boxShadow:"0 18px 42px rgba(0,0,0,.48)", textAlign:"center" }}>
          <div style={{ fontSize:27, fontWeight:1000, color:"#df2525", lineHeight:1 }}>HIJACKED!</div>
          <div style={{ fontSize:15, fontWeight:1000, margin:"12px 0 18px" }}>This amount would have filled it.</div>
          <div style={{ width:"min(520px,88%)", height:72, margin:"0 auto 16px", border:"4px solid #111", display:"grid", gridTemplateColumns:`repeat(${t.denominator},1fr)`, background:"#fff7df" }}>
            {Array.from({ length: t.denominator }).map((_, i) => (
              <div key={i} style={{ borderRight: i < t.denominator - 1 ? "1px solid rgba(0,0,0,.38)" : "none", background: i < (remaining % t.denominator || t.denominator) ? "linear-gradient(180deg,#fff17a,#ffcc25)" : "transparent" }} />
            ))}
          </div>
          <div style={{ display:"flex", justifyContent:"center", gap:18, flexWrap:"wrap", marginBottom:18 }}>
            <div style={{ background:"#111", color:"white", borderRadius:18, padding:"10px 18px", fontSize:25, fontWeight:1000 }}>{remaining}/{t.denominator}</div>
            {!(simp.n === remaining && simp.d === t.denominator) && (
              <div style={{ background:"#111", color:"white", borderRadius:18, padding:"10px 18px", fontSize:25, fontWeight:1000 }}>{simp.n}/{simp.d}</div>
            )}
          </div>
          <button onClick={() => { if (!lessonReady) return; setLessonOverlay(null); callback(); }} style={{ border:0, borderRadius:999, padding:"12px 28px", fontSize:19, fontWeight:1000, background:"#111", color:"white", cursor: lessonReady ? "pointer" : "default", opacity: lessonReady ? 1 : 0.42 }}>
            {lessonReady ? "Continue" : "Look closely..."}
          </button>
        </div>
      </div>
    );
  }

  /* ─── Territory grid layout ─────────────────────────────────────────── */
  function renderTerritories() {
    if (isDesktop) {
      if (!territories || territories.length === 0) return null;
      return (
        <div style={{ minHeight:0, display:"grid", gridTemplateColumns:"repeat(12,1fr)", gridTemplateRows:"repeat(2,minmax(0,1fr))", gap:10 }}>
          {territories.map(t => (
            <div key={t.id} style={{ gridColumn: colMap[t.slot], gridRow: ["t1","t2"].includes(t.slot) ? 1 : 2, minHeight:0 }}>
              <TerritoryCard t={t} onClick={handleTerritoryClick} isHinted={hints.territoryId === t.id} players={players} gameLocked={gameLocked} gameStarted={gameStarted} victoryReached={victoryReached} boardInputBlocked={boardInputBlocked} isDesktop={true} />
            </div>
          ))}
        </div>
      );
    }

    /* Portrait mobile:
       T1 (Set)    — full width
       T2 (Number Line) — full width
       T3 (Area) + T4 (Circle) — side by side, each 50%
       T5 (Bar)    — full width
    */
    if (!territories || territories.length < 5) return null;
    const t1 = territories[0], t2 = territories[1], t3 = territories[2], t4 = territories[3], t5 = territories[4];
    const cardProps = { onClick: handleTerritoryClick, players, gameLocked, gameStarted, victoryReached, boardInputBlocked, isDesktop: false };

    return (
      <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
        <TerritoryCard key={t1.id} t={t1} isHinted={hints.territoryId === t1.id} {...cardProps} />
        <TerritoryCard key={t2.id} t={t2} isHinted={hints.territoryId === t2.id} {...cardProps} />
        {/* T3 + T4 side by side */}
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6 }}>
          <TerritoryCard key={t3.id} t={t3} isHinted={hints.territoryId === t3.id} {...cardProps} />
          <TerritoryCard key={t4.id} t={t4} isHinted={hints.territoryId === t4.id} {...cardProps} />
        </div>
        <TerritoryCard key={t5.id} t={t5} isHinted={hints.territoryId === t5.id} {...cardProps} />
      </div>
    );
  }

  /* ─── Fraction + trash row ─────────────────────────────────────────── */
  function renderFractionRow() {
    return (
      <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap: isMobile ? 7 : 14, flexWrap:"wrap", overflow:"visible", position:"relative", zIndex:10 }}>
        {fractions.map((f, i) => {
          const txt = f.display || (f.n + "/" + f.d);
          const isSelected = i === selectedFracIdx;
          const isHinted = hints.fractionIdx === i;
          return (
            <div key={i}
              onClick={() => { if (gameLocked || pendingTrick || boardInputBlocked()) return; setHints({ fractionIdx:null, territoryId:null }); setSelectedFracIdx(i); }}
              style={{
                width: isMobile ? 58 : 70, height: isMobile ? 36 : 38,
                background:"white", color:"#111", border:"3px solid white", borderRadius:13,
                display:"flex", alignItems:"center", justifyContent:"center",
                fontSize:18, fontWeight:1000, lineHeight:.95,
                cursor:"pointer",
                boxShadow: isHinted ? "0 0 0 7px #fff24c,0 0 22px #fff24c,0 8px 14px rgba(0,0,0,.38)" : isSelected ? "0 0 0 5px #ffd83d,0 8px 14px rgba(0,0,0,.38)" : i===0 ? "0 0 0 3px rgba(255,135,0,.75),0 6px 12px rgba(0,0,0,.35)" : i===1 ? "0 0 0 3px rgba(24,120,255,.75),0 6px 12px rgba(0,0,0,.35)" : "0 0 0 3px rgba(163,92,255,.75),0 6px 12px rgba(0,0,0,.35)",
                transform: isSelected ? "translateY(-3px) scale(1.04)" : "none",
                animation: isHinted ? "hintPulse 1s infinite alternate" : "none",
                transition:".15s"
              }}>
              {txt.includes(" ") ? <span style={{ fontSize: isMobile ? 14 : 15 }}>{txt}</span> : txt}
            </div>
          );
        })}
        {/* Trash only shown here on mobile — on desktop it lives in the top bar */}
        {!isDesktop && (
          <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:2, overflow:"visible" }}>
            <button onClick={handleTrashClick} title={`Trash trips this turn: ${trashTripsThisTurn}/3`} style={{
              width:50, height:42,
              border:"3px solid rgba(255,255,255,.98)", borderRadius:14,
              background: trashTripsThisTurn >= 3 ? "#8a8f98" : "#d0d4da",
              display:"flex", alignItems:"center", justifyContent:"center",
              cursor: trashTripsThisTurn >= 3 ? "not-allowed" : "pointer",
              boxShadow:"0 5px 10px rgba(0,0,0,.45)", padding:3, overflow:"hidden",
              transition:".15s", opacity: trashTripsThisTurn >= 3 ? .65 : 1
            }}>
              <img src={IMG_TRASH} alt="Trash" style={{ width:40, height:34, objectFit:"contain", display:"block", animation: trashBurp ? "trashShake .22s 4" : "none" }} />
            </button>
            <div style={{ fontSize:13, fontWeight:1000, color:"white", textShadow:"0 2px 4px rgba(0,0,0,.7)", lineHeight:1.2, whiteSpace:"nowrap" }}>Trash {trashTripsThisTurn}/3</div>
          </div>
        )}
      </div>
    );
  }

  /* ─── Main render ────────────────────────────────────────────────────── */
  const BG = "radial-gradient(circle at 50% 18%, rgba(255,255,255,.16), transparent 18%), radial-gradient(circle at 50% 48%, rgba(0,105,255,.30), transparent 30%), radial-gradient(circle at 12% 45%, rgba(255,135,0,.28), transparent 22%), radial-gradient(circle at 88% 45%, rgba(64,201,31,.25), transparent 22%), linear-gradient(180deg,#020b1f 0%,#06245d 46%,#020916 100%)";

  return (
    <>
      {!gameStarted && (
        <IntroScreen timerLimit={timerLimit} onTimerChange={setTimerLimit} level={level} onLevelChange={changeLevel} onStart={handleStart} isMobile={isMobile || isTablet || isLandscape} />
      )}

      {/* ── DESKTOP LAYOUT ────────────────────────────────────────────── */}
      {isDesktop && (
        <div style={{
          position:"fixed", inset:0, overflow:"hidden",
          display:"grid",
          gridTemplateColumns:"240px 1fr 240px",
          gridTemplateRows:"1fr",
          gap:10, padding:10,
          fontFamily:"Arial, Helvetica, sans-serif", color:"white", userSelect:"none", background:BG
        }}>
          {/* LEFT — Orange score + player panel */}
          <div style={{ display:"flex", flexDirection:"column", gap:8, minHeight:0 }}>
            <ScoreCard color="orange" name="JACKAL" points={players.orange.points} />
            <div style={{ flex:1, minHeight:0 }}>
              <PlayerPanel color="orange" active={currentPlayer==="orange"&&gameStarted} mascotSrc={IMG_JACKAL} mascotClass="orange" trickUsed={trickUsed.orange} onTrick={t => applyTrick("orange",t)} level={level} />
            </div>
          </div>

          {/* CENTER — top band (logo | fractions | controls) + territories below */}
          <div style={{ minWidth:0, minHeight:0, display:"grid", gridTemplateRows:"150px minmax(0,1fr)", gap:8 }}>

            {/* TOP BAND: 3 columns — logo | fraction chips | controls */}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 120px 1fr", gap:10, alignItems:"stretch" }}>

              {/* LEFT: Logo as large as possible */}
              <div style={{ display:"flex", alignItems:"center", justifyContent:"flex-start", paddingLeft:8, overflow:"visible" }}>
                <img src={IMG_LOGO} alt="Frac Jack" style={{
                  maxHeight:190, maxWidth:"100%", objectFit:"contain",
                  transform:"translateY(14px) scale(1.08)",

            <button onClick={() => setupNewGame()} style={{ border:"3px solid #ffd83d", borderRadius:12, padding:"8px 18px", fontSize:14, fontWeight:1000, background:"linear-gradient(180deg,#ffe84d,#f0b800)", color:"#111", cursor:"pointer", textTransform:"uppercase", boxShadow:"0 4px 10px rgba(0,0,0,.35)" }}>New Game</button>
          </div>
          <img src={victoryData.tie ? IMG_LOGO : victoryData.winner === "orange" ? IMG_JACKAL : IMG_JACKRABBIT} alt="" style={{ maxWidth:110, maxHeight:110, objectFit:"contain" }} />
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FracJack />);
  </script>
</body>
</html>
