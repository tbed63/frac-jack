<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frac Jack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: 'system-ui', sans-serif; }
    .territory { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .territory:active { transform: scale(0.95); }
    .frac-option { transition: all 0.2s; }
  </style>
</head>
<body class="bg-gradient-to-br from-[#020b1f] via-[#06245d] to-[#020916] text-white min-h-screen">

<div class="max-w-6xl mx-auto p-4">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <div class="text-3xl font-bold text-orange-400">🐺 Jackal <span id="orange-score">0</span></div>
    <div class="text-center">
      <h1 class="text-5xl font-black tracking-widest text-yellow-300">FRAC JACK</h1>
      <div id="timer" class="text-6xl font-mono font-bold mt-1">30</div>
    </div>
    <div class="text-3xl font-bold text-green-400 text-right">Jackrabbit <span id="green-score">0</span> 🐰</div>
  </div>

  <!-- Fractions -->
  <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-6 mb-8">
    <p class="text-center text-yellow-200 mb-4 font-medium">YOUR FRACTIONS — Click one to select</p>
    <div id="fractions-container" class="flex justify-center gap-6 flex-wrap"></div>
  </div>

  <!-- Territories -->
  <div id="territories-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

  <!-- Controls -->
  <div class="flex justify-center gap-6 mt-10">
    <button onclick="trashCurrent()" 
            class="flex items-center gap-3 bg-red-600 hover:bg-red-700 px-10 py-5 rounded-2xl text-xl font-bold shadow-xl">
      <i class="fas fa-trash"></i> TRASH FRACTION
    </button>
    <button onclick="newGame()" 
            class="bg-white/20 hover:bg-white/30 px-8 py-5 rounded-2xl text-xl font-bold">
      New Game
    </button>
  </div>
</div>

<script>
// ==================== GAME STATE ====================
let currentPlayer = "orange";
let scores = { orange: 0, green: 0 };
let timeLeft = 30;
let timerInterval = null;
let selectedFracIndex = -1;
let gameOver = false;

let territories = [];
let currentFractions = [];
let discardedKeys = {};

// ==================== HELPERS ====================
function fractionKey(f) { return `${f.n}/${f.d}`; }

function generateTerritories() {
  territories = [
    {id:0, slot:"t1", name:"T1", model:"Set",   den:4, wholes:2, filled:0, owner:null, color:"orange"},
    {id:1, slot:"t2", name:"T2", model:"Line",  den:6, wholes:2, filled:0, owner:null, color:"blue"},
    {id:2, slot:"t3", name:"T3", model:"Circle",den:4, wholes:3, filled:0, owner:null, color:"red"},
    {id:3, slot:"t4", name:"T4", model:"Bar",   den:5, wholes:2, filled:0, owner:null, color:"blue"},
    {id:4, slot:"t5", name:"T5", model:"Area",  den:8, wholes:2, filled:0, owner:null, color:"red"}
  ];
}

function generateFractions() {
  const pool = [
    {n:1,d:2},{n:1,d:3},{n:1,d:4},{n:2,d:3},{n:3,d:4},
    {n:1,d:5},{n:2,d:5},{n:3,d:5},{n:1,d:6},{n:5,d:6},{n:3,d:8}
  ];
  currentFractions = pool.sort(() => Math.random() - 0.5).slice(0, 3);
  selectedFracIndex = -1;
}

// ==================== TIMER ====================
function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 30;
  document.getElementById("timer").textContent = timeLeft;
  
  timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById("timer").textContent = timeLeft;
    if (timeLeft <= 0) endTurn();
  }, 1000);
}

function endTurn() {
  clearInterval(timerInterval);
  currentPlayer = currentPlayer === "orange" ? "green" : "orange";
  generateFractions();
  render();
  startTimer();
}

// ==================== RENDER ====================
function render() {
  // Fractions
  let fracHTML = "";
  currentFractions.forEach((f, i) => {
    const isSelected = i === selectedFracIndex;
    fracHTML += `
      <div onclick="selectFraction(${i})" 
           class="frac-option bg-white text-black font-bold text-4xl px-10 py-8 rounded-3xl cursor-pointer shadow-xl ${isSelected ? 'ring-4 ring-yellow-400 scale-110' : 'hover:scale-105'}">
        ${f.n}/${f.d}
      </div>`;
  });
  document.getElementById("fractions-container").innerHTML = fracHTML;

  // Territories
  let terrHTML = "";
  territories.forEach(t => {
    const percent = Math.min(100, (t.filled / (t.wholes * t.den)) * 100);
    terrHTML += `
      <div onclick="placeFraction(${t.id})" class="territory bg-white/10 backdrop-blur-xl border-4 ${t.owner ? (t.owner==='orange'?'border-orange-500':'border-green-500') : 'border-white/40'} rounded-3xl p-6 cursor-pointer">
        <div class="text-center">
          <div class="font-bold text-lg">${t.name} • ${t.model}</div>
          <div class="text-6xl font-black my-4">${t.wholes}</div>
          <div class="h-5 bg-white/20 rounded-full overflow-hidden mb-3">
            <div class="h-full bg-gradient-to-r from-yellow-400 to-orange-500" style="width: ${percent}%"></div>
          </div>
          <div class="text-sm">${t.filled} / ${t.wholes * t.den} units</div>
          ${t.owner ? `<div class="mt-4 text-xl font-bold">${t.owner === 'orange' ? '🐺 JACKED!' : '🐰 JACKED!'}</div>` : ''}
        </div>
      </div>`;
  });
  document.getElementById("territories-container").innerHTML = terrHTML;

  document.getElementById("orange-score").textContent = scores.orange;
  document.getElementById("green-score").textContent = scores.green;
}

// ==================== ACTIONS ====================
function selectFraction(i) {
  selectedFracIndex = i;
  render();
}

function placeFraction(terrId) {
  if (selectedFracIndex === -1 || gameOver) return;
  
  const frac = currentFractions[selectedFracIndex];
  const terr = territories.find(t => t.id === terrId);
  if (!terr || terr.owner) return;

  const unitsAdded = Math.round((frac.n / frac.d) * terr.den);
  
  if (unitsAdded + terr.filled > terr.wholes * terr.den) {
    alert("This fraction is too big for the remaining space!");
    return;
  }

  terr.filled += unitsAdded;
  const points = unitsAdded * 15 + 20;

  if (currentPlayer === "orange") scores.orange += points;
  else scores.green += points;

  // Check if territory completed
  if (terr.filled >= terr.wholes * terr.den) {
    terr.owner = currentPlayer;
    alert(`🎉 ${currentPlayer.toUpperCase()} JACKED ${terr.name}!`);
  }

  generateFractions();
  render();

  if (territories.every(t => t.owner)) {
    gameOver = true;
    clearInterval(timerInterval);
    setTimeout(() => {
      const winner = scores.orange > scores.green ? "Jackal" : "Jackrabbit";
      alert(`🏆 GAME OVER! ${winner} Wins!`);
    }, 400);
  } else {
    endTurn();
  }
}

function trashCurrent() {
  if (selectedFracIndex === -1) return;
  
  const points = 25;
  if (currentPlayer === "orange") scores.orange += points;
  else scores.green += points;

  alert("🗑️ Good trash! +25 points");
  generateFractions();
  render();
  startTimer();
}

function newGame() {
  scores = { orange: 0, green: 0 };
  gameOver = false;
  generateTerritories();
  generateFractions();
  currentPlayer = "orange";
  render();
  startTimer();
}

// Start the game
window.onload = () => {
  newGame();
};
</script>
</body>
</html>
