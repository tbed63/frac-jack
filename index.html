    @keyframes trashShake { 0%{transform:rotate(0deg) translateX(0);} 25%{transform:rotate(-7deg) translateX(-1px);} 50%{transform:rotate(6deg) translateX(1px);} 75%{transform:rotate(-4deg) translateX(-1px);} 100%{transform:rotate(0deg) translateX(0);} }
    @keyframes hintPulse { from{ transform:scale(1); } to{ transform:scale(1.08); } }

<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

function useGameSounds() {
  const [muted, setMuted] = useState(false);

  // ========================================================================
  // FRAC JACK WEB AUDIO ENGINE — MOBILE-FIRST / WEB AUDIO ONLY
  // ========================================================================
  // This version is intentionally built to solve the most common mobile audio
  // failure: creating an AudioContext is not enough; iOS/Android browsers may
  // keep it suspended until resume() finishes from a real user gesture.
  //
  // Key rules used here:
  // 1. NO external sound files. Everything is Web Audio API oscillators/noise.
  // 2. Every user gesture calls unlockAudio().
  // 3. Every sound calls playWhenReady(), which resumes the AudioContext first.
  // 4. If the context is still suspended, the sound is scheduled AFTER resume().
  // 5. All sounds go through a master gain so mobile volume is strong.
  // 6. The rising harp is preserved for correct fraction placement and good
  //    Frac Trash throws.
  // ========================================================================

  const audioCtxRef = useRef(null);
  const masterGainRef = useRef(null);
  const unlockedRef = useRef(false);
  const mutedRef = useRef(false);
  const lastHoverRef = useRef(0);
  const lastTapRef = useRef(0);
  const lastUnlockAttemptRef = useRef(0);

  const MASTER_VOLUME = 1.0; // intentionally loud for mobile, still controlled by per-sound gains

  useEffect(()=>{ mutedRef.current = muted; }, [muted]);

  function getAudioContext(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      if(!audioCtxRef.current){
        const ctx = new AC({ latencyHint: "interactive" });
        const master = ctx.createGain();
        master.gain.setValueAtTime(MASTER_VOLUME, ctx.currentTime);
        master.connect(ctx.destination);
        audioCtxRef.current = ctx;
        masterGainRef.current = master;
      }
      return audioCtxRef.current;
    }catch(e){ return null; }
  }

  function getMaster(){
    getAudioContext();
    return masterGainRef.current;
  }

  function primeSilentBlip(){
    try{
      const ctx = getAudioContext();
      const master = getMaster();
      if(!ctx || !master) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(440, t);
      gain.gain.setValueAtTime(0.0001, t);
      osc.connect(gain);
      gain.connect(master);
      osc.start(t);
      osc.stop(t + 0.02);
    }catch(e){}
  }

  function unlockAudio(){
    try{
      const nowMs = (performance && performance.now) ? performance.now() : Date.now();
      if(nowMs - lastUnlockAttemptRef.current < 25) return;
      lastUnlockAttemptRef.current = nowMs;

      const ctx = getAudioContext();
      if(!ctx) return;

      const finishUnlock = () => {
        try{
          primeSilentBlip();
          unlockedRef.current = true;
        }catch(e){}
      };

      if(ctx.state === "suspended"){
        const p = ctx.resume();
        if(p && typeof p.then === "function") p.then(finishUnlock).catch(()=>{});
        else finishUnlock();
      }else{
        finishUnlock();
      }
    }catch(e){}
  }

  // This is the critical mobile-safe wrapper. It does NOT assume resume() is
  // instant. If audio is suspended, the requested sound waits until resume()
  // resolves, then plays immediately.
  function playWhenReady(soundFn){
    if(mutedRef.current) return;
    try{
      const ctx = getAudioContext();
      const master = getMaster();
      if(!ctx || !master) return;
      const fire = () => {
        try{
          if(mutedRef.current) return;
          soundFn(ctx, master, ctx.currentTime);
        }catch(e){}
      };
      if(ctx.state === "suspended"){
        const p = ctx.resume();
        if(p && typeof p.then === "function") p.then(()=>fire()).catch(()=>{});
        else fire();
      }else{
        fire();
      }
      unlockedRef.current = true;
    }catch(e){}
  }

  useEffect(()=>{
    const gestureUnlock = () => unlockAudio();
    const tapHandler = (e) => {
      unlockAudio();
      const nowMs = (performance && performance.now) ? performance.now() : Date.now();
      if(nowMs - lastTapRef.current < 70) return;
      lastTapRef.current = nowMs;
      const target = e.target;
      const playable = target && target.closest && (
        target.closest("button") ||
        target.closest("select") ||
        target.closest("[role='button']") ||
        target.closest("div")
      );
      if(playable) playButtonTap();
    };
    const hoverHandler = (e) => {
      const target = e.target;
      if(!target || !target.closest) return;
      if(!(target.closest("button") || target.closest("select"))) return;
      const nowMs = (performance && performance.now) ? performance.now() : Date.now();
      if(nowMs - lastHoverRef.current < 95) return;
      lastHoverRef.current = nowMs;
      playHover();
    };

    // Use several gesture types because mobile browsers vary.
    window.addEventListener("pointerdown", tapHandler, {capture:true, passive:true});
    window.addEventListener("touchstart", tapHandler, {capture:true, passive:true});
    window.addEventListener("click", gestureUnlock, {capture:true, passive:true});
    window.addEventListener("keydown", gestureUnlock, {capture:true});
    document.addEventListener("mouseover", hoverHandler, {capture:true, passive:true});
    document.addEventListener("mouseenter", hoverHandler, {capture:true, passive:true});

    return()=>{
      window.removeEventListener("pointerdown", tapHandler, true);
      window.removeEventListener("touchstart", tapHandler, true);
      window.removeEventListener("click", gestureUnlock, true);
      window.removeEventListener("keydown", gestureUnlock, true);
      document.removeEventListener("mouseover", hoverHandler, true);
      document.removeEventListener("mouseenter", hoverHandler, true);
    };
  },[]);

  function osc(ctx, master, t, {freq=440, endFreq=null, start=0, duration=0.1, type="sine", volume=0.12, attack=0.006}){
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    const st = t + start;
    o.type = type;
    o.frequency.setValueAtTime(freq, st);
    if(endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq), st + duration);
    g.gain.setValueAtTime(0.0001, st);
    g.gain.linearRampToValueAtTime(volume, st + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, st + duration);
    o.connect(g);
    g.connect(master);
    o.start(st);
    o.stop(st + duration + 0.03);
  }

  function noise(ctx, master, t, {start=0, duration=0.08, volume=0.08, filterFreq=900, type="lowpass"}={}){
    const st = t + start;
    const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const g = ctx.createGain();
    src.buffer = buffer;
    filter.type = type;
    filter.frequency.setValueAtTime(filterFreq, st);
    g.gain.setValueAtTime(volume, st);
    g.gain.exponentialRampToValueAtTime(0.0001, st + duration);
    src.connect(filter);
    filter.connect(g);
    g.connect(master);
    src.start(st);
    src.stop(st + duration + 0.03);
  }

  function playButtonTap(){
    playWhenReady((ctx, master, t)=>{
      osc(ctx, master, t, {freq:620, endFreq:760, duration:0.055, type:"triangle", volume:0.09});
      osc(ctx, master, t, {freq:1240, duration:0.035, type:"sine", volume:0.045});
    });
  }

  function playHover(){
    playWhenReady((ctx, master, t)=>{
      osc(ctx, master, t, {freq:880, endFreq:980, duration:0.035, type:"sine", volume:0.035});
    });
  }

  function playSelect(){
    playWhenReady((ctx, master, t)=>{
      osc(ctx, master, t, {freq:420, endFreq:640, duration:0.085, type:"triangle", volume:0.13});
      osc(ctx, master, t, {freq:840, duration:0.055, type:"sine", volume:0.06, start:0.025});
    });
  }

  function playTrash(){
    playWhenReady((ctx, master, t)=>{
      noise(ctx, master, t, {duration:0.09, volume:0.11, filterFreq:520});
      osc(ctx, master, t, {freq:160, endFreq:95, duration:0.14, type:"sawtooth", volume:0.16});
    });
  }

  function playNegativeDong(){
    playWhenReady((ctx, master, t)=>{
      osc(ctx, master, t, {freq:220, endFreq:92, duration:0.34, type:"sine", volume:0.22});
      osc(ctx, master, t, {freq:82, endFreq:58, duration:0.20, type:"square", volume:0.06, start:0.02});
      noise(ctx, master, t, {start:0.015, duration:0.06, volume:0.045, filterFreq:380});
    });
  }

  function playWrong(){
    playWhenReady((ctx, master, t)=>{
      osc(ctx, master, t, {freq:330, endFreq:260, duration:0.16, type:"triangle", volume:0.19});
      osc(ctx, master, t, {freq:247, endFreq:196, duration:0.22, type:"triangle", volume:0.18, start:0.13});
      osc(ctx, master, t, {freq:185, endFreq:130, duration:0.30, type:"sine", volume:0.17, start:0.30});
    });
  }

  function playTimeUp(){
    playWhenReady((ctx, master, t)=>{
      osc(ctx, master, t, {freq:330, endFreq:260, duration:0.16, type:"triangle", volume:0.19});
      osc(ctx, master, t, {freq:247, endFreq:196, duration:0.22, type:"triangle", volume:0.18, start:0.13});
      osc(ctx, master, t, {freq:185, endFreq:130, duration:0.30, type:"sine", volume:0.17, start:0.30});
      noise(ctx, master, t, {start:0.04, duration:0.12, volume:0.055, filterFreq:300});
    });
  }

  function playTimerTick(){
    playWhenReady((ctx, master, t)=>{
      osc(ctx, master, t, {freq:1200, duration:0.035, type:"square", volume:0.08});
      osc(ctx, master, t, {freq:600, duration:0.035, type:"triangle", volume:0.045});
    });
  }

  // IMPORTANT: This is the upward harp sound Tim wanted preserved.
  // It is used for correct fraction placement and successful Frac Trash.
  function playHarp(){
    playWhenReady((ctx, master, t)=>{
      const notes=[523,659,784,880,1047,1319];
      notes.forEach((freq,i)=>{
        osc(ctx, master, t, {freq, duration:0.36, type:"sine", volume:0.14, start:i*0.065, attack:0.018});
      });
    });
  }

  function playSquishyPlacement(){
    playWhenReady((ctx, master, t)=>{
      osc(ctx, master, t, {freq:170, endFreq:245, duration:0.10, type:"sine", volume:0.10});
      osc(ctx, master, t, {freq:245, endFreq:190, duration:0.13, type:"triangle", volume:0.08, start:0.06});
      noise(ctx, master, t, {start:0.015, duration:0.045, volume:0.035, filterFreq:950});
    });
  }

  function playPower(){
    playWhenReady((ctx, master, t)=>{
      osc(ctx, master, t, {freq:392, endFreq:784, duration:0.12, type:"sawtooth", volume:0.13});
      osc(ctx, master, t, {freq:784, endFreq:1175, duration:0.16, type:"triangle", volume:0.12, start:0.10});
      noise(ctx, master, t, {start:0.02, duration:0.09, volume:0.045, filterFreq:1600, type:"highpass"});
    });
  }

  function playBrand(){
    playWhenReady((ctx, master, t)=>{
      osc(ctx, master, t, {freq:392, duration:0.10, type:"triangle", volume:0.12});
      osc(ctx, master, t, {freq:523, duration:0.10, type:"triangle", volume:0.12, start:0.09});
      osc(ctx, master, t, {freq:659, duration:0.13, type:"triangle", volume:0.12, start:0.18});
      osc(ctx, master, t, {freq:1047, duration:0.18, type:"sine", volume:0.10, start:0.30});
    });
  }

  function playTerritoryVictory(){
    playWhenReady((ctx, master, t)=>{
      const notes=[523,659,784,1047,1319];
      notes.forEach((freq,i)=>osc(ctx, master, t, {freq, duration:0.10+(i===4?0.12:0), type:i%2?"triangle":"square", volume:0.13, start:i*0.075}));
      noise(ctx, master, t, {start:0.10, duration:0.12, volume:0.055, filterFreq:2200, type:"highpass"});
    });
  }

  function playVictory(){
    playWhenReady((ctx, master, t)=>{
      const seq=[523,659,784,1047,784,1047,1319];
      seq.forEach((freq,i)=>osc(ctx, master, t, {freq, duration:i===seq.length-1?0.28:0.105, type:"triangle", volume:0.14, start:i*0.085}));
      noise(ctx, master, t, {start:0.10, duration:0.16, volume:0.065, filterFreq:2400, type:"highpass"});
    });
  }

  function playComputerWin(){
    playWhenReady((ctx, master, t)=>{
      const seq=[392,330,294,247,196];
      seq.forEach((freq,i)=>osc(ctx, master, t, {freq, duration:i===seq.length-1?0.34:0.18, type:"sine", volume:0.15, start:i*0.16}));
      osc(ctx, master, t, {freq:98, endFreq:82, duration:0.50, type:"triangle", volume:0.07, start:0.35});
    });
  }

  function playBadTrash(){
    playTrash();
    setTimeout(()=>playNegativeDong(),70);
  }

  return {
    muted,
    unlockAudio,
    toggleMute:()=>{unlockAudio(); setMuted(m=>!m);},
    playMove:playSelect,
    playTrash,
    playButtonTap,
    playSelect,
    playBuzz:playNegativeDong,
    playWrong,
    playTimeUp,
    playTimerTick,
    playHarp,
    playSquishyPlacement,
    playBrand,
    playTerritoryVictory,
    playBadTrash,
    playPower,
    playVictory,
    playComputerWin
  };
}

function useViewportSize() {
  const [size,setSize]=useState({width:window.innerWidth||1200,height:window.innerHeight||800});
  useEffect(()=>{function update(){setSize({width:window.innerWidth||1200,height:window.innerHeight||800});}update();window.addEventListener("resize",update);window.addEventListener("orientationchange",update);return()=>{window.removeEventListener("resize",update);window.removeEventListener("orientationchange",update);};},[]);
  return size;
}

/* ─── Timer Toggle pill switch ───────────────────────────────────────────── */
function TimerToggle({enabled, onToggle, isMobile}) {
  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:isMobile?6:5}}>
      <span style={{fontSize:isMobile?12:13,fontWeight:700,color:"rgba(255,255,255,.9)",textTransform:"uppercase",letterSpacing:.5}}>
        Turn Timer
      </span>
      {/* Animated pill toggle */}
      <div onClick={onToggle} style={{position:"relative",width:44,height:24,borderRadius:12,background:enabled?"#4ade80":"rgba(255,255,255,.25)",border:"2px solid rgba(255,255,255,.55)",cursor:"pointer",transition:"background .2s",flexShrink:0}}>
        <div style={{position:"absolute",top:2,left:enabled?20:2,width:16,height:16,borderRadius:"50%",background:"white",boxShadow:"0 1px 4px rgba(0,0,0,.4)",transition:"left .2s"}}/>
      </div>
    </div>
  );
}

function IntroScreen({timerLimit,onTimerChange,timerEnabled,onTimerToggle,level,onLevelChange,gameMode,onGameModeChange,onStart,isMobile}){
  const isCpu = gameMode === "cpu";
  return(<div style={{position:"fixed",inset:0,zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:isMobile?"8px":"14px",fontFamily:"Arial, Helvetica, sans-serif",color:"white",background:"radial-gradient(circle at 50% 20%, rgba(255,255,255,.14), transparent 22%), radial-gradient(circle at 20% 55%, rgba(255,135,0,.32), transparent 28%), radial-gradient(circle at 80% 55%, rgba(64,201,31,.28), transparent 28%), linear-gradient(180deg,#020b1f,#06245d 52%,#020916)"}}>
    {/* Outer card — never wider than screen, scrollable if needed */}
    <div style={{width:"min(540px,calc(100vw - 16px))",maxHeight:"calc(100vh - 16px)",overflowY:"auto",overflowX:"hidden",border:"7px solid white",borderRadius:22,padding:isMobile?"12px 12px 16px":"14px 22px 16px",textAlign:"center",background:"rgba(0,0,0,.48)",boxShadow:"0 24px 70px rgba(0,0,0,.65)",boxSizing:"border-box"}}>

      {/* Logo */}
      <img src={IMG_LOGO} alt="Frac Jack" style={{maxWidth:"min(360px,82%)",maxHeight:isMobile?120:150,objectFit:"contain",filter:"drop-shadow(0 12px 18px rgba(0,0,0,.75))"}} />
      <div style={{fontSize:isMobile?11:14,fontWeight:900,margin:isMobile?"3px 0 8px":"4px 0 10px",textShadow:"0 3px 0 rgba(0,0,0,.5)"}}>Pick fractions. Claim territories. Jack the board.</div>

      {/* Row 1: Level + Game Mode (swapped — Game Mode now in right cell) */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:isMobile?7:10,marginBottom:isMobile?7:8}}>

        {/* Level picker */}
        <div style={{border:"3px solid rgba(255,255,255,.75)",borderRadius:16,padding:isMobile?"7px 8px":"8px 10px",background:"rgba(255,255,255,.10)"}}>
          <div style={{fontSize:isMobile?11:13,fontWeight:1000,textTransform:"uppercase",letterSpacing:1,marginBottom:isMobile?6:6}}>Level</div>
          <div style={{display:"flex",gap:5,justifyContent:"center"}}>
            {[1,2,3].map(lv=>(
              <button key={lv} onClick={()=>onLevelChange(lv)} style={{flex:1,height:isMobile?36:36,borderRadius:12,border:"3px solid white",fontSize:isMobile?18:16,fontWeight:1000,cursor:"pointer",color:level===lv?"#111":"white",background:level===lv?"linear-gradient(180deg,#ffe76a,#ffb21b)":"rgba(0,0,0,.28)"}}>{lv}</button>
            ))}
          </div>
        </div>

        {/* Game Mode — SWAPPED to this position */}
        <div style={{border:"3px solid rgba(255,255,255,.75)",borderRadius:16,padding:isMobile?"7px 8px":"8px 10px",background:"rgba(255,255,255,.10)"}}>
          <div style={{fontSize:isMobile?11:13,fontWeight:1000,textTransform:"uppercase",letterSpacing:1,marginBottom:isMobile?6:6}}>Game Mode</div>
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            <button onClick={()=>onGameModeChange("pvp")} style={{height:isMobile?32:32,borderRadius:10,border:"3px solid white",fontSize:isMobile?11:12,fontWeight:1000,cursor:"pointer",color:gameMode==="pvp"?"#111":"white",background:gameMode==="pvp"?"linear-gradient(180deg,#ffe76a,#ffb21b)":"rgba(0,0,0,.28)",textTransform:"uppercase"}}>2 Players</button>
            <button onClick={()=>onGameModeChange("cpu")} style={{height:isMobile?32:32,borderRadius:10,border:"3px solid white",fontSize:isMobile?11:12,fontWeight:1000,cursor:"pointer",color:gameMode==="cpu"?"#111":"white",background:gameMode==="cpu"?"linear-gradient(180deg,#ffe76a,#ffb21b)":"rgba(0,0,0,.28)",textTransform:"uppercase"}}>Vs Computer</button>
          </div>
        </div>
      </div>

      {/* Row 2: Timer — full width, SWAPPED to this position
           CPU: collapsed note · PvP: toggle + optional selector */}
      <div style={{border:"3px solid rgba(255,255,255,.75)",borderRadius:16,padding:isMobile?"7px 10px":"8px 12px",background:"rgba(255,255,255,.10)",marginBottom:isMobile?10:10}}>
        {isCpu ? (
          <div style={{fontSize:isMobile?11:12,fontWeight:700,color:"rgba(255,255,255,.55)",textTransform:"uppercase",letterSpacing:.4,textAlign:"center",padding:"2px 0"}}>
            Turn timer off in computer mode
          </div>
        ) : (
          <>
            <TimerToggle enabled={timerEnabled} onToggle={onTimerToggle} isMobile={isMobile}/>
            {timerEnabled && (
              <select value={timerLimit} onChange={e=>onTimerChange(Number(e.target.value))} style={{width:"100%",height:isMobile?36:36,borderRadius:10,border:"3px solid white",fontSize:isMobile?13:15,fontWeight:900,textAlign:"center",color:"#111",background:"white"}}>
                <option value={10}>10 sec</option><option value={20}>20 sec</option><option value={30}>30 sec</option><option value={45}>45 sec</option><option value={60}>1 min</option><option value={90}>1 min 30 sec</option><option value={120}>2 min</option>
              </select>
            )}
          </>
        )}
      </div>

      {/* Start button */}
      <button onClick={onStart} style={{border:"5px solid white",borderRadius:999,padding:isMobile?"11px 28px":"10px 38px",fontSize:isMobile?21:22,fontWeight:1000,color:"#111",cursor:"pointer",background:"linear-gradient(180deg,#fff36c,#ff9d18)",boxShadow:"0 8px 0 rgba(0,0,0,.45)",textTransform:"uppercase"}}>Start Game</button>

      {/* Zoodlebug branding */}
      <div style={{marginTop:isMobile?8:10}}>
        <img src={IMG_ZOODLEBUG} alt="Zoodlebug" style={{maxHeight:isMobile?88:88,maxWidth:"min(280px,62%)",objectFit:"contain",filter:"drop-shadow(0 4px 10px rgba(0,0,0,.6))"}}/>
      </div>
    </div>
  </div>);
}

const IMG_LOGO="https://media.base44.com/images/public/69fa82e0877a38539df3196d/fb1a14b1b_frac-jack-logo.png";
const IMG_JACKAL="https://media.base44.com/images/public/69fa82e0877a38539df3196d/b4c6884ac_jackal-orange.png";
const IMG_JACKRABBIT="https://media.base44.com/images/public/69fa82e0877a38539df3196d/52f7ec8e4_jackrabbit-green.png";
const IMG_TRASH="https://media.base44.com/images/public/69fa82e0877a38539df3196d/ca01e9af6_frac-trash.png";
const IMG_ZOODLEBUG="zoodlebug-game.png";
const SOUND_BRAND="ZoodleBugBrandSound.wav";
const SOUND_TERRITORY_VICTORY="FracJackTerritoryVictory.wav";
const SOUND_BAD_TRASH="FracJackBadTrash.wav";

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){let t=b;b=a%b;a=t;}return a||1;}
function simplify(n,d){const g=gcd(n,d);return{n:n/g,d:d/g};}
function fractionKey(f){return f.n+"/"+f.d;}
function shuffle(a){const c=a.slice();for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}
function choose(a){return a[Math.floor(Math.random()*a.length)];}
function denomWord(d){const w={2:"halves",3:"thirds",4:"fourths",5:"fifths",6:"sixths",7:"sevenths",8:"eighths",9:"ninths",10:"tenths",11:"elevenths",12:"twelfths",15:"fifteenths",20:"twentieths"};return w[d]||d+"ths";}

const SLOTS=["t1","t2","t3","t4","t5"];
const MODELS=["Bar Model","Set Model","Number Line","Area Model","Circle Model"];
const SHAPES=["●","★","▲","■","◆","♥","⬟","⬢","⬤","◆","▲","★","●","■","♥","⬟","⬢","◆","★","●"];

function normalizeLevel(level){const lv=Number(level);return lv===1||lv===2||lv===3?lv:1;}
function levelDenominators(level){const lv=normalizeLevel(level);if(lv===1)return[2,3,4,5,6];if(lv===2)return[3,4,5,6,8,10,12];return[4,5,6,8,10,12];}

function buildFractionPool(level){const lv=normalizeLevel(level);const dens=levelDenominators(lv);const pool=[];const seen={};dens.forEach(d=>{let maxN=d-1;if(lv===3)maxN=Math.floor(d*1.5);for(let n=1;n<=maxN;n++){const s=simplify(n,d);if(lv===1&&s.d>6)continue;const key=s.n+"/"+s.d;if(!seen[key]){if(lv===3&&s.d===1)continue;seen[key]=true;pool.push({n:s.n,d:s.d});}}});return shuffle(pool);}
function displayFraction(f){if(f.d===1)return String(f.n);if(f.n>f.d&&Math.random()<0.5){const w=Math.floor(f.n/f.d);const r=f.n%f.d;if(r===0)return String(w);return w+" "+r+"/"+f.d;}return f.n+"/"+f.d;}
function fractionFits(frac,t){return(frac.n*t.denominator)%frac.d===0;}
function fractionUnits(frac,t){return(frac.n*t.denominator)/frac.d;}
function isLegalMove(frac,t){if(!t||t.owner)return false;if(!fractionFits(frac,t))return false;const units=fractionUnits(frac,t);const remaining=t.denominator*t.wholes-t.filledUnits;return units<=remaining;}

function createTerritories(level){
  const lv=normalizeLevel(level);const dens=levelDenominators(lv);
  const models=["Set Model","Number Line","Area Model","Circle Model","Bar Model"];
  let territoryDenominators;
  if(lv===1){territoryDenominators=shuffle([2,3,4,5,6]);}
  else{territoryDenominators=[];const shuffled=shuffle(dens);for(let i=0;i<5;i++)territoryDenominators.push(shuffled[i%shuffled.length]);territoryDenominators=shuffle(territoryDenominators);}
  const list=[];
  for(let i=0;i<5;i++){
    let den=territoryDenominators[i];
    let wholes;
    if(lv===1){
      wholes=1;
    }else if(i===0){
      wholes=1+Math.floor(Math.random()*2);
    }else if(i===1){
      wholes=lv===2?1+Math.floor(Math.random()*2):1+Math.floor(Math.random()*3);
      const maxNLDen=wholes===1?8:wholes===2?6:4;
      const nlDens=dens.filter(d=>d<=maxNLDen);
      den=nlDens.includes(den)?den:choose(nlDens.length?nlDens:[2,3,4]);
    }else{
      wholes=lv===2?1+Math.floor(Math.random()*2):2+Math.floor(Math.random()*2);
    }
    wholes=Math.min(3,wholes);
    if(models[i]==="Area Model"&&den>8){
      const areaDens=dens.filter(d=>d<=8);
      den=choose(areaDens.length?areaDens:[2,3,4,5,6,8]);
    }
    list.push({id:i,slot:SLOTS[i],name:"T"+(i+1),model:models[i],denominator:den,wholes,filledUnits:0,owner:null,chunks:[],hijacked:false});
  }
  return list;
}

function makeChoice(f){const chosen={n:f.n,d:f.d};chosen.display=displayFraction(chosen);return chosen;}
function handHasLegalMove(hand,territories){return!!(territories&&territories.length&&hand&&hand.some(f=>f&&territories.some(t=>isLegalMove(f,t))));}
function boardHasAnyLegalMove(level,territories){if(!territories||!territories.length)return false;const pool=buildFractionPool(level);return pool.some(f=>territories.some(t=>isLegalMove(f,t)));}
function pickFromPool({level,usedKeys={},discardedKeys={},territories=null,mustBeLegal=false,respectDiscarded=true}){const pool=shuffle(buildFractionPool(level));for(const f of pool){const key=fractionKey(f);if(usedKeys[key])continue;if(respectDiscarded&&discardedKeys[key])continue;if(mustBeLegal&&!(territories&&territories.some(t=>isLegalMove(f,t))))continue;usedKeys[key]=true;return makeChoice(f);}return null;}
function createFractionFromPool(level,usedKeys={},discardedKeys={}){return pickFromPool({level,usedKeys,discardedKeys,respectDiscarded:true})||pickFromPool({level,usedKeys,discardedKeys,respectDiscarded:false})||null;}
function createSmartLegalFraction(level,usedKeys={},discardedKeys={},territories=[]){return pickFromPool({level,usedKeys,discardedKeys,territories,mustBeLegal:true,respectDiscarded:true})||pickFromPool({level,usedKeys,discardedKeys,territories,mustBeLegal:true,respectDiscarded:false})||createFractionFromPool(level,usedKeys,discardedKeys);}
function cleanFractionHand(level,hand,discardedKeys={},territories=[]){const usedKeys={};const cleaned=[];for(const f of hand||[]){if(!f)continue;const key=fractionKey(f);if(usedKeys[key])continue;usedKeys[key]=true;cleaned.push({...f,display:f.display||displayFraction(f)});if(cleaned.length>=3)break;}if(boardHasAnyLegalMove(level,territories)&&!handHasLegalMove(cleaned,territories)){const replaceIndex=cleaned.length>=3?2:cleaned.length;const usedExceptReplace={};cleaned.forEach((f,i)=>{if(i!==replaceIndex)usedExceptReplace[fractionKey(f)]=true;});const legalChoice=createSmartLegalFraction(level,usedExceptReplace,discardedKeys,territories);if(legalChoice)cleaned[replaceIndex]=legalChoice;}while(cleaned.length<3){const next=createFractionFromPool(level,usedKeys,discardedKeys);if(!next)break;cleaned.push(next);}const finalUsed={};const finalHand=[];for(const f of cleaned){if(!f)continue;const key=fractionKey(f);if(finalUsed[key])continue;finalUsed[key]=true;finalHand.push({...f,display:f.display||displayFraction(f)});}while(finalHand.length<3){const next=pickFromPool({level,usedKeys:finalUsed,discardedKeys,respectDiscarded:false});if(!next)break;finalHand.push(next);}return finalHand.slice(0,3);}
function rollFractions(level,discardedKeys,territories){const usedKeys={};const result=[];if(boardHasAnyLegalMove(level,territories)){const legal=createSmartLegalFraction(level,usedKeys,discardedKeys,territories);if(legal)result.push(legal);}while(result.length<3){const next=createFractionFromPool(level,usedKeys,discardedKeys);if(!next)break;result.push(next);}return shuffle(cleanFractionHand(level,result,discardedKeys,territories));}

function cellsFromChunks(t){const total=t.denominator*t.wholes;const cells=new Array(total).fill("");let filledAmount=0;t.chunks.forEach(c=>{let u=c.units;while(u>0&&filledAmount<total){const idx=Math.floor(filledAmount);if(idx<total)cells[idx]=c.color;filledAmount+=1;u-=1;}});return cells;}

// ── NEW SCORING HELPER ──────────────────────────────────────────────────────
// Returns points (0-100) based on how full the last touched whole is after
// a placement. If the filled amount lands exactly on a whole boundary the
// last whole is 100% full → 100 pts. The +50 jack bonus is added separately
// in doPlace() when the territory is claimed.
function calcPlacementPoints(newFilledUnits, denominator) {
  const unitsInLastWhole = newFilledUnits % denominator;
  // 0 remainder means we landed exactly on a whole boundary → last whole = full
  const effectiveUnits = unitsInLastWhole === 0 ? denominator : unitsInLastWhole;
  return Math.round((effectiveUnits / denominator) * 100);
}

function BarModel({t,compactPortrait=false}){
  const cells=cellsFromChunks(t);
  const gap=compactPortrait?2:4;
  const pad=compactPortrait?"3px 5px":"5px 6px";
  const labelW=compactPortrait?12:14;
  const labelSize=compactPortrait?9:10;
  const border=compactPortrait?"2px solid #555":"2.5px solid #555";
  return(
    <div style={{width:"100%",height:"100%",minHeight:0,display:"flex",flexDirection:"column",justifyContent:"center",gap,padding:pad,overflow:"hidden",boxSizing:"border-box"}}>
      {Array.from({length:t.wholes}).map((_,w)=>(
        <div key={w} style={{flex:"1 1 0",minHeight:0,display:"flex",alignItems:"stretch",gap:3,overflow:"hidden"}}>
          <div style={{width:labelW,flex:`0 0 ${labelW}px`,fontSize:labelSize,fontWeight:1000,textAlign:"center",color:"#444",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>{w+1}</div>
          <div style={{flex:1,minHeight:0,height:"100%",border,borderRadius:3,display:"grid",gridTemplateColumns:`repeat(${t.denominator},1fr)`,background:"white",overflow:"hidden"}}>
            {Array.from({length:t.denominator}).map((_,i)=>{const color=cells[w*t.denominator+i];return<div key={i} style={{borderRight:i<t.denominator-1?"1px solid #aaa":"none",background:color==="red"?"#e83434":color==="blue"?"#1878ff":"white"}}/>;})}
          </div>
        </div>
      ))}
    </div>
  );
}

function AreaModel({t,isDesktop,compactPortrait=false}){
  const cells=cellsFromChunks(t);
  const d=Math.min(t.denominator,8);
  let cols,rows;
  const gridMap={2:[2,1],3:[3,1],4:[2,2],5:[5,1],6:[3,2],8:[4,2]};
  if(gridMap[d]){[cols,rows]=gridMap[d];}
  else{cols=Math.ceil(Math.sqrt(d));rows=Math.ceil(d/cols);}
  return(
    <div style={{width:"100%",height:"100%",minHeight:0,display:"grid",gridTemplateColumns:`repeat(${t.wholes}, minmax(0, 1fr))`,gridTemplateRows:"minmax(0,1fr)",alignItems:"center",justifyItems:"center",gap:compactPortrait?3:5,padding:compactPortrait?"3px 5px":"5px 6px",boxSizing:"border-box",overflow:"hidden"}}>
      {Array.from({length:t.wholes}).map((_,w)=>(
        <svg key={w} viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" style={{width:"100%",height:"100%",maxWidth:"100%",maxHeight:"100%",display:"block",filter:"drop-shadow(0 1px 1px rgba(0,0,0,.14))"}}>
          <rect x="3" y="3" width="94" height="94" rx="4" ry="4" fill="white" stroke="#555" strokeWidth={compactPortrait?4:5}/>
          {Array.from({length:d}).map((_,i)=>{
            const color=cells[w*t.denominator+i];
            const fill=color==="red"?"#e83434":color==="blue"?"#1878ff":"white";
            const cellW=94/cols;
            const cellH=94/rows;
            const x=3+(i%cols)*cellW;
            const y=3+Math.floor(i/cols)*cellH;
            return <rect key={i} x={x} y={y} width={cellW} height={cellH} fill={fill} stroke="#aaa" strokeWidth="1.5"/>;
          })}
          <rect x="3" y="3" width="94" height="94" rx="4" ry="4" fill="none" stroke="#555" strokeWidth={compactPortrait?4:5}/>
        </svg>
      ))}
    </div>
  );
}

function NumberLine({t,compactPortrait=false}){const cells=cellsFromChunks(t);const total=t.denominator*t.wholes;const boxH=compactPortrait?48:72;const lineTop=compactPortrait?16:25;const labelTop=compactPortrait?33:50;const tickH=compactPortrait?18:24;const fontSize=compactPortrait?12:16;return(<div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",padding:compactPortrait?"4px 8px 8px":"10px 12px 16px"}}><div style={{width:"100%",height:boxH,maxHeight:"100%",position:"relative",background:"linear-gradient(180deg,#fffdf3,#eef5ff)",border:"2px solid rgba(17,17,17,.22)",borderRadius:compactPortrait?10:14,padding:"0 18px",overflow:"visible"}}><div style={{position:"absolute",left:18,right:18,top:lineTop,display:"grid",gridTemplateColumns:`repeat(${total},1fr)`,height:tickH,borderBottom:compactPortrait?"4px solid #111":"5px solid #111",zIndex:2}}>{Array.from({length:total}).map((_,i)=>{const color=cells[i];return<div key={i} style={{borderLeft:"2px solid #111",...(i===total-1?{borderRight:"2px solid #111"}:{}),position:"relative",height:tickH,background:color==="red"?"#e83434":color==="blue"?"#1878ff":"transparent"}}/>;})}</div>{Array.from({length:t.wholes+1}).map((_,whole)=>(<div key={whole} style={{position:"absolute",top:labelTop,transform:"translateX(-50%)",left:`calc(18px + (100% - 36px) * ${whole/t.wholes})`,color:"#111",fontSize,fontWeight:1000,zIndex:6,textShadow:"0 1px 0 white"}}>{whole}</div>))}</div></div>);}

function SetModel({t,compactPortrait=false}){
  const cells=cellsFromChunks(t);
  const cols=Math.ceil(Math.sqrt(t.denominator));
  const rows=Math.ceil(t.denominator/cols);
  const wholeCols=t.wholes<=1?1:t.wholes;
  return(
    <div style={{width:"100%",height:"100%",minHeight:0,display:"grid",gridTemplateColumns:`repeat(${wholeCols}, minmax(0,1fr))`,gridTemplateRows:"minmax(0,1fr)",alignItems:"center",justifyItems:"center",gap:compactPortrait?2:4,overflow:"hidden",padding:compactPortrait?2:3,boxSizing:"border-box"}}>
      {Array.from({length:t.wholes}).map((_,w)=>(
        <div key={w} style={{width:"100%",height:"100%",minHeight:0,overflow:"hidden",display:"grid",gridTemplateColumns:`repeat(${cols},1fr)`,gridTemplateRows:`repeat(${rows},1fr)`,gap:2,padding:compactPortrait?2:4,border:"2px solid #aaa",borderRadius:8,background:"#fff8ef",boxSizing:"border-box"}}>
          {Array.from({length:t.denominator}).map((_,i)=>{const color=cells[w*t.denominator+i];const textColor=color==="red"?"#e83434":color==="blue"?"#1878ff":"white";return(<div key={i} style={{display:"flex",alignItems:"center",justifyContent:"center",minWidth:0,minHeight:0,overflow:"hidden"}}><span style={{fontSize:compactPortrait?"clamp(10px,4.8vw,22px)":"clamp(12px,2.4vw,28px)",lineHeight:1,color:textColor,WebkitTextStroke:compactPortrait?"1.1px #111":"1.5px #111",textShadow:"0 2px 0 rgba(0,0,0,.35)"}}>{SHAPES[i%SHAPES.length]}</span></div>);})}
        </div>
      ))}
    </div>
  );
}

function polarToCartesian(cx,cy,r,a){const rad=(a-90)*Math.PI/180;return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)};}
function describePieSlice(cx,cy,r,s,e){const start=polarToCartesian(cx,cy,r,e);const end=polarToCartesian(cx,cy,r,s);return["M",cx,cy,"L",start.x,start.y,"A",r,r,0,e-s<=180?"0":"1",0,end.x,end.y,"Z"].join(" ");}

function CircleModel({t,compactPortrait=false}){
  const cells=cellsFromChunks(t);
  const cols=t.wholes;
  const rows=1;
  const size=62;
  const cx=size/2;
  const cy=size/2;
  const radius=27;
  return(
    <div style={{width:"100%",height:"100%",minHeight:0,display:"grid",gridTemplateColumns:`repeat(${cols},minmax(0,1fr))`,gridTemplateRows:`repeat(${rows},minmax(0,1fr))`,gap:compactPortrait?2:4,padding:compactPortrait?3:5,overflow:"hidden",alignItems:"center",justifyItems:"center",boxSizing:"border-box"}}>
      {Array.from({length:t.wholes}).map((_,w)=>(
        <svg key={w} viewBox={`0 0 ${size} ${size}`} preserveAspectRatio="xMidYMid meet" style={{width:"100%",height:"100%",maxWidth:"100%",maxHeight:"100%",display:"block",filter:"drop-shadow(0 1px 1px rgba(0,0,0,.18))"}}>
          <circle cx={cx} cy={cy} r={radius} fill="#fff" stroke="#555" strokeWidth="3"/>
          {Array.from({length:t.denominator}).map((_,i)=>{const color=cells[w*t.denominator+i];const fill=color==="red"?"#e83434":color==="blue"?"#1878ff":"#fff";return<path key={`s${i}`} d={describePieSlice(cx,cy,radius,i*360/t.denominator,(i+1)*360/t.denominator)} fill={fill} stroke="#111" strokeWidth="1.4" strokeLinejoin="round"/>;})}
          <circle cx={cx} cy={cy} r={radius} fill="none" stroke="#555" strokeWidth="3"/>
          <circle cx={cx} cy={cy} r="3.8" fill="#111"/>
        </svg>
      ))}
    </div>
  );
}

function TerritoryModel({t,isDesktop,compactPortrait=false}){if(t.model==="Bar Model")return<BarModel t={t} compactPortrait={compactPortrait}/>;if(t.model==="Set Model")return<SetModel t={t} compactPortrait={compactPortrait}/>;if(t.model==="Number Line")return<NumberLine t={t} compactPortrait={compactPortrait}/>;if(t.model==="Area Model")return<AreaModel t={t} isDesktop={isDesktop} compactPortrait={compactPortrait}/>;return<CircleModel t={t} compactPortrait={compactPortrait}/>;}
function shortModelName(m){if(m==="Bar Model")return"Bar";if(m==="Set Model")return"Set";if(m==="Number Line")return"Line";if(m==="Area Model")return"Area";return"Circle";}

/* ─── Percent helpers ───────────────────────────────────────────────────── */
// Convert a numerator/denominator to percent info.
// filledUnits = total units filled; denominator = units per whole.
// Percent = (filledUnits / denominator) * 100 — i.e. percent of ONE whole.
function fracToPercent(filledUnits,denominator){
  // Exact if filledUnits * 100 is divisible by denominator (no repeating decimal)
  const isExact=(filledUnits*100)%denominator===0;
  const pct=Math.round((filledUnits/denominator)*100);
  return{pct,isExact};
}

// Build a display string for the filled amount as a mixed number.
// e.g. filledUnits=9, denominator=5 → "1 4/5"
function fracDisplayStr(filledUnits,denominator){
  if(filledUnits===0)return"0";
  const w=Math.floor(filledUnits/denominator);
  const r=filledUnits%denominator;
  if(r===0)return String(w);
  if(w===0)return`${r}/${denominator}`;
  return`${w} ${r}/${denominator}`;
}

/* ─── PlacementPopup ────────────────────────────────────────────────────── */
// Shown after every successful fraction placement.
// data = { filledUnits, denominator, wholes, pts, color, isJack }
// Shows the ENTIRE territory (all wholes), with cumulative filled units shaded.
// Percent = filledUnits / denominator * 100 (% of one whole).
// Points = that percent value; +50 bonus on jack.
function PlacementPopup({data,onContinue}){
  if(!data)return null;
  const{filledUnits,denominator,wholes,pts,color,isJack}=data;

  const{pct,isExact}=fracToPercent(filledUnits,denominator);
  const fracStr=fracDisplayStr(filledUnits,denominator);
  const percentSentence=isExact
    ?`${fracStr} is ${pct}%`
    :`${fracStr} is about ${pct}%`;

  const accent=color==="orange"?"#e07000":"#1a9e1a";
  const bgGrad=color==="orange"
    ?"linear-gradient(160deg,#fff8e8 0%,#ffe9b0 100%)"
    :"linear-gradient(160deg,#e8fff0 0%,#b0ffc8 100%)";
  const mascotSrc=color==="orange"?IMG_JACKAL:IMG_JACKRABBIT;
  const msgs=isJack
    ?["JACKED IT!","TERRITORY JACKED!","FULLY JACKED!"]
    :["Nice Move!","Great Move!","Fraction Placed!","Well Done!"];
  const msg=msgs[Math.floor(Math.random()*msgs.length)];

  return(
    <div style={{position:"fixed",inset:0,zIndex:90,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,.74)",pointerEvents:"all"}}>
      <div style={{width:"min(400px,88vw)",borderRadius:26,background:bgGrad,border:`5px solid ${accent}`,boxShadow:`0 0 0 3px rgba(0,0,0,.16),0 30px 64px rgba(0,0,0,.65)`,overflow:"hidden",display:"flex",flexDirection:"column",alignItems:"center"}}>

        {/* Top accent stripe */}
        <div style={{width:"100%",height:8,background:accent}}/>

        {/* Character head — cropped circle */}
        <div style={{width:84,height:84,borderRadius:"50%",border:`4px solid ${accent}`,boxShadow:`0 4px 12px rgba(0,0,0,.3)`,overflow:"hidden",marginTop:14,background:"rgba(255,255,255,.4)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <img src={mascotSrc} alt="" style={{width:108,height:108,objectFit:"contain",objectPosition:"top center",transform:"scale(1.12) translateY(10px)"}}/>
        </div>

        {/* Success message */}
        <div style={{fontSize:20,fontWeight:1000,color:accent,marginTop:9,letterSpacing:.4}}>{msg}</div>

        {/* Territory bar model — one bar per whole, cumulative fill shaded */}
        <div style={{width:"calc(100% - 36px)",margin:"12px 0 2px",display:"flex",flexDirection:"column",gap:4}}>
          {Array.from({length:wholes}).map((_,barIdx)=>{
            // How many cells are filled in this bar?
            const barStart=barIdx*denominator;
            const filledInThisBar=Math.min(denominator,Math.max(0,filledUnits-barStart));
            return(
              <div key={barIdx} style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{width:16,fontSize:10,fontWeight:1000,color:"#666",textAlign:"right",flexShrink:0}}>{barIdx+1}</div>
                <div style={{flex:1,height:26,border:`2.5px solid ${accent}`,borderRadius:5,overflow:"hidden",background:"white",display:"grid",gridTemplateColumns:`repeat(${denominator},1fr)`}}>
                  {Array.from({length:denominator}).map((_,ci)=>(
                    <div key={ci} style={{borderRight:ci<denominator-1?"1.5px solid rgba(0,0,0,.15)":"none",background:ci<filledInThisBar?accent:"white"}}/>
                  ))}
                </div>
              </div>
            );
          })}
        </div>

        {/* Fraction = percent sentence */}
        <div style={{fontSize:17,fontWeight:900,color:"#111",margin:"10px 0 2px",textAlign:"center",padding:"0 14px",lineHeight:1.3}}>{percentSentence}</div>

        {/* Points earned */}
        <div style={{fontSize:30,fontWeight:1000,color:accent,marginBottom:isJack?0:2}}>{`+${pts} points`}</div>
        {isJack&&(
          <div style={{fontSize:12,fontWeight:700,color:accent,opacity:.75,marginBottom:2}}>includes +50 jack bonus!</div>
        )}

        {/* Continue */}
        <button onPointerDown={e=>e.stopPropagation()} onClick={onContinue} style={{margin:"8px 0 18px",border:`3px solid ${accent}`,borderRadius:999,padding:"9px 34px",fontSize:15,fontWeight:1000,color:"white",cursor:"pointer",background:accent,boxShadow:`0 5px 0 rgba(0,0,0,.22)`,textTransform:"uppercase",letterSpacing:.5}}>Continue</button>
      </div>
    </div>
  );
}

  // ── doPlace: places a fraction, shows PlacementPopup, then switches turn ──
  function doPlace(t,frac,units,fracIdxOverride=null){
    const chosenIdx=fracIdxOverride??selectedFracIdx;
    lockedRef.current=true;setGameLocked(true);

    const color=t.chunks.length%2===0?"red":"blue";
    const max=t.denominator*t.wholes;
    const clampedUnits=Math.min(units,max-t.filledUnits);
    const roundedUnits=Math.round(clampedUnits*1000)/1000;
    const newFilledUnits=t.filledUnits+clampedUnits;
    const updatedT={...t,chunks:[...t.chunks,{units:roundedUnits,color}],filledUnits:newFilledUnits};

    const newFracs=(()=>{
      const usedKeys={};
      fractions.forEach((f,i)=>{if(i!==chosenIdx)usedKeys[fractionKey(f)]=true;});
      const newF=createFractionFromPool(activeLevel(),usedKeys,discardedKeys);
      const arr=fractions.slice();arr[chosenIdx]=newF;
      return cleanFractionHand(activeLevel(),arr,discardedKeys,territories);
    })();
    const newTerrs=territories.map(tt=>tt.id===t.id?updatedT:tt);

    const isJack=newFilledUnits>=max;

    // Points = percent of ONE whole filled across the ENTIRE territory.
    // e.g. 8 units in a /5 territory = 8/5 = 160%.  Jack: wholes*100 + 50 bonus.
    const pctOfOneWhole=Math.round((newFilledUnits/t.denominator)*100);
    const totalPts=isJack?(t.wholes*100)+50:pctOfOneWhole;

    if(isJack) playTerritoryVictory(); else { playSquishyPlacement(); playHarp(); }

    // Update board immediately so it shows behind the popup
    setTerritories(newTerrs);
    setFractions(newFracs);
    setSelectedFracIdx(null);

    // Pass full territory fill data so popup shows the complete model + correct percent
    setPlacementPow({
      filledUnits: newFilledUnits,  // total units shaded across all bars
      denominator: t.denominator,   // cells per bar (= cells per whole)
      wholes: t.wholes,             // number of bars to draw
      pts: totalPts,
      color: currentPlayer,
      isJack
    });

    placementPow_callback.current = () => {
      if(isJack){
        const ownedT={...updatedT,owner:currentPlayer};
        const finalTerrs=newTerrs.map(tt=>tt.id===t.id?ownedT:tt);
        setTerritories(finalTerrs);
        setPlayers(prev=>{
          const np={...prev,[currentPlayer]:{...prev[currentPlayer],points:prev[currentPlayer].points+totalPts}};
          if(checkGameOver(finalTerrs,np))return np;
          doSwitchTurn(currentPlayer==="orange"?"green":"orange",newFracs,undefined,finalTerrs);
          return np;
        });
      } else {
        setPlayers(prev=>({...prev,[currentPlayer]:{...prev[currentPlayer],points:prev[currentPlayer].points+totalPts}}));
        doSwitchTurn(currentPlayer==="orange"?"green":"orange",newFracs,undefined,newTerrs);
      }
    };
  }

  // ── doHijack: opponent earns 50 flat, placer earns 0 ─────────────────────
  function doHijack(t,frac,remaining){
    lockedRef.current=true;setGameLocked(true);
    const opp=currentPlayer==="orange"?"green":"orange";
    const hijackPts=50;

    const newFracs=(()=>{
      const usedKeys={};
      fractions.forEach((f,i)=>{if(i!==selectedFracIdx)usedKeys[fractionKey(f)]=true;});
      const newF=createFractionFromPool(activeLevel(),usedKeys,discardedKeys);
      const arr=fractions.slice();arr[selectedFracIdx]=newF;
      return cleanFractionHand(activeLevel(),arr,discardedKeys,territories);
    })();

    playBadTrash();
    setTimeout(()=>playBuzz(),180);

    showPow("HIJACKED!",players[opp].name+" +"+hijackPts,"red",()=>{
      setLessonOverlay({t,remaining,callback:()=>{
        const ownedT={...t,owner:opp,hijacked:true};
        const finalTerrs=territories.map(tt=>tt.id===t.id?ownedT:tt);
        setTerritories(finalTerrs);
        setFractions(newFracs);
        setSelectedFracIdx(null);
        setPlayers(prev=>{
          const np={...prev,[opp]:{...prev[opp],points:prev[opp].points+hijackPts}};
          if(checkGameOver(finalTerrs,np))return np;
          doSwitchTurn(opp,newFracs,undefined,finalTerrs);
          return np;
        });
      }});
      setLessonReady(false);
      setTimeout(()=>setLessonReady(true),3000);
    });
  }

  function doJackback(t){if(t.owner)return;setPendingTrick(null);lockedRef.current=true;setGameLocked(true);showPow("JACKBACK","One whole cleared",currentPlayer,()=>{const amount=t.denominator;let left=Math.min(amount,t.filledUnits);const newChunks=t.chunks.slice();let filled=t.filledUnits;while(left>0&&newChunks.length>0){const last=newChunks[newChunks.length-1];if(last.units<=left){left-=last.units;filled-=last.units;newChunks.pop();}else{newChunks[newChunks.length-1]={...last,units:last.units-left};filled-=left;left=0;}}if(filled<0)filled=0;const newTerrs=territories.map(tt=>tt.id===t.id?{...tt,chunks:newChunks,filledUnits:filled}:tt);setTerritories(newTerrs);doSwitchTurn(currentPlayer==="orange"?"green":"orange",undefined,undefined,newTerrs);});}
  function handleTrashLimitReached(){lockedRef.current=true;setGameLocked(true);stopTimer();playBuzz();showPow("TRASH LIMIT!","Max 3 trash trips per turn. Play a fraction now.","red",()=>{lockedRef.current=false;setGameLocked(false);resumeTimer(()=>{lockedRef.current=true;setGameLocked(true);showPow("TIME'S UP!","Turn lost!","red",()=>doSwitchTurn(currentPlayer==="orange"?"green":"orange"));});});}
  function handleTrashClick(){unlockAudio();if(gameLocked||pendingTrick||!gameStarted||victoryReached||boardInputBlocked())return;setHints({fractionIdx:null,territoryId:null});const frac=fractions[selectedFracIdx];if(!frac){playBuzz();return;}if(trashTripsThisTurn>=3){handleTrashLimitReached();return;}setTrashTripsThisTurn(prev=>prev+1);const hasMove=territories.some(t=>isLegalMove(frac,t));if(hasMove)badTrash();else goodTrash();}
  function goodTrash(){const trashed=fractions[selectedFracIdx];if(!trashed)return;lockedRef.current=true;setGameLocked(true);stopTimer();const scoringPlayer=currentPlayer;const newDisc={...discardedKeys,[fractionKey(trashed)]:true};setDiscardedKeys(newDisc);playTrash();playHarp();burpTrash();const usedKeys={};fractions.forEach((f,i)=>{if(i!==selectedFracIdx)usedKeys[fractionKey(f)]=true;});const newFrac=createSmartLegalFraction(activeLevel(),usedKeys,newDisc,territories);const newFracs=cleanFractionHand(activeLevel(),(()=>{const arr=fractions.slice();arr[selectedFracIdx]=newFrac;return arr;})(),newDisc,territories);setFractions(newFracs);setSelectedFracIdx(null);const trashPts=activeLevel()===1?20:activeLevel()===2?50:100;setPlayers(prev=>({...prev,[scoringPlayer]:{...prev[scoringPlayer],points:prev[scoringPlayer].points+trashPts}}));const trashLines=["That fraction was GARBAGE anyway!","Bye bye, bad fraction! 👋","Into the void it goes!","The trash can is DELIGHTED.","That fraction had no friends here.","Disposed of with extreme prejudice!","Even the trash can rolled its eyes.","One fraction's trash is no one's treasure."];const trashMsg=trashLines[Math.floor(Math.random()*trashLines.length)];showPow("FRAC TRASH! +"+trashPts,trashMsg,scoringPlayer,()=>{resetTimerToThirty(()=>{lockedRef.current=true;setGameLocked(true);showPow("TIME'S UP!","Turn lost!","red",()=>{doSwitchTurn(scoringPlayer==="orange"?"green":"orange");});});unlockAfterInputGuard(350);},{imageSrc:IMG_TRASH,imageAlt:"Frac Trash",variant:"trashSuccess"});}
  function badTrash(){lockedRef.current=true;setGameLocked(true);stopTimer();playBadTrash();setTimeout(()=>playBuzz(),180);burpTrash();const penalty=activeLevel()===1?20:activeLevel()===2?50:200;setPlayers(prev=>({...prev,[currentPlayer]:{...prev[currentPlayer],points:prev[currentPlayer].points-penalty}}));const badLines=["That fraction was perfectly good! The trash can is FURIOUS.","You just tried to trash a totally legal fraction. Shameful.","The trash can spit it right back out.","Nice try. That fraction had moves and you knew it.","The trash can called your bluff.","That fraction files a formal complaint.","Even the trash can has standards. That fraction stays.","The trash can has seen things, but THIS? Bad trash move."];setTrashPenaltyMsg(badLines[Math.floor(Math.random()*badLines.length)]);setTrashPenaltyOverlay(true);setPenaltyAmount(penalty);}
  function applyTrick(player,trick){unlockAudio();if(gameLocked||victoryReached||!gameStarted)return;if(player!==currentPlayer)return;if(trickUsed[player][trick])return;playPower();setTrickUsed(prev=>({...prev,[player]:{...prev[player],[trick]:true}}));if(trick==="hint"){setHints({fractionIdx:null,territoryId:null});let found=null;outer:for(let i=0;i<fractions.length;i++){for(let j=0;j<territories.length;j++){if(isLegalMove(fractions[i],territories[j])){found={fractionIdx:i,territoryId:territories[j].id};break outer;}}}if(!found){showPow("NO LEGAL MOVES","Try a Jack Trick or wait.","red",null);return;}setSelectedFracIdx(found.fractionIdx);setHints(found);showPow("HINT!","Try this move.",currentPlayer,null);return;}if(trick==="refrac"){setHints({fractionIdx:null,territoryId:null});setFractions(rollFractions(activeLevel(),discardedKeys,territories));setSelectedFracIdx(null);showPow("RE-FRAC!","New choices",currentPlayer,null);return;}if(trick==="jackback"){setHints({fractionIdx:null,territoryId:null});setPendingTrick("jackback");showPow("JACKBACK","Pick territory",currentPlayer,null);}}

  useEffect(()=>{
    if(gameMode!=="cpu"||currentPlayer!=="green"||!gameStarted||gameLocked||victoryReached)return;
    if(pow.show||lessonOverlay||trashPenaltyOverlay||rulesOverlay||pendingTrick)return;
    const id=setTimeout(()=>computerTakeTurn(),700);
    return()=>clearTimeout(id);
  },[gameMode,currentPlayer,gameStarted,gameLocked,victoryReached,pow.show,lessonOverlay,trashPenaltyOverlay,rulesOverlay,pendingTrick,fractions,territories]);

  function computerTakeTurn(){
    if(gameMode!=="cpu"||currentPlayer!=="green"||gameLocked||victoryReached||!gameStarted)return;

    // Trash probability per trashable fraction: 25% / 75% / 100% by level
    const trashChance=activeLevel()===1?0.25:activeLevel()===2?0.75:1.0;

    // Find all fractions in hand that have no legal move (valid trash candidates)
    const trashable=fractions.map((f,idx)=>({f,idx})).filter(({f})=>f&&!territories.some(t=>isLegalMove(f,t)));

    // Roll ONCE to decide whether to trash this turn at all, then pick a candidate
    if(trashable.length>0&&trashTripsThisTurn<3&&Math.random()<trashChance){
      const pick=trashable[0];
      blockBoardInput(900);
      setTimeout(()=>{
        if(gameMode!=="cpu"||currentPlayer!=="green"||victoryRef.current||lockedRef.current)return;
        computerGoodTrash(pick.idx);
      },650);
      return;
    }

    // Otherwise find the best legal placement
    const possible=[];
    fractions.forEach((f,idx)=>{
      if(!f)return;
      territories.forEach(t=>{
        if(isLegalMove(f,t)){
          const units=fractionUnits(f,t);
          const max=t.denominator*t.wholes;
          possible.push({idx,f,t,units,claims:t.filledUnits+units>=max,remaining:max-t.filledUnits});
        }
      });
    });
    if(!possible.length){
      lockedRef.current=true;setGameLocked(true);
      showPow("COMPUTER PASSES","No legal move.","green",()=>doSwitchTurn("orange"));
      return;
    }
    possible.sort((a,b)=>Number(b.claims)-Number(a.claims)||b.units-a.units||a.remaining-b.remaining);
    const move=possible[0];
    setSelectedFracIdx(move.idx);
    setHints({fractionIdx:move.idx,territoryId:move.t.id});
    blockBoardInput(900);
    setTimeout(()=>{
      if(gameMode!=="cpu"||currentPlayer!=="green"||victoryRef.current||lockedRef.current)return;
      setHints({fractionIdx:null,territoryId:null});
      doPlace(move.t,move.f,move.units,move.idx);
    },650);
  }

  // computerGoodTrash: same as goodTrash but takes an explicit index
  // so it doesn't depend on selectedFracIdx state being committed yet
  function computerGoodTrash(idx){
    const trashed=fractions[idx];
    if(!trashed)return;
    lockedRef.current=true;setGameLocked(true);stopTimer();
    const scoringPlayer=currentPlayer;
    const newDisc={...discardedKeys,[fractionKey(trashed)]:true};
    setDiscardedKeys(newDisc);
    playTrash();playHarp();burpTrash();
    setTrashTripsThisTurn(prev=>prev+1);
    const usedKeys={};
    fractions.forEach((f,i)=>{if(i!==idx)usedKeys[fractionKey(f)]=true;});
    const newFrac=createSmartLegalFraction(activeLevel(),usedKeys,newDisc,territories);
    const newFracs=cleanFractionHand(activeLevel(),(()=>{const arr=fractions.slice();arr[idx]=newFrac;return arr;})(),newDisc,territories);
    setFractions(newFracs);setSelectedFracIdx(null);
    const trashPts=activeLevel()===1?20:activeLevel()===2?50:100;
    setPlayers(prev=>({...prev,[scoringPlayer]:{...prev[scoringPlayer],points:prev[scoringPlayer].points+trashPts}}));
    const trashLines=["That fraction was GARBAGE anyway!","Bye bye, bad fraction! 👋","Into the void it goes!","The trash can is DELIGHTED.","That fraction had no friends here.","Disposed of with extreme prejudice!","Even the trash can rolled its eyes.","One fraction's trash is no one's treasure."];
    const trashMsg=trashLines[Math.floor(Math.random()*trashLines.length)];
    showPow("FRAC TRASH! +"+trashPts,trashMsg,scoringPlayer,()=>{
      resetTimerToThirty(()=>{lockedRef.current=true;setGameLocked(true);showPow("TIME'S UP!","Turn lost!","red",()=>{doSwitchTurn(scoringPlayer==="orange"?"green":"orange");});});
      unlockAfterInputGuard(350);
    },{imageSrc:IMG_TRASH,imageAlt:"Frac Trash",variant:"trashSuccess"});
  }

  function renderLesson(){if(!lessonOverlay)return null;const{t,remaining,callback}=lessonOverlay;const simp=simplify(remaining,t.denominator);return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.58)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}><div style={{width:"min(760px,94vw)",background:"white",color:"#111",border:"7px solid #111",borderRadius:30,padding:24,boxShadow:"0 18px 42px rgba(0,0,0,.48)",textAlign:"center"}}><div style={{fontSize:27,fontWeight:1000,color:"#df2525",lineHeight:1}}>HIJACKED!</div><div style={{fontSize:15,fontWeight:1000,margin:"12px 0 18px"}}>This amount would have filled it.</div><div style={{width:"min(520px,88%)",height:72,margin:"0 auto 16px",border:"4px solid #111",display:"grid",gridTemplateColumns:`repeat(${t.denominator},1fr)`,background:"#fff7df"}}>{Array.from({length:t.denominator}).map((_,i)=>(<div key={i} style={{borderRight:i<t.denominator-1?"1px solid rgba(0,0,0,.38)":"none",background:i<(remaining%t.denominator||t.denominator)?"linear-gradient(180deg,#fff17a,#ffcc25)":"transparent"}}/>))}</div><div style={{display:"flex",justifyContent:"center",gap:18,flexWrap:"wrap",marginBottom:18}}><div style={{background:"#111",color:"white",borderRadius:18,padding:"10px 18px",fontSize:25,fontWeight:1000}}>{remaining}/{t.denominator}</div>{!(simp.n===remaining&&simp.d===t.denominator)&&(<div style={{background:"#111",color:"white",borderRadius:18,padding:"10px 18px",fontSize:25,fontWeight:1000}}>{simp.n}/{simp.d}</div>)}</div><button onClick={()=>{if(!lessonReady)return;setLessonOverlay(null);callback();}} style={{border:0,borderRadius:999,padding:"12px 28px",fontSize:19,fontWeight:1000,background:"#111",color:"white",cursor:lessonReady?"pointer":"default",opacity:lessonReady?1:0.42}}>{lessonReady?"Continue":"Look closely..."}</button></div></div>);}

                {fractions.map((f,i)=>{const txt=f.display||(f.n+"/"+f.d);const isSelected=i===selectedFracIdx;const isHinted=hints.fractionIdx===i;return(<div key={i} onClick={()=>{if(gameLocked||pendingTrick||boardInputBlocked())return;playMove();setHints({fractionIdx:null,territoryId:null});setSelectedFracIdx(i);}} style={{width:86,height:48,background:"white",color:"#111",border:"3px solid white",borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:1000,lineHeight:.95,cursor:"pointer",boxShadow:isHinted?"0 0 0 7px #fff24c,0 0 22px #fff24c,0 6px 14px rgba(0,0,0,.38)":isSelected?"0 0 0 5px #ffd83d,0 6px 14px rgba(0,0,0,.38)":"0 0 0 2px rgba(255,255,255,.55),0 4px 10px rgba(0,0,0,.30)",transform:isSelected?"translateY(-4px) scale(1.07)":"none",animation:isHinted?"hintPulse 1s infinite alternate":"none",transition:".15s"}}>{txt.includes(" ")?<span style={{fontSize:18}}>{txt}</span>:txt}</div>);})}

                  <button onClick={handleTrashClick} title={`Trash trips: ${trashTripsThisTurn}/3`} style={{width:72,height:64,border:"3px solid rgba(255,255,255,.95)",borderRadius:14,background:trashTripsThisTurn>=3?"#8a8f98":"#d0d4da",display:"flex",alignItems:"center",justifyContent:"center",cursor:trashTripsThisTurn>=3?"not-allowed":"pointer",boxShadow:"0 5px 12px rgba(0,0,0,.5)",padding:4,overflow:"hidden",opacity:trashTripsThisTurn>=3?.65:1,transition:".15s"}}>
                    <img src={IMG_TRASH} alt="Trash" style={{width:58,height:52,objectFit:"contain",display:"block",animation:trashBurp?"trashShake .22s 4":"none"}}/>
                  </button>
                  <div style={{fontSize:14,fontWeight:1000,color:"white",textShadow:"0 2px 4px rgba(0,0,0,.8)",lineHeight:1.2,whiteSpace:"nowrap"}}>Trash {trashTripsThisTurn}/3</div>
                </div>
              </div>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center"}}>
            <img src={IMG_ZOODLEBUG} alt="Zoodlebug" style={{height:84,objectFit:"contain",filter:"drop-shadow(0 2px 6px rgba(0,0,0,.5))"}}/>
          </div>
          <ScoreCard color="green" name="JACKRABBIT" points={players.green.points}/>
        </div>
        <div style={{minHeight:0,height:"100%",display:"grid",gridTemplateColumns:"240px 1fr 240px",gap:12,overflow:"visible"}}>
          <PlayerPanel color="orange" active={currentPlayer==="orange"&&gameStarted} mascotSrc={IMG_JACKAL} mascotClass="orange" trickUsed={trickUsed.orange} onTrick={t=>applyTrick("orange",t)} level={level}/>
          <main style={{minWidth:0,minHeight:0,height:"100%",position:"relative",zIndex:4}}>
            {renderTerritories()}
          </main>
          <PlayerPanel color="green" active={currentPlayer==="green"&&gameStarted} mascotSrc={IMG_JACKRABBIT} mascotClass="green" trickUsed={trickUsed.green} onTrick={t=>applyTrick("green",t)} level={level}/>
        </div>
      </div>
    )}

    {/* ── LANDSCAPE BLOCKER ── */}
    {!isDesktop&&isLandscape&&(
      <div style={{position:"fixed",inset:0,zIndex:300,overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center",padding:24,fontFamily:"Arial, Helvetica, sans-serif",color:"white",textAlign:"center",userSelect:"none",background:BG}}>
        <div style={{width:"min(520px,92vw)",border:"6px solid white",borderRadius:28,padding:"24px 22px",background:"rgba(0,0,0,.52)",boxShadow:"0 22px 60px rgba(0,0,0,.68)",display:"flex",flexDirection:"column",alignItems:"center",gap:14}}>
          <img src={IMG_LOGO} alt="Frac Jack" style={{maxWidth:"min(320px,82vw)",maxHeight:130,objectFit:"contain",filter:"drop-shadow(0 10px 16px rgba(0,0,0,.75))"}}/>
          <div style={{fontSize:"clamp(24px,6vw,40px)",fontWeight:1000,lineHeight:1.05,textShadow:"0 4px 0 rgba(0,0,0,.55)"}}>Please turn your device to play Frac Jack</div>
        </div>
      </div>
    )}

    {/* ── PORTRAIT ── */}
    {!isDesktop&&!isLandscape&&(
      <div style={{height:"100dvh",maxHeight:"100dvh",overflow:"hidden",padding:`4px 8px ${portraitBottomPad}px`,display:"grid",gridTemplateRows:portraitMainGridRows,gap:portraitGap,fontFamily:"Arial, Helvetica, sans-serif",color:"white",userSelect:"none",background:BG}}>
        <div style={{display:"grid",gridTemplateColumns:"74px minmax(0,1fr) 58px",alignItems:"center",gap:6,minHeight:0,overflow:"visible"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center"}}>
            <div style={{border:"2px solid white",borderRadius:8,background:"rgba(0,0,0,.5)",padding:"3px 6px",fontWeight:1000,fontSize:12,letterSpacing:.5,boxShadow:"0 3px 8px rgba(0,0,0,.35)"}}>{timerDisplay}</div>
          </div>
          <div style={{display:"flex",justifyContent:"center",alignItems:"center",minWidth:0,overflow:"visible"}}>
            <img src={IMG_LOGO} alt="Frac Jack" style={{maxHeight:portraitLogoH,maxWidth:"100%",objectFit:"contain",filter:"drop-shadow(0 6px 12px rgba(0,0,0,.75))"}}/>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"stretch",justifyContent:"center",gap:2,minWidth:0}}>
            <button onClick={()=>setRulesOverlay(true)} style={{background:"rgba(255,255,255,.12)",border:"1px solid rgba(255,255,255,.45)",borderRadius:6,color:"rgba(255,255,255,.9)",fontSize:9,fontWeight:900,cursor:"pointer",textTransform:"uppercase",padding:"2px 3px",lineHeight:1}}>Rules</button>
            <button onClick={()=>setupNewGame()} style={{background:"rgba(255,255,255,.12)",border:"1px solid rgba(255,255,255,.45)",borderRadius:6,color:"rgba(255,255,255,.9)",fontSize:9,fontWeight:900,cursor:"pointer",textTransform:"uppercase",padding:"2px 3px",lineHeight:1}}>New</button>
            <button onClick={toggleMute} style={{background:"rgba(255,255,255,.12)",border:"1px solid rgba(255,255,255,.45)",borderRadius:6,color:"rgba(255,255,255,.9)",fontSize:11,fontWeight:900,cursor:"pointer",padding:"1px 3px",lineHeight:1}}>{muted?"🔇":"🔊"}</button>
          </div>
        </div>

        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,flexWrap:"nowrap",overflow:"visible",position:"relative",zIndex:20,minHeight:0}}>
          {fractions.map((f,i)=>{
            const txt=f.display||(f.n+"/"+f.d);
            const isSelected=i===selectedFracIdx;
            const isHinted=hints.fractionIdx===i;
            return(
              <div key={i}
                onClick={()=>{if(gameLocked||pendingTrick||boardInputBlocked())return;playMove();setHints({fractionIdx:null,territoryId:null});setSelectedFracIdx(i);}}
                style={{width:56,height:32,background:"white",color:"#111",border:"3px solid white",borderRadius:13,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:1000,lineHeight:.95,cursor:"pointer",
                  boxShadow:isHinted?"0 0 0 6px #fff24c,0 0 18px #fff24c,0 6px 10px rgba(0,0,0,.35)":isSelected?"0 0 0 4px #ffd83d,0 6px 10px rgba(0,0,0,.35)":"0 0 0 2px rgba(255,255,255,.55),0 4px 9px rgba(0,0,0,.30)",
                  transform:isSelected?"translateY(-2px) scale(1.03)":"none",
                  animation:isHinted?"hintPulse 1s infinite alternate":"none",transition:".15s"}}>
                {txt.includes(" ")?<span style={{fontSize:13}}>{txt}</span>:txt}
              </div>
            );
          })}
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1,overflow:"visible",flexShrink:0}}>
            <button onClick={handleTrashClick} title={`Trash trips this turn: ${trashTripsThisTurn}/3`}
              style={{width:46,height:34,border:"3px solid rgba(255,255,255,.98)",borderRadius:14,background:trashTripsThisTurn>=3?"#8a8f98":"#d0d4da",display:"flex",alignItems:"center",justifyContent:"center",cursor:trashTripsThisTurn>=3?"not-allowed":"pointer",boxShadow:"0 4px 8px rgba(0,0,0,.45)",padding:3,overflow:"hidden",transition:".15s",opacity:trashTripsThisTurn>=3?.65:1}}>
              <img src={IMG_TRASH} alt="Trash" style={{width:36,height:28,objectFit:"contain",display:"block",animation:trashBurp?"trashShake .22s 4":"none"}}/>
            </button>
            <div style={{fontSize:10,fontWeight:1000,color:"white",textShadow:"0 2px 4px rgba(0,0,0,.7)",lineHeight:1.1,whiteSpace:"nowrap"}}>Trash {trashTripsThisTurn}/3</div>
          </div>
        </div>

        {territories&&territories.length>=5&&(()=>{
          const t1=territories[0],t2=territories[1],t3=territories[2],t4=territories[3],t5=territories[4];
          const cp={onClick:handleTerritoryClick,players,gameLocked,gameStarted,victoryReached,boardInputBlocked,isDesktop:false,compactPortrait:true};
          return(
            <div style={{minHeight:0,height:"100%",display:"grid",gridTemplateRows:"minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)",gap:portraitGap,overflow:"hidden",position:"relative",zIndex:10}}>
              <TerritoryCard key={t1.id} t={t1} isHinted={hints.territoryId===t1.id} {...cp}/>
              <TerritoryCard key={t2.id} t={t2} isHinted={hints.territoryId===t2.id} {...cp}/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:portraitGap,minHeight:0,overflow:"hidden"}}>
                <TerritoryCard key={t3.id} t={t3} isHinted={hints.territoryId===t3.id} {...cp}/>
                <TerritoryCard key={t4.id} t={t4} isHinted={hints.territoryId===t4.id} {...cp}/>
              </div>
              <TerritoryCard key={t5.id} t={t5} isHinted={hints.territoryId===t5.id} {...cp}/>
            </div>
          );
        })()}

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:portraitGap,height:"100%",minHeight:0,overflow:"visible",position:"relative",zIndex:40}}>
          <PlayerPanel color="orange" active={currentPlayer==="orange"&&gameStarted} mascotSrc={IMG_JACKAL} mascotClass="orange" trickUsed={trickUsed.orange} onTrick={t=>applyTrick("orange",t)} level={level} compact points={players.orange.points}/>
          <PlayerPanel color="green" active={currentPlayer==="green"&&gameStarted} mascotSrc={IMG_JACKRABBIT} mascotClass="green" trickUsed={trickUsed.green} onTrick={t=>applyTrick("green",t)} level={level} compact points={players.green.points}/>
        </div>
      </div>
    )}

    {/* ── PLACEMENT POPUP — educational fraction/percent/points popup ── */}
    {placementPow&&(
      <PlacementPopup
        data={placementPow}
        onContinue={()=>{
          setPlacementPow(null);
          const cb=placementPow_callback.current;
          placementPow_callback.current=null;
          if(cb) cb();
        }}
      />
    )}

    {/* ── POW ── */}
    {pow.show&&(<div style={{position:"fixed",inset:0,pointerEvents:"all",display:"flex",alignItems:"center",justifyContent:"center",zIndex:90,background:pow.variant==="trashSuccess"?"radial-gradient(circle at 50% 34%, rgba(255,232,72,.35), transparent 18%), radial-gradient(circle at 50% 58%, rgba(0,255,170,.18), transparent 28%), rgba(0,0,0,.78)":"rgba(0,0,0,.72)"}}><div style={{width:pow.variant==="trashSuccess"?"min(600px,90vw)":"min(480px,88vw)",borderRadius:pow.variant==="trashSuccess"?34:28,overflow:"hidden",position:"relative",border:pow.variant==="trashSuccess"?"8px solid #fff":"none",outline:pow.variant==="trashSuccess"?"5px solid #111":"none",boxShadow:pow.variant==="trashSuccess"?"0 18px 0 #111, 0 28px 0 rgba(0,0,0,.38), 0 38px 88px rgba(0,0,0,.75), inset 0 0 0 6px rgba(255,255,255,.24)":"0 32px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.12)",background:pow.variant==="trashSuccess"?"linear-gradient(145deg,#37f28d 0%,#10a8ff 48%,#6a27ff 100%)":pow.color==="orange"?"linear-gradient(160deg,#ffcf60 0%,#e06800 100%)":pow.color==="green"?"linear-gradient(160deg,#a3f87a 0%,#2a9b14 100%)":pow.color==="red"?"linear-gradient(160deg,#ff9090 0%,#c01010 100%)":"linear-gradient(160deg,#80c8ff 0%,#0f5ed4 100%)"}}>{pow.variant==="trashSuccess"&&(<><div style={{position:"absolute",inset:0,background:"repeating-linear-gradient(-35deg, rgba(255,255,255,.16) 0 12px, transparent 12px 26px)",pointerEvents:"none"}}/><div style={{position:"absolute",left:-36,top:18,width:120,height:120,borderRadius:"50%",background:"rgba(255,232,55,.42)",filter:"blur(1px)"}}/><div style={{position:"absolute",right:-42,bottom:-34,width:88,height:88,borderRadius:"50%",background:"rgba(255,101,0,.34)",filter:"blur(1px)"}}/></>)}<div style={{height:pow.variant==="trashSuccess"?10:6,background:pow.variant==="trashSuccess"?"linear-gradient(90deg,#fff35b,#ffffff,#69ff6b,#ffffff,#fff35b)":"rgba(255,255,255,.35)",position:"relative",zIndex:1}}/><div style={{padding:pow.variant==="trashSuccess"?"28px 36px 32px":"36px 40px 32px",textAlign:"center",color:"white",position:"relative",zIndex:1,textShadow:pow.variant==="trashSuccess"?"0 4px 0 #111, 0 8px 18px rgba(0,0,0,.45)":"0 2px 8px rgba(0,0,0,.4)"}}>{pow.variant==="trashSuccess"&&<div style={{fontSize:22,fontWeight:1000,color:"#ffdf4c",lineHeight:1,textTransform:"uppercase",letterSpacing:1,marginTop:4,textShadow:"0 3px 0 rgba(0,0,0,.55)"}}>NICE DUMP!</div>}<div style={{fontSize:pow.variant==="trashSuccess"?"clamp(38px,7vw,68px)":"clamp(44px,8vw,62px)",fontWeight:1000,lineHeight:.92,textTransform:"uppercase",letterSpacing:-1}}>{pow.big}</div>{pow.imageSrc&&(<div style={{width:"min(220px,50vw)",height:"min(190px,34vh)",display:"flex",alignItems:"center",justifyContent:"center",margin:"14px auto 6px",borderRadius:pow.variant==="trashSuccess"?24:0,background:pow.variant==="trashSuccess"?"radial-gradient(circle,#ffffff 0%,#eaffff 58%,rgba(255,255,255,.22) 59%,rgba(255,255,255,.08) 100%)":"transparent",border:pow.variant==="trashSuccess"?"5px solid #111":"none",boxShadow:pow.variant==="trashSuccess"?"0 9px 0 rgba(0,0,0,.48), inset 0 0 0 5px rgba(255,255,255,.5)":"none"}}><img src={pow.imageSrc} alt={pow.imageAlt||""} style={{width:"88%",height:"88%",objectFit:"contain",display:"block",filter:pow.variant==="trashSuccess"?"drop-shadow(0 12px 0 rgba(0,0,0,.32)) drop-shadow(0 14px 18px rgba(0,0,0,.38))":"drop-shadow(0 10px 12px rgba(0,0,0,.45))",transform:pow.variant==="trashSuccess"?"rotate(3deg) scale(1.05)":"none"}}/></div>)}<div style={{display:pow.variant==="trashSuccess"?"inline-block":"block",fontSize:pow.variant==="trashSuccess"?24:22,fontWeight:1000,marginTop:pow.variant==="trashSuccess"?12:8,opacity:.96,letterSpacing:.3,background:pow.variant==="trashSuccess"?"rgba(0,0,0,.28)":"transparent",border:pow.variant==="trashSuccess"?"3px solid rgba(255,255,255,.75)":"none",borderRadius:pow.variant==="trashSuccess"?18:0,padding:pow.variant==="trashSuccess"?"7px 14px":0,boxShadow:pow.variant==="trashSuccess"?"inset 0 2px 0 rgba(255,255,255,.24)":"none"}}>{pow.small}</div><br/><button onPointerDown={e=>e.stopPropagation()} onClick={dismissPow} style={{marginTop:pow.variant==="trashSuccess"?24:28,display:"inline-block",background:pow.variant==="trashSuccess"?"linear-gradient(180deg,#fff35f,#ffb000)":"rgba(0,0,0,.22)",backdropFilter:"blur(6px)",border:pow.variant==="trashSuccess"?"5px solid #111":"2px solid rgba(255,255,255,.55)",borderRadius:pow.variant==="trashSuccess"?999:14,padding:pow.variant==="trashSuccess"?"12px 40px":"11px 36px",color:pow.variant==="trashSuccess"?"#111":"white",fontSize:pow.variant==="trashSuccess"?17:15,fontWeight:1000,cursor:"pointer",letterSpacing:1,textTransform:"uppercase",boxShadow:pow.variant==="trashSuccess"?"0 7px 0 rgba(0,0,0,.55), 0 12px 22px rgba(0,0,0,.34)":"0 4px 14px rgba(0,0,0,.25)",transition:"background .15s"}}>Continue</button></div></div></div>)}

    {renderLesson()}

    {trashPenaltyOverlay&&(<div style={{position:"fixed",inset:0,zIndex:120,display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:"rgba(0,0,0,.78)"}}><div style={{position:"relative",width:"min(580px,92vw)",border:"7px solid white",borderRadius:34,padding:"20px 22px 22px",textAlign:"center",color:"white",background:"linear-gradient(180deg,#2b1111,#07090f 62%,#101824)",boxShadow:"0 24px 60px rgba(0,0,0,.68)",textShadow:"0 4px 0 rgba(0,0,0,.55)"}}><img src={IMG_TRASH} alt="" style={{width:100,height:100,objectFit:"contain"}}/><div style={{fontSize:isMobile?36:46,fontWeight:1000,color:"#ffdf4c",lineHeight:.95,textTransform:"uppercase",marginTop:4}}>Not Frac Trash!</div><div style={{fontSize:isMobile?16:22,fontWeight:1000,lineHeight:1.25,margin:"10px auto 16px",maxWidth:440}}>{trashPenaltyMsg}</div><div style={{display:"inline-block",fontSize:isMobile?26:34,fontWeight:1000,color:"white",background:"linear-gradient(180deg,#ff6a6a,#d41414)",border:"4px solid white",borderRadius:20,padding:"8px 16px",transform:"rotate(-3deg)",boxShadow:"0 7px 0 rgba(0,0,0,.42)"}}>-{penaltyAmount} JACK POINTS</div><br/><button onPointerDown={e=>e.stopPropagation()} onClick={e=>{e.preventDefault();e.stopPropagation();blockBoardInput(650);setTrashPenaltyOverlay(false);if(victoryReached)return;resumeTimer(()=>{lockedRef.current=true;setGameLocked(true);showPow("TIME'S UP!","Turn lost!","red",()=>doSwitchTurn(currentPlayer==="orange"?"green":"orange"));});unlockAfterInputGuard(350);}} style={{marginTop:18,border:"4px solid white",borderRadius:999,padding:isMobile?"10px 28px":"12px 32px",fontSize:isMobile?18:21,fontWeight:1000,color:"#111",background:"linear-gradient(180deg,#ffe76a,#ff9d18)",cursor:"pointer",boxShadow:"0 6px 0 rgba(0,0,0,.45)",textTransform:"uppercase"}}>Continue</button></div></div>)}

    {rulesOverlay&&(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.58)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:isMobile?12:14,overflowY:"auto"}}><div style={{width:"min(700px,96vw)",background:"white",color:"#111",border:"7px solid #111",borderRadius:30,padding:isMobile?"16px 14px":24,boxShadow:"0 18px 42px rgba(0,0,0,.48)",textAlign:"center"}}><div style={{fontSize:isMobile?34:46,fontWeight:1000,color:"#df2525",lineHeight:1}}>How to Play</div><div style={{fontSize:isMobile?14:18,fontWeight:900,lineHeight:1.35,textAlign:"left",maxWidth:580,margin:"14px auto"}}>Pick one fraction and place it in a territory. Earn Jack Points equal to the percentage of the last whole you filled — placing <strong>3/4</strong> earns <strong>75 points</strong>, filling a whole earns <strong>100 points</strong>.<br/><br/>Complete a territory and earn a <strong>+50 Jack Bonus</strong> — a full Jack is worth <strong>150 points</strong>! Go over the territory limit and your opponent <strong>Hijacks</strong> it for 50 points while you earn nothing.<br/><br/>Some fractions do not fit some models. If it does not fit, your turn ends.<br/><br/>Toss a truly unplayable fraction into the <strong>Frac Trash</strong> and get +10 points plus a replacement — and your timer resets! Max <strong>3 trash trips per turn</strong>. Trashing a playable fraction costs you <strong>25 points</strong>.<br/><br/><strong>Jack Tricks:</strong> Hint reveals a legal move · Re-Frac deals new fractions · Jackback clears one whole from a territory.<br/><br/>Highest Jack Points wins when all 5 territories are Jacked!</div><button onClick={()=>setRulesOverlay(false)} style={{border:0,borderRadius:999,padding:"12px 28px",fontSize:19,fontWeight:1000,background:"#111",color:"white",cursor:"pointer"}}>Close</button></div></div>)}

    {victoryData&&(<div style={{position:"fixed",top:isMobile?70:100,left:"50%",transform:"translateX(-50%)",zIndex:95,width:"min(680px,90vw)",display:"grid",gridTemplateColumns:"1fr 120px",gap:12,alignItems:"center",padding:isMobile?"14px 16px":"18px 22px",border:"6px solid #ffd83d",borderRadius:26,background:"linear-gradient(135deg,#111,#372100)",boxShadow:"0 18px 44px rgba(0,0,0,.55)"}}><div><div style={{fontSize:isMobile?24:34,fontWeight:1000,lineHeight:1.05,marginBottom:10,color:"white"}}>{victoryData.tie?"Frac Jack Tie!":players[victoryData.winner].name+" is the Frac Jack Champ!"}</div><button onClick={()=>setupNewGame()} style={{border:"3px solid #ffd83d",borderRadius:12,padding:"8px 18px",fontSize:14,fontWeight:1000,background:"linear-gradient(180deg,#ffe84d,#f0b800)",color:"#111",cursor:"pointer",textTransform:"uppercase",boxShadow:"0 4px 10px rgba(0,0,0,.35)"}}>New Game</button></div><img src={victoryData.tie?IMG_LOGO:victoryData.winner==="orange"?IMG_JACKAL:IMG_JACKRABBIT} alt="" style={{maxWidth:110,maxHeight:110,objectFit:"contain"}}/></div>)}
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<FracJack/>);
  </script>
</body>
