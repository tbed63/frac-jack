<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frac Jack</title>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0d2814, #1b1b1b 50%, #351800);
      color: #111;
      min-height: 100vh;
    }

    .game {
      width: 100vw;
      min-height: 100vh;
      padding: 16px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 14px;
    }

    .top {
      display: grid;
      grid-template-columns: 1fr 260px 1fr;
      gap: 16px;
      align-items: center;
    }

    .player {
      background: white;
      border: 5px solid #111;
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 8px 0 #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 110px;
    }

    .player.green {
      border-color: #1fb83f;
    }

    .player.orange {
      border-color: #ff7900;
    }

    .player.active {
      outline: 6px solid #ffe600;
      outline-offset: 3px;
    }

    .player-name {
      font-size: 26px;
      font-weight: 900;
    }

    .score {
      font-size: 52px;
      font-weight: 900;
    }

    .logo {
      text-align: center;
    }

    .logo img {
      max-width: 260px;
      max-height: 130px;
      object-fit: contain;
    }

    .kids-row {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 120px;
    }

    .kids-row img {
      max-height: 125px;
      max-width: 520px;
      object-fit: contain;
    }

    .message {
      background: #111;
      color: white;
      border-radius: 18px;
      padding: 14px;
      font-size: 22px;
      font-weight: 900;
      text-align: center;
      border: 4px solid white;
    }

    .board {
      background: rgba(255,255,255,0.92);
      border: 5px solid white;
      border-radius: 26px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      align-items: stretch;
    }

    .whole {
      background: #fff6dd;
      border: 5px solid #111;
      border-radius: 20px;
      padding: 12px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      min-height: 280px;
      cursor: pointer;
      box-shadow: 0 6px 0 #111;
    }

    .whole:hover {
      transform: translateY(-2px);
    }

    .whole-title {
      font-size: 20px;
      font-weight: 900;
      text-align: center;
    }

    .square {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: white;
      border: 5px solid #111;
      border-radius: 14px;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 4px;
      align-self: center;
    }

    .cell {
      background: #eee4c9;
      border: 2px solid rgba(0,0,0,0.25);
      border-radius: 7px;
    }

    .cell.green {
      background: #28c94a;
    }

    .cell.orange {
      background: #ff8500;
    }

    .whole-status {
      text-align: center;
      font-weight: 900;
      font-size: 16px;
      min-height: 22px;
    }

    .hands {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .hand {
      background: rgba(255,255,255,0.95);
      border: 5px solid white;
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }

    .hand.green {
      border-color: #1fb83f;
    }

    .hand.orange {
      border-color: #ff7900;
    }

    .hand-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .pieces {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    .piece {
      background: white;
      border: 4px solid #111;
      border-radius: 18px;
      padding: 8px;
      min-height: 110px;
      cursor: pointer;
      box-shadow: 0 5px 0 #111;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
    }

    .piece:hover {
      transform: translateY(-3px);
    }

    .piece.selected {
      outline: 6px solid #ffe600;
      outline-offset: 3px;
    }

    .piece.disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .fraction {
      font-weight: 900;
      font-size: 25px;
      text-align: center;
      line-height: 0.85;
    }

    .fraction span {
      display: block;
    }

    .bar {
      height: 4px;
      width: 34px;
      background: #111;
      margin: 3px auto;
      border-radius: 99px;
    }

    .mini {
      border: 3px solid #111;
      border-radius: 10px;
      padding: 4px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 3px;
      background: white;
    }

    .mini-cell {
      background: #eee4c9;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.25);
    }

    .green-piece .mini-cell.filled {
      background: #28c94a;
    }

    .orange-piece .mini-cell.filled {
      background: #ff8500;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }

    button {
      background: #111;
      color: white;
      border: none;
      border-radius: 999px;
      padding: 11px 20px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .hidden-labels .fraction {
      visibility: hidden;
    }

    @media (max-width: 1000px) {
      body {
        overflow: auto;
      }

      .top {
        grid-template-columns: 1fr;
      }

      .board {
        grid-template-columns: repeat(2, 1fr);
      }

      .hands {
        grid-template-columns: 1fr;
      }

      .pieces {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>
  <div class="game" id="game">
    <div class="top">
      <div class="player green active" id="greenPlayer">
        <div>
          <div class="player-name">GREEN TEAM</div>
          <div>Score</div>
        </div>
        <div class="score" id="greenScore">0</div>
      </div>

      <div class="logo">
        <img src="frac-jack-logo.png" alt="Frac Jack Logo">
      </div>

      <div class="player orange" id="orangePlayer">
        <div>
          <div class="player-name">ORANGE TEAM</div>
          <div>Score</div>
        </div>
        <div class="score" id="orangeScore">0</div>
      </div>
    </div>

    <div class="kids-row">
      <img src="frac-jack-kids.png" alt="Frac Jack Kids">
    </div>

    <div class="message" id="message">Green Team: choose a piece.</div>

    <div class="board" id="board"></div>

    <div class="hands">
      <div class="hand green">
        <div class="hand-title">
          <span>Green Pieces</span>
          <span id="greenLeft">0 left</span>
        </div>
        <div class="pieces" id="greenPieces"></div>
      </div>

      <div class="hand orange">
        <div class="hand-title">
          <span>Orange Pieces</span>
          <span id="orangeLeft">0 left</span>
        </div>
        <div class="pieces" id="orangePieces"></div>
      </div>
    </div>

    <div class="buttons">
      <button onclick="startGame()">New Game</button>
      <button onclick="toggleLabels()" id="labelButton">Hide Fraction Labels</button>
    </div>
  </div>

  <script>
    var currentPlayer = "green";
    var selectedPieceId = null;
    var labelsShowing = true;

    var greenScore = 0;
    var orangeScore = 0;

    var greenDeck = [];
    var orangeDeck = [];
    var greenHand = [];
    var orangeHand = [];

    var wholes = [];
    var idCounter = 0;

    var pieceOptions = [
      { label: "1/8", top: 1, bottom: 8, units: 1 },
      { label: "1/4", top: 1, bottom: 4, units: 2 },
      { label: "3/8", top: 3, bottom: 8, units: 3 },
      { label: "1/2", top: 1, bottom: 2, units: 4 },
      { label: "5/8", top: 5, bottom: 8, units: 5 },
      { label: "3/4", top: 3, bottom: 4, units: 6 }
    ];

    var weightedPieces = [
      "1/8", "1/8", "1/8", "1/8",
      "1/4", "1/4", "1/4", "1/4",
      "3/8", "3/8", "3/8",
      "1/2", "1/2", "1/2",
      "5/8", "5/8",
      "3/4", "3/4"
    ];

    function makeId() {
      idCounter++;
      return "piece" + idCounter;
    }

    function findPieceTemplate(label) {
      for (var i = 0; i < pieceOptions.length; i++) {
        if (pieceOptions[i].label === label) {
          return pieceOptions[i];
        }
      }
      return pieceOptions[0];
    }

    function makePiece(label) {
      var template = findPieceTemplate(label);
      return {
        id: makeId(),
        label: template.label,
        top: template.top,
        bottom: template.bottom,
        units: template.units
      };
    }

    function makeDeck() {
      var deck = [];

      for (var i = 0; i < 24; i++) {
        var randomLabel = weightedPieces[Math.floor(Math.random() * weightedPieces.length)];
        deck.push(makePiece(randomLabel));
      }

      return shuffle(deck);
    }

    function shuffle(array) {
      var copy = array.slice();

      for (var i = copy.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }

      return copy;
    }

    function startGame() {
      currentPlayer = "green";
      selectedPieceId = null;
      labelsShowing = true;

      greenScore = 0;
      orangeScore = 0;

      greenDeck = makeDeck();
      orangeDeck = makeDeck();

      greenHand = [];
      orangeHand = [];

      for (var i = 0; i < 6; i++) {
        greenHand.push(greenDeck.shift());
        orangeHand.push(orangeDeck.shift());
      }

      wholes = [];

      for (var w = 0; w < 5; w++) {
        wholes.push({
          cells: [null, null, null, null, null, null, null, null],
          filled: 0
        });
      }

      document.body.classList.remove("hidden-labels");
      render();
      setMessage("Green Team: choose a piece.");
    }

    function render() {
      document.getElementById("greenScore").textContent = greenScore;
      document.getElementById("orangeScore").textContent = orangeScore;

      document.getElementById("greenLeft").textContent = greenDeck.length + " left";
      document.getElementById("orangeLeft").textContent = orangeDeck.length + " left";

      document.getElementById("greenPlayer").classList.toggle("active", currentPlayer === "green");
      document.getElementById("orangePlayer").classList.toggle("active", currentPlayer === "orange");

      renderBoard();
      renderHands();

      document.getElementById("labelButton").textContent = labelsShowing ? "Hide Fraction Labels" : "Show Fraction Labels";
    }

    function renderBoard() {
      var board = document.getElementById("board");
      board.innerHTML = "";

      for (var i = 0; i < wholes.length; i++) {
        var whole = wholes[i];

        var card = document.createElement("div");
        card.className = "whole";
        card.setAttribute("data-index", i);
        card.onclick = function() {
          var index = Number(this.getAttribute("data-index"));
          playPiece(index);
        };

        var title = document.createElement("div");
        title.className = "whole-title";
        title.textContent = "WHOLE " + (i + 1);

        var square = document.createElement("div");
        square.className = "square";

        for (var c = 0; c < 8; c++) {
          var cell = document.createElement("div");
          cell.className = "cell";

          if (whole.cells[c] === "green") {
            cell.classList.add("green");
          }

          if (whole.cells[c] === "orange") {
            cell.classList.add("orange");
          }

          square.appendChild(cell);
        }

        var status = document.createElement("div");
        status.className = "whole-status";
        status.textContent = whole.filled === 0 ? "Empty" : "Partly Filled";

        card.appendChild(title);
        card.appendChild(square);
        card.appendChild(status);

        board.appendChild(card);
      }
    }

    function renderHands() {
      renderOneHand("green", greenHand, document.getElementById("greenPieces"));
      renderOneHand("orange", orangeHand, document.getElementById("orangePieces"));
    }

    function renderOneHand(player, hand, container) {
      container.innerHTML = "";

      for (var i = 0; i < hand.length; i++) {
        var piece = hand[i];

        var div = document.createElement("div");
        div.className = "piece " + player + "-piece";

        if (currentPlayer !== player) {
          div.classList.add("disabled");
        }

        if (selectedPieceId === piece.id) {
          div.classList.add("selected");
        }

        div.setAttribute("data-player", player);
        div.setAttribute("data-id", piece.id);

        div.onclick = function() {
          choosePiece(this.getAttribute("data-player"), this.getAttribute("data-id"));
        };

        var fraction = document.createElement("div");
        fraction.className = "fraction";
        fraction.innerHTML =
          "<span>" + piece.top + "</span>" +
          "<div class='bar'></div>" +
          "<span>" + piece.bottom + "</span>";

        var mini = document.createElement("div");
        mini.className = "mini";

        for (var c = 0; c < 8; c++) {
          var cell = document.createElement("div");
          cell.className = "mini-cell";

          if (c < piece.units) {
            cell.classList.add("filled");
          }

          mini.appendChild(cell);
        }

        div.appendChild(fraction);
        div.appendChild(mini);

        container.appendChild(div);
      }
    }

    function choosePiece(player, id) {
      if (player !== currentPlayer) {
        return;
      }

      selectedPieceId = id;

      if (currentPlayer === "green") {
        setMessage("Green Team: now choose a square.");
      } else {
        setMessage("Orange Team: now choose a square.");
      }

      render();
    }

    function getHand(player) {
      return player === "green" ? greenHand : orangeHand;
    }

    function setHand(player, hand) {
      if (player === "green") {
        greenHand = hand;
      } else {
        orangeHand = hand;
      }
    }

    function getDeck(player) {
      return player === "green" ? greenDeck : orangeDeck;
    }

    function findSelectedPiece() {
      var hand = getHand(currentPlayer);

      for (var i = 0; i < hand.length; i++) {
        if (hand[i].id === selectedPieceId) {
          return hand[i];
        }
      }

      return null;
    }

    function removeSelectedPiece() {
      var hand = getHand(currentPlayer);
      var newHand = [];

      for (var i = 0; i < hand.length; i++) {
        if (hand[i].id !== selectedPieceId) {
          newHand.push(hand[i]);
        }
      }

      setHand(currentPlayer, newHand);
    }

    function drawNewPiece() {
      var deck = getDeck(currentPlayer);
      var hand = getHand(currentPlayer);

      if (deck.length > 0) {
        hand.push(deck.shift());
      }

      setHand(currentPlayer, hand);
    }

    function playPiece(wholeIndex) {
      var piece = findSelectedPiece();

      if (!piece) {
        setMessage("Choose a piece first.");
        return;
      }

      var whole = wholes[wholeIndex];

      if (whole.filled + piece.units > 8) {
        removeSelectedPiece();
        drawNewPiece();

        if (currentPlayer === "green") {
          setMessage("Green Team went over. Piece lost!");
        } else {
          setMessage("Orange Team went over. Piece lost!");
        }

        selectedPieceId = null;
        switchPlayer();
        render();
        return;
      }

      var needed = piece.units;

      for (var i = 0; i < whole.cells.length; i++) {
        if (whole.cells[i] === null && needed > 0) {
          whole.cells[i] = currentPlayer;
          needed--;
        }
      }

      whole.filled += piece.units;

      removeSelectedPiece();
      drawNewPiece();

      if (whole.filled === 8) {
        if (currentPlayer === "green") {
          greenScore++;
          setMessage("Green Team JACKED the whole!");
        } else {
          orangeScore++;
          setMessage("Orange Team JACKED the whole!");
        }

        wholes[wholeIndex] = {
          cells: [null, null, null, null, null, null, null, null],
          filled: 0
        };
      } else {
        if (currentPlayer === "green") {
          setMessage("Green Team placed a piece.");
        } else {
          setMessage("Orange Team placed a piece.");
        }
      }

      selectedPieceId = null;
      switchPlayer();
      render();
      checkGameOver();
    }

    function switchPlayer() {
      currentPlayer = currentPlayer === "green" ? "orange" : "green";
    }

    function setMessage(text) {
      document.getElementById("message").textContent = text;
    }

    function toggleLabels() {
      labelsShowing = !labelsShowing;

      if (labelsShowing) {
        document.body.classList.remove("hidden-labels");
      } else {
        document.body.classList.add("hidden-labels");
      }

      render();
    }

    function checkGameOver() {
      if (greenDeck.length === 0 && orangeDeck.length === 0) {
        var message = "Game over! ";

        if (greenScore > orangeScore) {
          message += "Green Team wins!";
        } else if (orangeScore > greenScore) {
          message += "Orange Team wins!";
        } else {
          message += "It's a tie!";
        }

        setMessage(message + " Final Score: Green " + greenScore + " - Orange " + orangeScore);
      }
    }

    try {
      startGame();
    } catch (error) {
      document.body.innerHTML =
        "<div style='background:white;color:black;font-family:Arial;padding:40px;min-height:100vh;'>" +
        "<h1>Frac Jack Error</h1>" +
        "<p>The page loaded, but the game code hit an error.</p>" +
        "<pre style='white-space:pre-wrap;background:#eee;padding:20px;border-radius:12px;'>" +
        error +
        "</pre></div>";
    }
  </script>
</body>
</html>
