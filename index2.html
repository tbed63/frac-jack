<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frac Jack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    .territory { transition: all 0.2s; }
    .territory:hover { transform: scale(1.03); }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-950 via-blue-950 to-purple-950 text-white min-h-screen">

  <div class="max-w-5xl mx-auto p-4">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <div class="text-3xl font-bold">🐺 Jackal <span id="orange-score" class="text-orange-400">0</span></div>
      <div class="text-center">
        <h1 class="text-4xl font-black tracking-wider text-yellow-300">FRAC JACK</h1>
        <div id="timer" class="text-5xl font-mono font-bold text-white mt-2">00:30</div>
      </div>
      <div class="text-3xl font-bold text-right">🐰 Jackrabbit <span id="green-score" class="text-green-400">0</span></div>
    </div>

    <!-- Fractions -->
    <div class="bg-white/10 backdrop-blur rounded-2xl p-4 mb-6">
      <p class="text-center text-sm mb-3 text-yellow-200">Choose a fraction</p>
      <div id="fractions" class="flex justify-center gap-4 flex-wrap"></div>
    </div>

    <!-- Territories -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="territories"></div>

    <!-- Controls -->
    <div class="flex justify-center gap-4 mt-8">
      <button onclick="trashFraction()" 
              class="bg-red-600 hover:bg-red-700 px-8 py-4 rounded-2xl text-xl font-bold flex items-center gap-2">
        🗑️ TRASH
      </button>
      <button onclick="newGame()" 
              class="bg-white text-black hover:bg-gray-200 px-8 py-4 rounded-2xl text-xl font-bold">
        New Game
      </button>
    </div>
  </div>

  <script>
    let currentPlayer = "orange";
    let orangeScore = 0;
    let greenScore = 0;
    let timerInterval;
    let timeLeft = 30;
    let selectedFraction = null;

    const territories = [
      { id: 0, name: "T1", model: "Bar", wholes: 2, denominator: 4, filled: 0, owner: null },
      { id: 1, name: "T2", model: "Circle", wholes: 3, denominator: 6, filled: 0, owner: null },
      { id: 2, name: "T3", model: "Set", wholes: 2, denominator: 5, filled: 0, owner: null },
      { id: 3, name: "T4", model: "Line", wholes: 2, denominator: 8, filled: 0, owner: null },
      { id: 4, name: "T5", model: "Area", wholes: 3, denominator: 4, filled: 0, owner: null }
    ];

    const fractionPool = [
      {n:1,d:2}, {n:1,d:3}, {n:1,d:4}, {n:2,d:3}, {n:1,d:5},
      {n:3,d:4}, {n:2,d:5}, {n:3,d:5}, {n:1,d:6}, {n:5,d:6}
    ];

    let currentFractions = [];

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = 30;
      updateTimer();
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimer();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          switchPlayer();
        }
      }, 1000);
    }

    function updateTimer() {
      document.getElementById("timer").textContent = 
        String(timeLeft).padStart(2, '0');
    }

    function switchPlayer() {
      currentPlayer = currentPlayer === "orange" ? "green" : "orange";
      startTimer();
      render();
    }

    function generateFractions() {
      currentFractions = shuffle([...fractionPool]).slice(0, 3);
    }

    function selectFraction(index) {
      selectedFraction = currentFractions[index];
      render();
    }

    function claimTerritory(territoryId) {
      if (!selectedFraction) return;
      
      const terr = territories[territoryId];
      if (terr.owner) return;

      const units = Math.round((selectedFraction.n / selectedFraction.d) * terr.denominator);
      
      if (units + terr.filled > terr.denominator * terr.wholes) {
        alert("Too big! Try a smaller fraction or trash it.");
        return;
      }

      terr.filled += units;

      if (terr.filled >= terr.denominator * terr.wholes) {
        terr.owner = currentPlayer;
        const points = terr.wholes * 100;
        if (currentPlayer === "orange") orangeScore += points;
        else greenScore += points;
        alert(`JACKED IT! +${points} points`);
      } else {
        const points = 30;
        if (currentPlayer === "orange") orangeScore += points;
        else greenScore += points;
      }

      selectedFraction = null;
      generateFractions();
      render();
      startTimer();

      // Check if game over
      if (territories.every(t => t.owner)) {
        setTimeout(() => {
          alert(`Game Over! ${orangeScore > greenScore ? "Jackal" : "Jackrabbit"} Wins!`);
        }, 300);
      }
    }

    function trashFraction() {
      if (!selectedFraction) return;
      const points = 20;
      if (currentPlayer === "orange") orangeScore += points;
      else greenScore += points;
      
      alert("Fraction trashed! +20 points");
      selectedFraction = null;
      generateFractions();
      render();
      startTimer();
    }

    function render() {
      // Render fractions
      const fracDiv = document.getElementById("fractions");
      fracDiv.innerHTML = currentFractions.map((f, i) => `
        <div onclick="selectFraction(${i})" 
             class="bg-white/90 text-black font-bold text-2xl px-8 py-6 rounded-2xl cursor-pointer hover:scale-110 transition ${selectedFraction === currentFractions[i] ? 'ring-4 ring-yellow-400' : ''}">
          ${f.n}/${f.d}
        </div>
      `).join("");

      // Render territories
      const terrDiv = document.getElementById("territories");
      terrDiv.innerHTML = territories.map((t, i) => `
        <div onclick="claimTerritory(${i})" class="territory bg-white/10 backdrop-blur rounded-3xl p-6 cursor-pointer border-4 ${t.owner === 'orange' ? 'border-orange-400' : t.owner === 'green' ? 'border-green-400' : 'border-white/30'}">
          <div class="text-center">
            <div class="text-xl font-bold">${t.name} • ${t.model}</div>
            <div class="text-5xl font-black my-4">${t.wholes} wholes</div>
            <div class="h-3 bg-white/20 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-yellow-400 to-orange-500 transition-all" 
                   style="width: ${(t.filled / (t.denominator * t.wholes)) * 100}%"></div>
            </div>
            <div class="text-sm mt-2">${t.filled}/${t.denominator * t.wholes} filled</div>
            ${t.owner ? `<div class="mt-4 font-bold text-lg">${t.owner === 'orange' ? '🐺 JACKED' : '🐰 JACKED'}</div>` : ''}
          </div>
        </div>
      `).join("");

      document.getElementById("orange-score").textContent = orangeScore;
      document.getElementById("green-score").textContent = greenScore;
    }

    function newGame() {
      orangeScore = 0;
      greenScore = 0;
      territories.forEach(t => {
        t.filled = 0;
        t.owner = null;
      });
      currentPlayer = "orange";
      generateFractions();
      selectedFraction = null;
      render();
      startTimer();
    }

    // Start the game
    window.onload = () => {
      generateFractions();
      render();
      startTimer();
    };
  </script>
</body>
</html>
